  subject: CGPM
  type: resolution
  title: "(Concernant un accord avec l'Unesco)"
  identifier: '4'
  url: https://www.bipm.org/fr/committees/cg/cgpm/9-1948/resolution-4
  reference:
  reference_name:
  reference_page:
  approvals: []
  considerations:
  - type: considering
    date_effective: '1948-10-21'
    message: la Convention du Mètre qui assigne au Bureau international des poids
      et mesures le rôle de coordonner et d'unifier les mesures, ce qui a pour conséquence
      de faciliter les relations entre les pays dans les domaines de la Science, de
      l'Industrie et du Commerce, que, aux termes du préambule de sa Convention, l'Unesco
      a été créée pour constituer l'Institution spécialisée des Nations unies dans
      le domaine de l'Éducation, de la Science et de la Culture afin d'atteindre graduellement,
      au moyen de la coopération dans ces trois domaines, le but de paix internationale
      et de prospérité commune de l'humanité proclamé dans la Charte des Nations unies.
  actions:
  - type: decides
    date_effective: '1948-10-21'
    message: les avantages qui peuvent résulter d'une collaboration, entre le Comité
      international des poids et mesures et l'Unesco, pour la solution des questions
      que pose l'existence des Organisations internationales,
  - type: decides
    date_effective: '1948-10-21'
    message: "« le Comité international des poids et mesures est autorisé, dans le
      cadre de son statut, à conclure un accord avec l'Unesco qui, tout en garantissant
      l'indépendance des parties contractantes, leur permette de suivre leurs travaux
      réciproques et de collaborer à l'étude de questions relevant de leurs activités
      communes »."
  - type: decides
    date_effective: '1948-10-21'
    message: 10.59161/CGPM1948RES4F
- dates:
  - '1948-10-21'
  subject: CGPM
  type: resolution
  title: Dotation du BIPM
  identifier: '5'
  url: https://www.bipm.org/fr/committees/cg/cgpm/9-1948/resolution-5
  reference:
  reference_name:
  reference_page:
  approvals: []
  considerations: []
  actions:
  - type: decides
    date_effective: '1948-10-21'
    message: que le chiffre de la dotation n'a pas été modifié depuis 20 ans, que,
      dans cette même période, les attributions du Bureau ont reçu une extension importante
      entraînant une augmentation corrélative des dépenses d'entretien, que, dans
      ces conditions, il paraît nécessaire de relever le montant de la dotation,
  - type: decides
    date_effective: '1948-10-21'
    message: 10.59161/CGPM1948RES5F
- dates:
  - '1948-10-21'
  subject: CGPM
  type: resolution
  title: Proposition d'établissement d'un système pratique d'unités de mesure
  identifier: '6'
  url: https://www.bipm.org/fr/committees/cg/cgpm/9-1948/resolution-6
  reference:
  reference_name:
  reference_page:
  approvals: []
  considerations:
  - type: considering
    date_effective: '1948-10-21'
    message: que le Comité international des poids et mesures a été saisi d'une demande
      de l'Union internationale de physique le sollicitant d'adopter pour les relations
      internationales un système pratique international d'unités, recommandant le
      système MKS et une unité électrique du système pratique absolu, tout en ne recommandant
      pas que le système CGS soit abandonné par les physiciens ; qu'elle-même a reçu
      du Gouvernement français une demande analogue, accompagnée d'un projet destiné
      à servir de base de discussion pour l'établissement d'une réglementation complète
      des unités de mesure ;
  actions:
  - type: decides
    date_effective: '1948-10-21'
    message: 'le Comité international : d''ouvrir à cet effet une enquête officielle
      sur l''opinion des milieux scientifiques, techniques et pédagogiques de tous
      les pays (en offrant effectivement comme base le document français) et de la
      pousser activement ; de centraliser les réponses ; et d''émettre des recommandations
      concernant l''établissement d''un même système pratique d''unités de mesure,
      susceptible d''être adopté dans tous les pays signataires de la Convention du
      Mètre.'
  - type: decides
    date_effective: '1948-10-21'
    message: 10.59161/CGPM1948RES6F
- dates:
  - '1948-10-21'
  subject: CGPM
  type: resolution
  title: Ecriture des symboles d'unités et des nombres
  identifier: '7'
  url: https://www.bipm.org/fr/committees/cg/cgpm/9-1948/resolution-7
  reference:
  reference_name:
  reference_page:
  approvals: []
  considerations: []
  actions:
  - type: decides
    date_effective: '1948-10-21'
    message: 'Les symboles des unités sont exprimés en caractères romains, en général
      minuscules ; toutefois, si les symboles sont dérivés de noms propres, les caractères
      romains majuscules sont utilisés. Ces symboles ne sont pas suivis d''un point.
      Dans les nombres, la virgule (usage français) ou le point (usage britannique)
      sont utilisés seulement pour séparer la partie entière des nombres de leur partie
      décimale. Pour faciliter la lecture, les nombres peuvent être partagés en tranches
      de trois chiffres : ces tranches ne sont jamais séparées par des points, ni
      par des virgules.'
  - type: decides
    date_effective: '1948-10-21'
    message: 10.59161/CGPM1948RES7F La Conférence générale a abrogé un certain nombre
      de décisions concernant les unités et la terminologie, en particulier celles
      relatives au micron, au degré absolu et aux noms « degré » et « deg », 13e CGPM,
      1967/68 (Résolutions 7 et 3, respectively), ainsi qu'au litre, 16e CGPM, 1979
      (Résolution 6).
