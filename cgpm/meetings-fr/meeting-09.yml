  subject: CGPM
  type: resolution
  title: Concernant les mesures de gravité
  identifier: '2'
  url: https://www.bipm.org/fr/committees/cg/cgpm/9-1948/resolution-2
  reference:
  reference_name:
  reference_page:
  approvals: []
  considerations:
  - type: considering
    date_effective: '1948-10-21'
    message: le développement remarquable des mesures de gravité relative pour lesquelles
      la base actuellement admise date d'un demi-siècle et semble erronée d'une quantité
      appréciable, que les déterminations les plus récentes ne présentent pas encore
      une concordance suffisante et qu'il serait, par suite, désirable d'en contrôler
      les résultats par l'emploi de méthodes plus modernes,
  - type: recognizing
    date_effective: '1948-10-21'
    message: l'intérêt des déterminations absolues de l'intensité de la pesanteur
      en préparation au Bureau international des poids et mesures,
  actions:
  - type: recommends
    date_effective: '1948-10-21'
    message: aux laboratoires qui en ont la possibilité, d'effectuer des mesures analogues
      afin que, par la coordination des résultats obtenus, une base fondamentale plus
      précise puisse être proposée pour cette grandeur.
  - type: decides
    date_effective: '1948-10-21'
    message: 10.59161/CGPM1948RES2F
