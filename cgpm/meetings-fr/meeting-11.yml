  title: Système international d'unités
  identifier: '12'
  url: https://www.bipm.org/fr/committees/cg/cgpm/11-1960/resolution-12
  reference:
  reference_name:
  reference_page:
  approvals: []
  considerations:
  - type: considering
    date_effective: '1960-10-20'
    message: 'la Résolution 6 de la Dixième Conférence générale des poids et mesures
      par laquelle elle a adopté les six unités devant servir de base à l''établissement
      d''un système pratique de mesure pour les relations internationales :   longueur
      mètre m masse kilogramme kg temps seconde s intensité de courant électrique
      ampère A température thermodynamique degré Kelvin °K intensité lumineuse candela
      cd la Résolution 3 adoptée par le Comité international des poids et mesures
      en 1956, les recommandations adoptées par le Comité international des poids
      et mesures en 1958 concernant l''abréviation du nom de ce système et les préfixes
      pour la formation des multiples et sous-multiples des unités,'
  actions:
  - type: decides
    date_effective: '1960-10-20'
    message: " "
  - type: decides
    date_effective: '1960-10-20'
    message: " "
  - type: decides
    date_effective: '1960-10-20'
    message: '10.59161/CGPM1960RES12F La Conférence générale a ultérieurement abrogé
      certaines de ces décisions et complété la liste des préfixes SI : Le nom et
      symbole de l''unité de température thermodynamique ont été modifiés par la 13e
      CGPM en 1967 (Résolution 3). Une septième unité de base, la mole, fut adoptée
      par la 14e CGPM en 1971 (Résolution 3). D''autres préfixes furent adoptés par
      la 12e CGPM en 1964 (Résolution 8), par la 15e CGPM en 1975 (Résolution 10),
      par la 19e CGPM en 1991 (Résolution 4) et par la 27e CGPM en 2022 (Résolution
      3) . La 20e CGPM a abrogé en 1995 la classe des unités supplémentaires dans
      le SI (Résolution 8). Ces unités sont maintenant considérées comme des unités
      dérivées. La 13e CGPM en 1967 (Résolution 6) a ajouté d''autres unités à cette
      liste d''unités dérivées, qui, en principe, n''est pas limitative.'
- dates:
  - '1960-10-20'
  subject: CGPM
  type: resolution
  title: Décimètre cube et litre
  identifier: '13'
  url: https://www.bipm.org/fr/committees/cg/cgpm/11-1960/resolution-13
  reference:
  reference_name:
  reference_page:
  approvals: []
  considerations:
  - type: considering
    date_effective: '1960-10-20'
    message: que le décimètre cube et le litre sont inégaux et diffèrent d'environ
      28 millionièmes, que les déterminations de grandeurs physiques impliquant des
      mesures de volume ont une précision de plus en plus élevée, aggravant par là
      les conséquences d'une confusion possible entre le décimètre cube et le litre,
  actions:
  - type: invites / further invites
    date_effective: '1960-10-20'
    message: le Comité international des poids et mesures à mettre ce problème à l'étude
      et à présenter ses conclusions à la Douzième Conférence générale.
  - type: decides
    date_effective: '1960-10-20'
    message: 10.59161/CGPM1960RES13F
