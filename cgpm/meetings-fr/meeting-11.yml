  title: Dotation du Bureau international
  identifier: '5'
  url: https://www.bipm.org/fr/committees/cg/cgpm/11-1960/resolution-5
  reference:
  reference_name:
  reference_page:
  approvals: []
  considerations:
  - type: considering
    date_effective: '1960-10-20'
    message: que la précision exigée dans les mesures dont le Bureau international
      des poids et mesures a la charge s'améliore constamment et exige des instruments
      de plus en plus coûteux, que les domaines d'activité du Bureau international
      sont étendus aux étalons de mesure des radiations ionisantes, que dans toutes
      ses activités le Bureau international doit être servi par un personnel de haute
      qualification scientifique de recrutement difficile,
  actions:
  - type: decides
    date_effective: '1960-10-20'
    message: sans avis contraire la proposition du Comité international dûment notifiée
      à l'avance aux Gouvernements conformément à l'article 6, paragraphe 5, du Règlement
      annexé à la Convention du Mètre de 1875 modifiée en 1921,
  - type: decides
    date_effective: '1960-10-20'
    message: d'accroître la partie fixe de la dotation annuelle, de façon que soit
      porté à 900 000 francs-or l'ensemble des parties fixe et complémentaire de la
      dotation annuelle couvrant les dépenses d'entretien du Bureau international
      et du Comité international des poids et mesures. Le montant de la partie fixe
      ainsi calculée s'appliquera aux contributions payables dans les années 1962
      et suivantes.
  - type: decides
    date_effective: '1960-10-20'
    message: 10.59161/CGPM1960RES5F
- dates:
  - '1960-10-20'
  subject: CGPM
  type: resolution
  title: Définition du mètre
  identifier: '6'
  url: https://www.bipm.org/fr/committees/cg/cgpm/11-1960/resolution-6
  reference:
  reference_name:
  reference_page:
  approvals: []
  considerations:
  - type: considering
    date_effective: '1960-10-20'
    message: que le Prototype international ne définit pas le mètre avec une précision
      suffisante pour les besoins actuels de la métrologie, qu'il est d'autre part
      désirable d'adopter un étalon naturel et indestructible,
  actions:
  - type: decides
    date_effective: '1960-10-20'
    message: 10.59161/CGPM1960RES6F Définition abrogée en 1983 par la 17e CGPM (Résolution
      1).
- dates:
  - '1960-10-20'
  subject: CGPM
  type: resolution
  title: Définition du mètre
  identifier: '7'
  url: https://www.bipm.org/fr/committees/cg/cgpm/11-1960/resolution-7
  reference:
  reference_name:
  reference_page:
  approvals: []
  considerations: []
  actions:
  - type: invites / further invites
    date_effective: '1960-10-20'
    message: 'le Comité international   (1) Dans sa session d''octobre 1960, le Comité
      international des poids et mesures a adopté la Recommandation suivante concernant
      les premières instructions pour la mise en pratique de la définition du mètre
      : « Conformément au paragraphe 1 de la Résolution 7 adoptée par la Onzième Conférence
      générale des poids et mesures (octobre 1960), le Comité international des poids
      et mesures recommande que la radiation du krypton 86 adoptée comme étalon fondamental
      de longueur soit réalisée au moyen d''une lampe à décharge à cathode chaude
      contenant du krypton 86 d''une pureté non inférieure à 99 pour cent, en quantité
      suffisante pour assurer la présence de krypton solide à la température de 64
      °K, cette lampe étant munie d''un capillaire ayant les caractéristiques suivantes
      : diamètre intérieur 2 à 4 millimètres, épaisseur des parois 1 millimètre environ.
      « On estime que la longueur d''onde de la radiation émise par la colonne positive
      est égale, à 1 cent millionième (10–8) près, à la longueur d''onde correspondant
      à la transition entre les niveaux non perturbés, lorsque les conditions suivantes
      sont satisfaites :'
  - type: decides
    date_effective: '1960-10-20'
    message: 10.59161/CGPM1960RES7F
