  type: resolution
  title: Définition de l'unité de temps (seconde)
  identifier: '9'
  url: https://www.bipm.org/fr/committees/cg/cgpm/11-1960/resolution-9
  reference:
  reference_name:
  reference_page:
  approvals: []
  considerations:
  - type: considering
    date_effective: '1960-10-20'
    message: le pouvoir donné par la Dixième Conférence générale des poids et mesures
      au Comité international des poids et mesures de prendre une décision au sujet
      de la définition de l'unité fondamentale de temps, la décision prise par le
      Comité international des poids et mesures dans sa session de 1956,
  actions:
  - type: decides
    date_effective: '1960-10-20'
    message: 'la définition suivante : « La seconde est la fraction 1/31 556 925,9747
      de l''année tropique pour 1900 janvier 0 à 12 heures de temps des éphémérides.
      »'
  - type: decides
    date_effective: '1960-10-20'
    message: 10.59161/CGPM1960RES9F Définition abrogée en 1967 par la 13e CGPM (Résolution
      1).
- dates:
  - '1960-10-20'
  subject: CGPM
  type: resolution
  title: Définition de l'unité de temps
  identifier: '10'
  url: https://www.bipm.org/fr/committees/cg/cgpm/11-1960/resolution-10
  reference:
  reference_name:
  reference_page:
  approvals: []
  considerations:
  - type: considering
    date_effective: '1960-10-20'
    message: qu'un tel étalon atomique d'intervalle de temps est indispensable pour
      les exigences de la haute métrologie,
  actions:
  - type: decides
    date_effective: '1960-10-20'
    message: les résultats expérimentaux obtenus par des laboratoires compétents pendant
      les dernières années, qui prouvent qu'un étalon d'intervalle de temps basé sur
      une transition entre deux niveaux d'énergie d'un atome ou d'une molécule peut
      être réalisé et reproduit avec une précision très élevée,
  - type: invites / further invites
    date_effective: '1960-10-20'
    message: les laboratoires nationaux et internationaux experts dans ce domaine
      à poursuivre aussi activement que possible leurs études, le Comité international
      des poids et mesures à coopérer sans retard avec les organismes internationaux
      intéressés et à coordonner les travaux en vue de permettre à la Douzième Conférence
      générale de prendre une résolution sur ce point.
  - type: decides
    date_effective: '1960-10-20'
    message: 10.59161/CGPM1960RES10F
- dates:
  - '1960-10-20'
