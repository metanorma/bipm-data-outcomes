  type: resolution
  title: Unité SI de temps (seconde)
  identifier: '1'
  url: https://www.bipm.org/fr/committees/cg/cgpm/13-1967/resolution-1
  reference:
  reference_name:
  reference_page:
  approvals: []
  considerations:
  - type: considering
    date_effective: '1967-10-16'
    message: que la définition de la seconde décidée par le Comité international des
      poids et mesures à sa session de 1956 (Résolution 1) et ratifiée par la Résolution
      9 de la Onzième Conférence générale (1960), puis maintenue par la Résolution
      5 de la Douzième Conférence générale (1964) ne suffit pas aux besoins actuels
      de la métrologie, qu'à sa session de 1964 le Comité international des poids
      et mesures, habilité par la Résolution 5 de la Douzième Conférence (1964), a
      désigné pour répondre à ces besoins un étalon atomique de fréquence à césium
      à employer temporairement, que cet étalon de fréquence est maintenant suffisamment
      éprouvé et suffisamment précis pour servir à une définition de la seconde répondant
      aux besoins actuels, que le moment est venu de remplacer la définition actuellement
      en vigueur de l'unité de temps du Système international d'unités par une définition
      atomique fondée sur cet étalon,
  actions:
  - type: decides
    date_effective: '1967-10-16'
    message: 10.59161/CGPM1967RES1F Lors de sa session de 1997, le Comité international
      a confirmé que cette définition se réfère à un atome de césium au repos, à une
      température de 0 K. Cette définition de la seconde a été abrogée en 2018 par
      la 26e CGPM (Résolution 1), la nouvelle définition entrant en vigueur en 2019.
- dates:
  - '1967-10-16'
  subject: CGPM
  type: resolution
  title: Unité SI de temps (seconde)
  identifier: '2'
  url: https://www.bipm.org/fr/committees/cg/cgpm/13-1967/resolution-2
  reference:
  reference_name:
  reference_page:
  approvals: []
  considerations:
  - type: considering
    date_effective: '1967-10-16'
    message: que l'étalon de fréquence à césium est encore perfectible et que des
      expériences en cours autorisent l'espoir de réaliser d'autres étalons ayant
      des qualités encore meilleures pour servir à définir la seconde,
  actions:
  - type: invites / further invites
    date_effective: '1967-10-16'
    message: les organisations et laboratoires experts dans le domaine des étalons
      atomiques de fréquence à poursuivre activement leurs études.
  - type: decides
    date_effective: '1967-10-16'
    message: 10.59161/CGPM1967RES2F
- dates:
  - '1967-10-16'
  subject: CGPM
  type: resolution
  title: Unité SI de température thermodynamique (kelvin)
  identifier: '3'
  url: https://www.bipm.org/fr/committees/cg/cgpm/13-1967/resolution-3
  reference:
  reference_name:
  reference_page:
  approvals: []
  considerations:
  - type: considering
    date_effective: '1967-10-16'
    message: les noms « degré Kelvin » et « degré », les symboles « °K » et « deg
      » et leurs règles d'emploi contenus dans la Résolution 7 de la Neuvième Conférence
      générale (1948), dans la Résolution 12 de la Onzième Conférence générale (1960)
      et la décision prise par le Comité international des poids et mesures en 1962
      (PV, 30, 27), que l'unité de température thermodynamique et l'unité d'intervalle
      de température sont une même unité qui devrait être désignée par un nom unique
      et par un symbole unique,
  actions:
  - type: decides
    date_effective: '1967-10-16'
    message: 10.59161/CGPM1967RES3F
- dates:
  - '1967-10-16'
  subject: CGPM
  type: resolution
  title: Définition de l'unité SI de température thermodynamique (kelvin)
  identifier: '4'
  url: https://www.bipm.org/fr/committees/cg/cgpm/13-1967/resolution-4
  reference:
  reference_name:
  reference_page:
  approvals: []
  considerations:
  - type: considering
    date_effective: '1967-10-16'
    message: qu'il est utile de formuler dans une rédaction explicite la définition
      de l'unité de température thermodynamique contenue dans la Résolution 3 de la
      Dixième Conférence générale (1954),
  actions:
  - type: decides
    date_effective: '1967-10-16'
    message: 'd''exprimer cette définition de la façon suivante : « Le kelvin, unité
      de température thermodynamique, est la fraction 1/273,16 de la température thermodynamique
      du point triple de l''eau. »'
  - type: decides
    date_effective: '1967-10-16'
    message: 10.59161/CGPM1967RES4F Voir la Recommandation 5 (CI-1989) du CIPM relative
      à l'Échelle internationale de température de 1990. Cette définition du kelvin
      a été abrogée en 2018 par la 26e CGPM (Résolution 1), la nouvelle définition
      entrant en vigueur en 2019.
- dates:
  - '1967-10-16'
  subject: CGPM
  type: resolution
  title: Unité SI d'intensité lumineuse (candela)
  identifier: '5'
  url: https://www.bipm.org/fr/committees/cg/cgpm/13-1967/resolution-5
  reference:
  reference_name:
  reference_page:
  approvals: []
  considerations:
  - type: considering
    date_effective: '1967-10-16'
    message: la définition de l'unité d'intensité lumineuse ratifiée par la Neuvième
      Conférence générale (1948) et contenue dans la « Résolution concernant le changement
      des unités photométriques » adoptée par le Comité international des poids et
      mesures en 1946 (PV, 20, 119) en vertu des pouvoirs conférés par la Huitième
      Conférence générale (1933), que cette définition fixe bien la grandeur de l'unité
      d'intensité lumineuse mais prête à des critiques d'ordre rédactionnel,
  actions:
  - type: decides
    date_effective: '1967-10-16'
    message: 'd''exprimer la définition de la candela de la façon suivante : « La
      candela est l''intensité lumineuse, dans la direction perpendiculaire, d''une
      surface de 1/600 000 mètre carré d''un corps noir à la température de congélation
      du platine sous la pression de 101 325 newtons par mètre carré. »'
  - type: decides
    date_effective: '1967-10-16'
    message: 10.59161/CGPM1967RES5F Définition abrogée en 1979 par la 16e CGPM (Résolution
      3).
