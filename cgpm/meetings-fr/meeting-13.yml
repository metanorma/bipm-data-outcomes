  subject: CGPM
  type: resolution
  title: Dotation du Bureau international pour la période 1969-1972
  identifier: '10'
  url: https://www.bipm.org/fr/committees/cg/cgpm/13-1967/resolution-10
  reference:
  reference_name:
  reference_page:
  approvals: []
  considerations:
  - type: considering
    date_effective: '1967-10-16'
    message: que pendant les séances tenues en octobre 1967 elle n'a pas décidé le
      montant exact des dotations du Bureau international des poids et mesures pour
      les quatre années 1969-1972, qu'elle a reconnu la nécessité d'une augmentation
      annuelle d'environ 9 pour cent pendant ces quatre années pour que le Bureau
      international se maintienne à son niveau actuel, mais qu'elle veut que le niveau
      du Bureau international s'élève avec le progrès de la métrologie en utilisant
      des ressources supplémentaires qui restent à définir,
  actions:
  - type: decides
    date_effective: '1967-10-16'
    message: que la partie fixe de la dotation annuelle à partir du 1er janvier 1969
      sera augmentée par rapport à ce qu'elle était au 1er octobre 1967, de façon
      que l'ensemble de la partie fixe et de la partie complémentaire calculée à cette
      dernière date ne soit pas inférieur à  
  - type: requests
    date_effective: '1967-10-16'
    message: au Comité international des poids et mesures de fournir aux États de
      la Convention du Mètre, dans un délai inférieur à six mois, une étude documentée
      qui permette aux États de décider la nature et le montant des ressources supplémentaires
      à consacrer au Bureau international et d'apprécier les conséquences de leur
      décision sur l'avenir du Bureau international.  
  - type: decides
    date_effective: '1967-10-16'
    message: 10.59161/CGPM1967RES10F
