  reference:
  reference_name:
  reference_page:
  approvals: []
  considerations:
  - type: considering
    date_effective: '1967-10-16'
    message: que les dotations minimales décidées par sa Résolution 10, à savoir  
      doivent être complétées par des ressources supplémentaires destinées à assurer
      le développement du Bureau international des poids et mesures,
  actions:
  - type: decides
    date_effective: '1967-10-16'
    message: 'd''allouer au Bureau international, dans les quatre années 1969-1972,
      les sommes supplémentaires suivantes :  '
  - type: authorizes
    date_effective: '1967-10-16'
    message: que ces sommes supplémentaires puissent être payées en monnaie nationale
      ;
  - type: invites / further invites
    date_effective: '1967-10-16'
    message: les États qui choisiraient d'effectuer ces paiements en monnaie nationale
      à se mettre d'accord avec le Comité international des poids et mesures pour
      qu'ils soient employés à la satisfaction des besoins du Bureau international
      des poids et mesures en tenant compte des lois du pays.
  - type: decides
    date_effective: '1967-10-16'
    message: 10.59161/CGPM1967RES12F
