  subject: CGPM
  type: resolution
  title: Sur la définition des échelles de temps
  identifier: '2'
  url: https://www.bipm.org/fr/committees/cg/cgpm/26-2018/resolution-2
  reference:
  reference_name:
  reference_page:
  approvals: []
  considerations:
  - type: considering
    date_effective: '2018-11-16'
    message: que la Résolution 1 adoptée par la CGPM à sa 14e réunion (1971) demande
      au CIPM de donner une définition du Temps atomique international (TAI), aucune
      définition exhaustive et autonome du TAI n'a été établie de façon officielle
      par le CIPM, le Comité consultatif pour la définition de la seconde (CCDS) a
      proposé, dans sa Recommandation S2 (1970), une définition du TAI qui a été complétée
      en 1980 par une déclaration du CCDS, la CGPM, lors de sa 15e réunion (1975),
      a constaté que le Temps universel coordonné (UTC), dérivé du TAI, est à la base
      du temps civil et a estimé son emploi parfaitement recommandable,
  - type: recognizing
    date_effective: '2018-11-16'
    message: 'que la mission du BIPM est d''assurer et de promouvoir la comparabilité
      mondiale des mesures, en fournissant notamment un système international d''unités
      cohérent, l''Union astronomique internationale (UAI) et l''Union géodésique
      et géophysique internationale (UGGI), avec l''Association internationale de
      géodésie (AIG), ont pour responsabilité de définir des systèmes de référence
      pour les applications spatiales et terrestres, l''Union internationale des télécommunications
      – Secteur des radiocommunications (UIT-R) a pour responsabilité de coordonner
      la dissémination des signaux de temps et de fréquence et de formuler des recommandations
      pertinentes, le Service international de la rotation terrestre et des systèmes
      de référence (IERS), un service de l''UAI et de l''UGGI, a pour responsabilité
      de fournir les informations requises afin de relier les systèmes de référence
      terrestre et céleste, parmi lesquelles : les mesures variant dans le temps de
      l''angle de rotation de la Terre, UT1 – UTC ; la prédiction de faible précision
      d''UT1 – UTC transmise par les signaux de temps, DUT1 ; et les données permettant
      de décider et d''annoncer l''insertion des secondes intercalaires,'
  - type: noting
    date_effective: '2018-11-16'
    message: 'que la Résolution A4 (1991) de l''UAI définit, dans ses Recommandations
      I et II, le Système de référence géocentrique comme un système de coordonnées
      spatio-temporelles pour la Terre dans le cadre de la théorie de relativité générale,
      et nomme, dans sa Recommandation III, le temps-coordonnée de ce système de référence
      le « Temps coordonnée géocentrique (TCG) », la Résolution A4 (1991) de l''UAI
      définit en outre, dans sa Recommandation IV, le Temps terrestre (TT) comme un
      autre temps-coordonnée dans le Système de référence géocentrique, différant
      du TCG par une marche constante, l''unité d''échelle de TT étant choisie de
      sorte qu''elle s''accorde avec la seconde du SI sur le géoïde, la Résolution
      B1.9 (2000) de l''UAI redéfinit TT comme une échelle de temps qui diffère du
      TCG par une marche constante : dTT/dTCG = 1 – LG, où LG = 6,969 290 134 × 10–10
      est une constante de définition (la valeur numérique de LG a été choisie pour
      se conformer à la valeur de W0 = 62 636 856,0 m2 s–2 pour le potentiel de pesanteur
      sur le géoïde tel que recommandé par la Commission spéciale 3 de l''AIG en 1999),
      une redéfinition de TT en 2000 a introduit une ambiguïté entre TT et le TAI
      car le CCDS avait déclaré en 1980 que le TAI avait « comme unité d''échelle
      la seconde du SI telle qu''elle est réalisée sur le géoïde en rotation » alors
      que la définition de TT ne fait pas référence au géoïde,'
  actions:
  - type: declares
    date_effective: '2018-11-16'
    message: que le TAI est une échelle de temps continue produite par le BIPM à partir
      des meilleures réalisations de la seconde du SI et que c'est une réalisation
      de TT comme défini dans la Résolution B1.9 (2000) de l'UAI, pour la conversion
      du temps propre d'une horloge en TAI, le décalage relativiste de fréquence est
      calculé par rapport à la surface équipotentielle W0 = 62 636 856,0 m2 s–2 du
      potentiel de pesanteur de la Terre, adoptée de façon conventionnelle, en conformité
      avec la constante LG définissant la marche de TT, tel qu'indiqué dans la Résolution
      A4 (1991) de l'UAI, TT – TAI est égal à 32,184 s exactement au 1er janvier 1977,
      0h TAI au géocentre, pour assurer une continuité de TT avec le temps des éphémérides,
      l'UTC produit par le BIPM, fondé sur le TAI, est l'unique échelle de temps recommandée
      comme référence internationale et qu'il est à la base du temps civil dans la
      plupart des pays, l'UTC diffère du TAI seulement par un nombre entier de secondes,
      tel que publié par le BIPM, les utilisateurs peuvent dériver l'angle de rotation
      de la Terre en appliquant à l'UTC les valeurs observées ou prédites d'UT1 –
      UTC, telles que fournies par l'IERS, l'UTC fournit un moyen de mesurer les intervalles
      de temps et de disséminer l'étalon de fréquence pendant les intervalles qui
      ne comprennent pas de secondes intercalaires, la traçabilité à l'UTC est obtenue
      par l'intermédiaire des réalisations locales en temps réel maintenues par les
      laboratoires participant au calcul de l'UTC, dénommées « UTC(k) » où « k » identifie
      un laboratoire particulier,
  - type: confirms
    date_effective: '2018-11-16'
    message: que le Temps atomique international (TAI) est une échelle de temps continue
      produite par le BIPM à partir des meilleures réalisations de la seconde du SI.
      Le TAI est une réalisation du Temps terrestre (TT) ayant la même marche que
      TT, tel que défini par l'UAI dans sa Résolution B1.9 (2000), le Temps universel
      coordonné (UTC) est une échelle de temps produite par le BIPM ayant la même
      marche que le TAI mais différant du TAI par un nombre entier de secondes seulement,
  - type: recommends
    date_effective: '2018-11-16'
    message: à toutes les organisations et unions concernées de prendre en compte
      ces définitions et de travailler ensemble afin de parvenir à une compréhension
      commune des échelles de temps de référence, de leur réalisation et de leur dissémination,
      l'objectif étant d'examiner les limites actuelles de l'amplitude maximale d'UT1
      – UTC afin de répondre aux besoins des communautés d'utilisateurs actuelles
      et à venir, à toutes les organisations et unions concernées de travailler ensemble
      pour améliorer davantage l'exactitude de la prédiction d'UT1 – UTC et sa méthode
      de dissémination afin de satisfaire les futures exigences des utilisateurs.
  - type: decides
    date_effective: '2018-11-16'
    message: 10.59161/CGPM2018RES2F
