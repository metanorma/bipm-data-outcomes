  type: resolution
  title: Sur la révision du Système international d'unités (SI)
  identifier: '1'
  url: https://www.bipm.org/fr/committees/cg/cgpm/26-2018/resolution-1
  reference:
  reference_name:
  reference_page:
  approvals: []
  considerations:
  - type: considering
    date_effective: '2018-11-16'
    message: qu'il est essentiel de disposer d'un Système international d'unités (SI)
      uniforme et accessible dans le monde entier, pour le commerce international,
      l'industrie de haute technologie, la santé humaine et la sécurité, la protection
      de l'environnement, les études sur l'évolution du climat, ainsi que la science
      fondamentale qui étaye tous ces domaines, que les unités du SI doivent être
      stables sur le long terme, auto-cohérentes et réalisables dans la pratique,
      en étant fondées sur la description théorique actuelle de la nature, au plus
      haut niveau, qu'une révision du SI visant à satisfaire ces exigences a été proposée
      dans la Résolution 1 adoptée à l'unanimité par la CGPM à sa 24e réunion (2011),
      qui expose en détail une nouvelle façon de définir le SI à partir d'un ensemble
      de sept constantes, choisies parmi les constantes fondamentales de la physique
      et d'autres constantes de la nature, à partir desquelles les définitions des
      sept unités de base sont déduites, que les conditions requises par la CGPM à
      sa 24e réunion (2011), confirmées à sa 25e réunion (2014), pour procéder à l'adoption
      d'une telle révision du SI sont désormais remplies,
  actions:
  - type: decides
    date_effective: '2018-11-16'
    message: 'qu''à compter du 20 mai 2019, le Système international d''unités, le
      SI, est le système d''unités selon lequel : où les unités hertz, joule, coulomb,
      lumen et watt, qui ont respectivement pour symbole Hz, J, C, lm et W, sont reliées
      aux unités seconde, mètre, kilogramme, ampère, kelvin, mole et candela, qui
      ont respectivement pour symbole s, m, kg, A, K, mol et cd, selon les relations
      Hz = s–1, J = kg m2 s–2, C = A s, lm = cd m2 m–2 = cd sr, et W = kg m2 s–3,
      la fréquence de la transition hyperfine de l''état fondamental de l''atome de
      césium 133 non perturbé, ΔνCs, est égale à 9 192 631 770 Hz, la vitesse de la
      lumière dans le vide, c, est égale à 299 792 458 m/s, la constante de Planck,
      h, est égale à 6,626 070 15 × 10–34 J s, la charge élémentaire, e, est égale
      à 1,602 176 634 × 10–19 C, la constante de Boltzmann, k, est égale à 1,380 649 × 10–23
      J/K, la constante d''Avogadro, NA, est égale à 6,022 140 76 × 1023 mol–1, l''efficacité
      lumineuse d''un rayonnement monochromatique de fréquence 540 × 1012 Hz, Kcd,
      est égale à 683 lm/W,'
  - type: decides
    date_effective: '2018-11-16'
    message: des conséquences de la révision du SI concernant les unités de base du
      SI, énoncées dans la Résolution 1 adoptée par la CGPM à sa 24e réunion (2011),
      et les confirme dans les annexes de la présente résolution, qui ont même force
      que la résolution elle-même,
  - type: invites / further invites
    date_effective: '2018-11-16'
    message: le Comité international des poids et mesures (CIPM) à publier une nouvelle
      édition de la Brochure sur le SI, « Le Système international d'unités », contenant
      une description complète du SI révisé.  
  - type: decides
    date_effective: '2018-11-16'
    message: 'Il résulte de la nouvelle définition du SI décrite ci-dessus qu''à compter
      du 20 mai 2019 : la définition de la seconde en vigueur depuis 1967/68 (13e réunion
      de la CGPM, Résolution 1) est abrogée, la définition du mètre en vigueur depuis
      1983 (17e réunion de la CGPM, Résolution 1) est abrogée, la définition du kilogramme
      en vigueur depuis 1889 (1ère réunion de la CGPM, 1889, 3e réunion de la CGPM,
      1901), établie à partir de la masse du prototype international du kilogramme,
      est abrogée, la définition de l''ampère en vigueur depuis 1948 (9e réunion de
      la CGPM), établie à partir de la définition proposée par le CIPM (1946, Résolution 2),
      est abrogée, la définition du kelvin en vigueur depuis 1967/68 (13e réunion
      de la CGPM, Résolution 4) est abrogée, la définition de la mole en vigueur depuis
      1971 (14e réunion de la CGPM, Résolution 3) est abrogée, la définition de la
      candela en vigueur depuis 1979 (16e réunion de la CGPM, Résolution 3) est abrogée,
      la décision d''adopter les valeurs conventionnelles de la constante de Josephson
      KJ-90 et de la constante de von Klitzing RK-90, prise par le CIPM (1988, Recommandations
      1 et 2) à la demande de la CGPM (18e réunion de la CGPM, 1987, Résolution 6)
      pour l''établissement des représentations du volt et de l''ohm à l''aide des
      effets Josephson et Hall quantique, respectivement, est abrogée.'
  - type: decides
    date_effective: '2018-11-16'
    message: 'Il résulte de la nouvelle définition du SI décrite ci-dessus, et des
      valeurs recommandées dans l''ajustement spécial de 2017 du Committee on Data
      for Science and Technology (CODATA), sur lesquelles se fondent les valeurs des
      constantes choisies pour définir le SI, qu''à compter du 20 mai 2019 : la masse
      du prototype international du kilogramme, m(K), est égale à 1 kg avec une incertitude-type
      relative égale à celle de la valeur recommandée de h au moment de l''adoption
      de la présente résolution, à savoir 1,0 × 10–8 ; dans le futur, sa valeur sera
      déterminée de façon expérimentale, la perméabilité magnétique du vide, μ0, est
      égale à 4π × 10–7 H m–1 avec une incertitude-type relative égale à celle de
      la valeur recommandée de la constante de structure fine α au moment de l''adoption
      de la présente résolution, à savoir 2,3 × 10–10 ; dans le futur, sa valeur sera
      déterminée de façon expérimentale, la température thermodynamique du point triple
      de l''eau, TTPW, est égale à 273,16 K avec une incertitude-type relative presque
      égale à celle de la valeur recommandée de k au moment de l''adoption de la présente
      résolution, à savoir 3,7 × 10–7 ; dans le futur, sa valeur sera déterminée de
      façon expérimentale, la masse molaire du carbone 12, M(12C), est égale à 0,012 kg
      mol–1 avec une incertitude-type relative égale à celle de la valeur recommandée
      de NA h au moment de l''adoption de la présente résolution, à savoir 4,5 × 10–10 ;
      dans le futur, sa valeur sera déterminée de façon expérimentale.'
  - type: decides
    date_effective: '2018-11-16'
    message: 'La nouvelle définition du SI décrite ci-dessus, fondée sur les valeurs
      numériques fixées des constantes choisies, permet de déduire la définition de
      chacune des sept unités de base du SI à l''aide d''une ou plusieurs de ces constantes,
      selon les cas. Les définitions qui en découlent, qui prendront effet à compter
      du 20 mai 2019, sont les suivantes : La seconde, symbole s, est l''unité de
      temps du SI. Elle est définie en prenant la valeur numérique fixée de la fréquence
      du césium, ΔνCs, la fréquence de la transition hyperfine de l''état fondamental
      de l''atome de césium 133 non perturbé, égale à 9 192 631 770 lorsqu''elle est
      exprimée en Hz, unité égale à s–1. Le mètre, symbole m, est l''unité de longueur
      du SI. Il est défini en prenant la valeur numérique fixée de la vitesse de la
      lumière dans le vide, c, égale à 299 792 458 lorsqu''elle est exprimée en m/s,
      la seconde étant définie en fonction de ΔνCs. Le kilogramme, symbole kg, est
      l''unité de masse du SI. Il est défini en prenant la valeur numérique fixée
      de la constante de Planck, h, égale à 6,626 070 15 × 10–34 lorsqu''elle est
      exprimée en J s, unité égale à kg m2 s–1, le mètre et la seconde étant définis
      en fonction de c et ΔνCs. L''ampère, symbole A, est l''unité de courant électrique
      du SI. Il est défini en prenant la valeur numérique fixée de la charge élémentaire,
      e, égale à 1,602 176 634 × 10–19 lorsqu''elle est exprimée en C, unité égale
      à A s, la seconde étant définie en fonction de ΔνCs. Le kelvin, symbole K, est
      l''unité de température thermodynamique du SI. Il est défini en prenant la valeur
      numérique fixée de la constante de Boltzmann, k, égale à 1,380 649 × 10–23 lorsqu''elle
      est exprimée en J K–1, unité égale à kg m2 s–2 K–1, le kilogramme, le mètre
      et la seconde étant définis en fonction de h, c et ΔνCs. La mole, symbole mol,
      est l''unité de quantité de matière du SI. Une mole contient exactement 6,022
      140 76 × 1023 entités élémentaires. Ce nombre, appelé « nombre d''Avogadro »,
      correspond à la valeur numérique fixée de la constante d''Avogadro, NA, lorsqu''elle
      est exprimée en mol–1. La quantité de matière, symbole n, d''un système est
      une représentation du nombre d''entités élémentaires spécifiées. Une entité
      élémentaire peut être un atome, une molécule, un ion, un électron, ou toute
      autre particule ou groupement spécifié de particules. La candela, symbole cd,
      est l''unité du SI d''intensité lumineuse dans une direction donnée. Elle est
      définie en prenant la valeur numérique fixée de l''efficacité lumineuse d''un
      rayonnement monochromatique de fréquence 540 × 1012 Hz, Kcd, égale à 683 lorsqu''elle
      est exprimée en lm W–1, unité égale à cd sr W–1, ou cd sr kg–1 m–2 s3, le kilogramme,
      le mètre et la seconde étant définis en fonction de h, c et ΔνCs.'
  - type: decides
    date_effective: '2018-11-16'
    message: 10.59161/CGPM2018RES1F
- dates:
