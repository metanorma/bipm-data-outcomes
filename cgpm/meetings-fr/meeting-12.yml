  type: resolution
  title: Section des radiations ionisantes du Bureau international ; troisième dotation
    exceptionnelle
  identifier: '1'
  url: https://www.bipm.org/fr/committees/cg/cgpm/12-1964/resolution-1
  reference:
  reference_name:
  reference_page:
  approvals: []
  considerations:
  - type: considering
    date_effective: '1964-10-13'
    message: la Résolution 1 de la Onzième Conférence générale des poids et mesures
      invitant le Comité international des poids et mesures à organiser au Bureau
      international des poids et mesures une section des étalons de mesure des radiations
      ionisantes,
  actions:
  - type: approves
    date_effective: '1964-10-13'
    message: les décisions d'exécution prises par le Comité international des poids
      et mesures et lui adresse, ainsi qu'au Bureau international, ses félicitations
      pour les résultats obtenus,
  - type: invites / further invites
    date_effective: '1964-10-13'
    message: le Comité international des poids et mesures à continuer sa tâche selon
      les instructions de la Résolution 1 de la Onzième Conférence générale.
  - type: decides
    date_effective: '1964-10-13'
    message: 10.59161/CGPM1964RES1F
- dates:
  - '1964-10-13'
  subject: CGPM
  type: resolution
  title: Section des radiations ionisantes du Bureau international ; troisième dotation
    exceptionnelle
  identifier: '2'
  url: https://www.bipm.org/fr/committees/cg/cgpm/12-1964/resolution-2
  reference:
  reference_name:
  reference_page:
  approvals: []
  considerations:
  - type: considering
    date_effective: '1964-10-13'
    message: l'état d'avancement de l'organisation de la section des étalons de mesure
      des radiations ionisantes et le travail déjà effectué, la nécessité de compléter
      d'urgence les travaux de génie civil et l'équipement de base nécessaires au
      fonctionnement de cette section,
  actions:
  - type: decides
    date_effective: '1964-10-13'
    message: d'allouer au Bureau international des poids et mesures pour ces dépenses
      d'achèvement une troisième dotation exceptionnelle d'un montant de 850 000 francs-or,
      répartie entre les États contractants selon les mêmes règles que la dotation
      ordinaire annuelle et payable dès que possible.
  - type: decides
    date_effective: '1964-10-13'
    message: 10.59161/CGPM1964RES2F
- dates:
  - '1964-10-13'
  subject: CGPM
  type: resolution
  title: Dotation du Bureau international
  identifier: '3'
  url: https://www.bipm.org/fr/committees/cg/cgpm/12-1964/resolution-3
  reference:
  reference_name:
  reference_page:
  approvals: []
  considerations:
  - type: considering
    date_effective: '1964-10-13'
    message: les commentaires du Comité international des poids et mesures joints
      à la Convocation de la Conférence, pour exposer la fonction du Bureau international
      des poids et mesures et les besoins absolus d'un organisme scientifique vivant,
      qui veut maintenir une activité efficace, les avis recueillis depuis décembre
      1963 dans les milieux compétents qui ont étudié ces commentaires ;
  actions:
  - type: approves
    date_effective: '1964-10-13'
    message: l'étude minutieuse faite par le Comité international des poids et mesures,
  - type: decides
    date_effective: '1964-10-13'
    message: que les moyens évalués par ce Comité sont en conformité avec ce que le
      monde entier attend du Bureau international des poids et mesures,
  - type: decides
    date_effective: '1964-10-13'
    message: un appel à tous les États adhérents de la Convention du Mètre de faire
      tout ce qui dépend d'eux pour un travail fructueux du Comité international des
      poids et mesures et du Bureau international, et
  - type: decides
    date_effective: '1964-10-13'
    message: le Comité international des poids et mesures de prendre toutes les mesures
      nécessaires à l'expansion ultérieure du Système Métrique et à l'adhésion de
      nouveaux États.
  - type: decides
    date_effective: '1964-10-13'
    message: 10.59161/CGPM1964RES3F
- dates:
  - '1964-10-13'
  subject: CGPM
  type: resolution
  title: Dotation du Bureau international
  identifier: '4'
  url: https://www.bipm.org/fr/committees/cg/cgpm/12-1964/resolution-4
  reference:
  reference_name:
  reference_page:
  approvals: []
  considerations:
  - type: considering
    date_effective: '1964-10-13'
    message: l'extension des fonctions que le Bureau international assume vis-à-vis
      des États, l'accroissement de la précision des étalons de base dont le Bureau
      international s'occupe et la complexité des techniques exigées par cette précision,
      le personnel et l'équipement scientifique nécessaires au Bureau international
      pour l'accomplissement de ses fonctions,
  actions:
  - type: decides
    date_effective: '1964-10-13'
    message: la proposition du Comité international des poids et mesures dûment notifiée
      à l'avance aux Gouvernements conformément à l'article 6, paragraphe 5, du Règlement
      annexé à la Convention du Mètre de 1875, modifiée en 1921,
  - type: decides
    date_effective: '1964-10-13'
    message: la proposition d'une augmentation échelonnée faite en séance par la Délégation
      de la Roumanie,
  - type: decides
    date_effective: '1964-10-13'
    message: 'd''accroître la partie fixe de la dotation annuelle à partir du 1er
      janvier 1965 par rapport à ce qu''elle était avant le 1er octobre 1964, de façon
      que l''ensemble de la partie fixe et de la partie complémentaire calculée à
      cette dernière date soit porté graduellement à 1 750 000 francs-or de la façon
      suivante :    '
  - type: decides
    date_effective: '1964-10-13'
    message: 10.59161/CGPM1964RES4F
- dates:
  - '1964-10-13'
  subject: CGPM
  type: resolution
  title: Étalon atomique de fréquence
  identifier: '5'
  url: https://www.bipm.org/fr/committees/cg/cgpm/12-1964/resolution-5
  reference:
  reference_name:
  reference_page:
  approvals: []
  considerations:
  - type: considering
    date_effective: '1964-10-13'
    message: que la Onzième Conférence générale des poids et mesures a constaté dans
      sa Résolution 10 l'urgence pour les buts de la haute métrologie d'arriver à
      un étalon atomique ou moléculaire d'intervalle de temps, que, malgré les résultats
      acquis dans l'utilisation des étalons atomiques de fréquence à césium, le moment
      n'est pas encore venu pour la Conférence générale d'adopter une nouvelle définition
      de la seconde, unité de base du Système international d'unités, en raison des
      progrès nouveaux et importants qui peuvent être obtenus à la suite des études
      en cours,
  - type: empowers
    date_effective: '1964-10-13'
    message: le Comité international des poids et mesures à désigner les étalons atomiques
      ou moléculaires de fréquence à employer temporairement,
  actions:
  - type: decides
    date_effective: '1964-10-13'
    message: qu'on ne peut pas attendre davantage pour fonder les mesures physiques
      de temps sur des étalons atomiques ou moléculaires de fréquence,
  - type: invites / further invites
    date_effective: '1964-10-13'
    message: les Organisations et les Laboratoires experts dans ce domaine à poursuivre
      les études utiles à une nouvelle définition de la seconde.
  - type: decides
    date_effective: '1964-10-13'
    message: 10.59161/CGPM1964RES5F
- dates:
  - '1964-10-13'
