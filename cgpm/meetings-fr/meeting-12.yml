  subject: CGPM
  type: resolution
  title: Curie
  identifier: '7'
  url: https://www.bipm.org/fr/committees/cg/cgpm/12-1964/resolution-7
  reference:
  reference_name:
  reference_page:
  approvals: []
  considerations:
  - type: considering
    date_effective: '1964-10-13'
    message: que depuis longtemps le curie est utilisé dans beaucoup de pays comme
      unité pour l'activité des radionucléides,
  - type: recognizing
    date_effective: '1964-10-13'
    message: que dans le Système international d'unités (SI), l'unité de cette activité
      est la seconde à la puissance moins un (s–1),
  actions:
  - type: decides
    date_effective: '1964-10-13'
    message: que le curie soit encore retenu comme unité en dehors du SI pour l'activité,
      avec la valeur 3,7 ´ 1010 s–1. Le symbole de cette unité est Ci.
  - type: decides
    date_effective: '1964-10-13'
    message: '10.59161/CGPM1964RES7F Le nom « becquerel » (Bq) a été adopté par la
      15e CGPM en 1975 (Résolution 8) pour l''unité SI d''activité : 1 Ci = 3.7 x
      1010 Bq.'
- dates:
  - '1964-10-13'
  subject: CGPM
  type: resolution
  title: Préfixes SI femto et atto
