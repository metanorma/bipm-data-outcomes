  type: resolution
  title: Échelle internationale pratique de température (recherches à effectuer)
  identifier: '10'
  url: https://www.bipm.org/fr/committees/cg/cgpm/12-1964/resolution-10
  reference:
  reference_name:
  reference_page:
  approvals: []
  considerations:
  - type: considering
    date_effective: '1964-10-13'
    message: l'urgence de réviser l'Échelle internationale pratique de température
      de 1948 et de l'étendre dans le domaine des basses températures, jusqu'aux points
      d'ébullition de l'hydrogène et de l'hélium,
  - type: recognizing
    date_effective: '1964-10-13'
    message: que des recherches importantes doivent encore être faites afin de permettre
      au Comité international des poids et mesures de préparer pendant les années
      suivantes une proposition pour une nouvelle définition de l'Échelle internationale
      pratique de température qui pourrait être adoptée par la Treizième Conférence
      générale des poids et mesures,
  actions:
  - type: decides
    date_effective: '1964-10-13'
    message: les résultats expérimentaux obtenus par des laboratoires compétents pour
      connaître les différences existant entre la température thermodynamique et celle
      définie par l'Échelle internationale pratique de température, les progrès déjà
      faits pour l'extension de l'Échelle internationale pratique de température au-dessous
      de 90°K jusqu'à 12°K et l'introduction des échelles de température au-dessous
      de 5°K,
  - type: invites / further invites
    date_effective: '1964-10-13'
    message: 'les grands laboratoires nationaux et internationaux experts dans ce
      domaine à poursuivre aussi activement que possible les recherches importantes
      pour la révision de l''Échelle internationale pratique de température, en particulier
      :'
  - type: decides
    date_effective: '1964-10-13'
    message: 10.59161/CGPM1964RES10F
