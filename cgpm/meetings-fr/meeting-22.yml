  type: resolution
  title: Révision de la mise en pratique de la définition du mètre
  identifier: '8'
  url: https://www.bipm.org/fr/committees/cg/cgpm/22-2003/resolution-8
  reference:
  reference_name:
  reference_page:
  approvals: []
  considerations:
  - type: recalling / further recalling
    date_effective: '2003-10-17'
    message: qu'en 1999 la 21e Conférence générale a accueilli favorablement l'adoption
      de la révision de la mise en pratique de la définition du mètre approuvée par
      le Comité international des poids et mesures en 1997, que la Conférence générale
      a aussi recommandé aux laboratoires nationaux de métrologie de poursuivre les
      études expérimentales et théoriques entreprises pour améliorer les étalons optiques
      de fréquence et de longueur d'onde, et de mettre au point de nouvelles techniques
      pour comparer les différents étalons dans un domaine étendu de fréquences et
      de longueurs d'onde, afin d'améliorer le fondement expérimental du Système international
      d'unités (SI),
  - type: considering
    date_effective: '2003-10-17'
    message: que les nouvelles techniques fondées sur des ions et des atomes piégés
      permettent maintenant de réaliser des étalons de fréquence optiques et des horloges
      optiques de très haute exactitude et stabilité, ces systèmes semblent offrir
      la possibilité de servir de fondement à une amélioration future de la définition
      de la seconde, l'introduction de la technologie des peignes femtosecondes a
      facilité considérablement les mesures absolues de fréquence de sources de radiations
      optiques, y compris celles utilisées dans la mise en pratique de la définition
      du mètre, le Comité international a mis à jour en 2002 les valeurs recommandées
      pour un certain nombre de radiations publiées dans la mise en pratique de 1997
      et y a ajouté les valeurs relatives à un certain nombre de radiations nouvelles,
  actions:
  - type: decides
    date_effective: '2003-10-17'
    message: l'adoption de ces nouvelles valeurs et leur publication dans Metrologia
      en 2003, et la collaboration étroite et les discussions entre la communauté
      des longueurs et celle du temps et des fréquences, en vue du rattachement à
      venir des étalons de fréquence optiques et micro-ondes,
  - type: recommends
    date_effective: '2003-10-17'
    message: que les laboratoires nationaux de métrologie continuent à mettre au point
      des techniques fiables et éprouvées pour la fabrication d'étalons de fréquence
      optiques et leur comparaison aux étalons de fréquence micro-ondes, et
  - type: invites / further invites
    date_effective: '2003-10-17'
    message: le Comité international à suivre cette question en permanence, en particulier
      en vue d'une éventuelle redéfinition de la seconde.
  - type: decides
    date_effective: '2003-10-17'
    message: 10.59161/CGPM2003RES8F
- dates:
  - '2003-10-17'
  subject: CGPM
  type: resolution
  title: Exigences pour le transport transfrontalier d'étalons de mesure, d'équipements
    métrologiques et de matériaux de référence
  identifier: '9'
  url: https://www.bipm.org/fr/committees/cg/cgpm/22-2003/resolution-9
  reference:
  reference_name:
  reference_page:
  approvals: []
  considerations:
  - type: considering
    date_effective: '2003-10-17'
    message: les récents événements qui, nous le comprenons bien, imposent un contrôle
      plus strict des conteneurs, bagages et objets personnels des voyageurs nationaux
      et internationaux, ainsi que des bagages non accompagnés, que ces contrôles
      rendent de plus en plus difficile, et parfois impossible, le transport des équipements,
      étalons et matériaux de référence nécessaires aux comparaisons d'étalons nationaux
      de mesure, que ces comparaisons reposent intrinsèquement sur le transport fréquent
      et sans encombre d'étalons, qui pour beaucoup ont une stabilité limitée et qui
      doivent donc être transportés rapidement, que certains échantillons et équipements
      sont fragiles et peuvent être contaminés ou endommagés jusqu'à devenir inutilisables,
      s'ils ne sont pas transportés avec soin par le personnel des aéroports, les
      agences de fret et les agents des douanes, que les dangers inhérents au transport
      de certains échantillons pour la métrologie dans les domaines nucléaire, chimique
      et pharmaceutique sont bien moindres que ne le craignent ceux qui cherchent
      à interdire ou restreindre systématiquement le déplacement de ces produits en
      grande quantité, la nécessité de mettre en œuvre de nouvelles procédures susceptibles
      de faciliter le transport sans encombre de tels matériels, que cela pourrait
      se faire par des modifications, directives ou autres adjonctions aux réglementations
      existantes informant les personnels sur les mesures à prendre pour les échantillons
      et équipements de mesure,
  actions:
  - type: recommends
    date_effective: '2003-10-17'
    message: que les laboratoires nationaux de métrologie, les organismes gouvernementaux
      et les organisations internationales responsables du contrôle et des règlements
      sur le transport des biens et substances travaillent tous avec les organismes
      concernés pour étudier, proposer et mettre en œuvre des procédures spéciales
      relatives au transport libre et sans encombre de matériaux et d'équipements
      métrologiques entre les laboratoires nationaux de métrologie, les laboratoires
      désignés et le Bureau international des poids et mesures,
  - type: recommends
    date_effective: '2003-10-17'
    message: et aussi que le Comité international attire l'attention des autres organisations
      internationales ayant des responsabilités dans ce domaine sur cette Résolution.
  - type: decides
    date_effective: '2003-10-17'
    message: 10.59161/CGPM2003RES9F
- dates:
  - '2003-10-17'
  subject: CGPM
  type: resolution
  title: Symbole du séparateur décimal
  identifier: '10'
  url: https://www.bipm.org/fr/committees/cg/cgpm/22-2003/resolution-10
  reference:
  reference_name:
  reference_page:
  approvals: []
  considerations:
  - type: considering
    date_effective: '2003-10-17'
    message: que l'un des principaux objectifs du Système international d'unités (SI)
      est de permettre d'exprimer la valeur des grandeurs d'une manière aisément compréhensible
      dans le monde entier, la valeur d'une grandeur est normalement exprimée par
      un nombre qui multiplie une unité, souvent le nombre utilisé pour exprimer la
      valeur d'une grandeur contient plusieurs chiffres, avec une partie entière et
      une partie décimale, la 9e Conférence générale dans sa Résolution 7 (1948) avait
      décidé que « Dans les nombres, la virgule (usage français) ou le point (usage
      britannique) sont utilisés seulement pour séparer la partie entière des nombres
      de leur partie décimale », conformément à la décision du Comité international
      des poids et mesures lors de sa 86e session (1997), le Bureau international
      des poids et mesures utilise maintenant le point (sur la ligne) comme séparateur
      décimal dans toutes les versions en anglais de ses publications, y compris dans
      le texte anglais de la brochure sur le SI (la référence internationale sur le
      SI), tout en continuant à utiliser la virgule (sur la ligne) comme séparateur
      décimal dans toutes ses publications en français, néanmoins certaines organisations
      internationales utilisent la virgule sur la ligne comme séparateur décimal dans
      leurs documents en anglais, de plus, certaines organisations internationales,
      y compris certaines organisations internationales de normalisation, spécifient
      que le séparateur décimal doit être la virgule sur la ligne, dans toutes les
      langues, la recommandation d'utiliser la virgule sur la ligne comme séparateur
      décimal est, dans de nombreuses langues, en conflit avec l'usage courant, qui
      consiste à utiliser le point sur la ligne, le fait d'utiliser le point sur la
      ligne ou la virgule sur la ligne comme séparateur décimal n'est pas toujours
      lié à la langue, car certains pays de même langue maternelle ont des usages
      différents, alors que d'autres pays pratiquant le plurilinguisme utilisent le
      point sur la ligne ou la virgule sur la ligne suivant la langue,
  actions:
  - type: declares
    date_effective: '2003-10-17'
    message: que le symbole du séparateur décimal pourra être le point sur la ligne
      ou la virgule sur la ligne,
  - type: decides
    date_effective: '2003-10-17'
    message: que « Pour faciliter la lecture, les nombres peuvent être partagés en
      tranches de trois chiffres ; ces tranches ne sont jamais séparées par des points,
      ni par des virgules », comme le recommande la Résolution 7 de la 9e Conférence
      générale de 1948.
  - type: decides
    date_effective: '2003-10-17'
    message: 10.59161/CGPM2003RES10F
- dates:
  - '2003-10-17'
  subject: CGPM
  type: resolution
  title: Relations entre les laboratoires nationaux de métrologie et les organismes
    d'accréditation reconnus au niveau national
  identifier: '11'
  url: https://www.bipm.org/fr/committees/cg/cgpm/22-2003/resolution-11
  reference:
  reference_name:
  reference_page:
  approvals: []
  considerations:
  - type: considering
    date_effective: '2003-10-17'
    message: le rôle pivot joué par les laboratoires nationaux de métrologie afin
      de promouvoir l'accréditation des services d'étalonnage et, dans certains pays,
      des laboratoires d'essais pour satisfaire les demandes croissantes d'étalonnage
      des étalons de mesure et des instruments assurant la traçabilité au Système
      international d'unités (SI), le caractère fondamental d'une coopération technique
      étroite entre le personnel des laboratoires nationaux de métrologie et celui
      des organismes d'accréditation reconnus au niveau national, l'importance primordiale
      pour le client d'être assuré que la procédure d'accréditation des laboratoires
      d'étalonnage et d'essais est effectuée avec les compétences techniques requises,
      la tendance récente à demander une séparation complète entre les activités des
      laboratoires nationaux de métrologie et celles des organismes d'accréditation
      reconnus au niveau national, au nom de l'impartialité, de l'indépendance et
      de l'intégrité de ces derniers, le danger évident qu'une telle séparation pourrait
      avoir pour les compétences techniques des organismes d'accréditation reconnus
      au niveau national, et par conséquent, pour l'accréditation des laboratoires
      d'étalonnage et d'essais, que la détermination et la mise en œuvre des pratiques
      nationales concernant la métrologie et les systèmes d'accréditation nationaux
      sont en dernière instance de la responsabilité des Gouvernements nationaux,
      que la relation entre le laboratoire national de métrologie et le ou les organismes
      d'accréditation reconnus au niveau national varie d'un pays à l'autre, ce ou
      ces organismes pouvant faire partie du laboratoire national de métrologie, être
      sous la responsabilité du laboratoire national de métrologie, ou en être complètement
      séparés,
  - type: emphasizing
    date_effective: '2003-10-17'
    message: l'importance d'une pratique équitable et harmonisée à l'égard des systèmes
      métrologiques et d'accréditation, petits ou grands, dans toutes les régions
      du monde,
  - type: recognizing
    date_effective: '2003-10-17'
    message: l'importance de l'harmonisation mondiale de ces pratiques,
  - type: notes
    date_effective: '2003-10-17'
    message: et que les étalonnages ne sont pas une évaluation de la conformité.
  actions:
  - type: decides
    date_effective: '2003-10-17'
    message: le protocole d'accord entre le Comité international des poids et mesures
      (CIPM) et l'International Laboratory Accreditation Conference (ILAC) conclu
      récemment,
  - type: requests
    date_effective: '2003-10-17'
    message: à tous les organismes d'accréditation de reconnaître que les laboratoires
      nationaux de métrologie et les laboratoires d'étalonnage accrédités fournissent
      ensemble l'accès indispensable à la traçabilité au SI et donc la fiabilité des
      mesures et de l'équivalence internationale des résultats de mesure pour l'économie
      et la société tout entières et travaillent ensemble étroitement,
  - type: recommends
    date_effective: '2003-10-17'
    message: que les Gouvernements des États membres de la Convention du Mètre s'assurent
      qu'une relation appropriée existe entre les laboratoires nationaux de métrologie
      et les organismes d'accréditation reconnus au niveau national, cette relation
      stimule la collaboration en matière de traçabilité des résultats de mesure et
      assure que des actions efficaces et complémentaires soient entreprises dans
      le cadre de l'Arrangement de reconnaissance mutuelle du CIPM et de l'Arrangement
      de l'ILAC,
  - type: decides
    date_effective: '2003-10-17'
    message: 10.59161/CGPM2003RES11F
- dates:
  - '2003-10-17'
  subject: CGPM
  type: resolution
  title: Dotation du Bureau international pour les années 2005 à 2008
  identifier: '12'
  url: https://www.bipm.org/fr/committees/cg/cgpm/22-2003/resolution-12
  reference:
  reference_name:
  reference_page:
  approvals: []
  considerations:
  - type: considering
    date_effective: '2003-10-17'
    message: l'importance croissante de la métrologie pour les échanges commerciaux,
      l'industrie, l'environnement, la santé publique et la sécurité dans tous les
      États membres de la Convention du Mètre, le besoin correspondant d'une coordination
      internationale efficace et compétente des activités de métrologie, le rôle central
      joué par le Bureau international des poids et mesures (BIPM) dans cette coordination
      et les services qu'il rend aux États membres de la Convention du Mètre, les
      responsabilités élargies confiées au BIPM lors de la 21e Conférence générale
      en 1999, sans augmentation correspondante de sa dotation, l'augmentation de
      la charge de travail, non prévue lors de la 21e Conférence générale, à laquelle
      le BIPM a fait face depuis la précédente Conférence générale, l'extension des
      activités de la Convention du Mètre incombant aux États membres, notamment dans
      les domaines de la chimie, de la biotechnologie et de la médecine, la nécessité
      d'élargir le domaine de compétence du personnel scientifique du BIPM pour répondre
      aux demandes dans ces nouveaux domaines, les efforts considérables qui continuent
      d'être faits par le BIPM pour augmenter son efficacité, et son engagement à
      poursuivre ces efforts,
  - type: recognizing
    date_effective: '2003-10-17'
    message: la situation économique difficile actuelle de certains États membres,
      qui a pour conséquence de limiter strictement les contributions directes aux
      organisations intergouvernementales, l'extrême importance du travail du BIPM
      pour tous les États membres, la nécessité d'assurer les moyens financiers et
      autres permettant au BIPM de répondre aux exigences croissantes auxquelles il
      doit faire face,
  actions:
  - type: invites / further invites
    date_effective: '2003-10-17'
    message: les laboratoires nationaux de métrologie à organiser, de manière continue
      et à leurs frais, la mise à disposition ou le détachement au BIPM, pour des
      séjours de courte durée, de membres de leur personnel afin de travailler sur
      des projets d'intérêt mutuel intégrés au programme de travail du BIPM, à accepter
      la participation de membres du personnel du BIPM aux activités de leur laboratoire
      pour travailler à des programmes d'intérêt mutuel, à subventionner un programme
      permanent de chercheurs associés au BIPM visant à mettre à sa disposition du
      personnel répondant aux besoins, sur la base de quatre chercheurs associés à
      la fin de l'année 2004, pour des projets d'intérêt mutuel au laboratoire national
      de métrologie qui fournit la subvention et au BIPM,
  - type: invites / further invites
    date_effective: '2003-10-17'
    message: aussi les Gouvernements, les laboratoires nationaux de métrologie, les
      organisations internationales, ainsi que les organismes et fondations privés
      à verser des contributions financières supplémentaires ou à effectuer des dons
      en nature au BIPM,
  - type: decides
    date_effective: '2003-10-17'
    message: que la partie fixe de la dotation annuelle du Bureau international des
      poids et mesures sera augmentée de telle façon que l'ensemble de la partie fixe
      et de la partie complémentaire (définie à l'article 6, 1921) du Règlement annexé
      à la Convention du Mètre (1875) soit, pour les États parties à la Convention
      à l'époque de la 22e Conférence porté à
  - type: decides
    date_effective: '2003-10-17'
    message: aussi de soutenir la charge de travail croissante du BIPM par une contribution
      supplémentaire discrétionnaire de
  - type: requests
    date_effective: '2003-10-17'
    message: aux États membres de déclarer au BIPM, au plus tard le 1er avril 2004,
      s'ils ont l'intention de payer leur part de cette contribution discrétionnaire
      pour les quatre années ci-dessus.
  - type: decides
    date_effective: '2003-10-17'
    message: 10.59161/CGPM2003RES12F
