  reference_page:
  approvals: []
  considerations:
  - type: considering
    date_effective: '1933-10-10'
    message: la sanction donnée à l'équation des nouveaux prototypes métriques par
      la Première Conférence générale des poids et mesures, la décision prise par
      la Deuxième Conférence générale des poids et mesures, de faire procéder à la
      vérification périodique des kilogrammes prototypes nationaux,
  actions:
  - type: decides
    date_effective: '1933-10-10'
    message: le Rapport du Directeur du Bureau international des poids et mesures
      relatif à ladite vérification, la déclaration du Président du Comité international
      des poids et mesures approuvant, au nom du Comité, les termes de ce Rapport,
  - type: declares
    date_effective: '1933-10-10'
    message: n'être plus parfaitement conformes à la réalité les équations sanctionnées
