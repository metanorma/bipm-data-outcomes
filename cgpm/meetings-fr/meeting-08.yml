  subject: CGPM
  type: resolution
  title: Équation du kilogramme prototype n° 41
  identifier: '5'
  url: https://www.bipm.org/fr/committees/cg/cgpm/8-1933/resolution-5
  reference:
  reference_name:
  reference_page:
  approvals: []
  considerations:
  - type: considering
    date_effective: '1933-10-10'
    message: la construction récente de quatre kilogrammes en platine iridié destinés
      – les kilogrammes de la première coulée ayant tous été distribués – à permettre
      de répondre aux demandes d'acquéreurs nouveaux, l'achat d'un de ces kilogrammes
      par le Gouvernement Tchécoslovaque, et les déterminations au Bureau de sa densité
      et de sa masse,
  actions:
  - type: decides
    date_effective: '1933-10-10'
    message: le Rapport du Directeur du Bureau international des poids et mesures
      relatif auxdites déterminations, la déclaration du Président du Comité international
      des poids et mesures approuvant ce rapport, au nom du Comité,
  - type: declares
    date_effective: '1933-10-10'
    message: homologuer le certificat délivré à la date du 20 octobre 1929, relatif
      aux comparaisons effectuées sur le kilogramme n° 41 et donnant son équation,
      en même temps que son volume à 0°.
  - type: decides
    date_effective: '1933-10-10'
    message: 10.59161/CGPM1933RES5F
