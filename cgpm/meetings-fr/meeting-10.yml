  subject: CGPM
  type: resolution
  title: Définition du mètre
  identifier: '1'
  url: https://www.bipm.org/fr/committees/cg/cgpm/10-1954/resolution-1
  reference:
  reference_name:
  reference_page:
  approvals: []
  considerations:
  - type: recognizing
    date_effective: '1954-10-14'
    message: que, malgré les importants progrès réalisés, les recherches sur les radiations
      monochromatiques doivent être complétées,
  actions:
  - type: decides
    date_effective: '1954-10-14'
    message: de l'état d'avancement des travaux que la Neuvième Conférence générale
      avait recommandés dans sa Résolution 1 dans le but d'établir éventuellement
      une nouvelle définition du mètre fondée sur la longueur d'onde d'une radiation
      lumineuse,
  - type: decides
    date_effective: '1954-10-14'
    message: l'importance des résultats acquis grâce aux recherches des grands Laboratoires,
      des savants spectroscopistes et du Bureau international,
  - type: decides
    date_effective: '1954-10-14'
    message: en conséquence aux grands Laboratoires et au Bureau international son
      invitation à poursuivre aussi activement que possible leurs études sur les radiations
      monochromatiques, en vue de permettre à la Onzième Conférence générale de prendre
      une résolution définitive,
  - type: decides
    date_effective: '1954-10-14'
    message: de ne pas encore changer la définition du mètre.
  - type: decides
    date_effective: '1954-10-14'
    message: 10.59161/CGPM1954RES1F
