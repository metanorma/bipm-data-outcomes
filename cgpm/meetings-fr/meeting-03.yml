  actions:
  - type: decides
    date_effective: '1901-10-22'
    message: La Conférence charge le Comité international de faire poursuivre au Bureau
      les mesures destinées à faire encore mieux connaître le rapport de ces deux
      grandeurs, et de publier le plus tôt possible les résultats des recherches déjà
      effectuées au Bureau, afin de permettre d'utiliser à l'avenir, dans les travaux
      scientifiques ou techniques de haute précision, la valeur la plus probable de
      ce rapport.
  - type: decides
    date_effective: '1901-10-22'
    message: 10.59161/CGPM1901DECL1F Définition abrogée en 1964 par la 12e CGPM (Résolution
      6).
- dates:
  - '1901-10-22'
  subject: CGPM
  type: resolution
  title: Déclaration relative à l'unité de masse et à la définition du poids ; valeur
    conventionnelle de <i>g</i><sub>n</sub>
  identifier: '2'
  url: https://www.bipm.org/fr/committees/cg/cgpm/3-1901/resolution-2
  reference:
  reference_name:
  reference_page:
  approvals: []
  considerations:
  - type: having / having regard
    date_effective: '1901-10-22'
    message: la décision du Comité international des poids et mesures du 15 octobre
      1887, par laquelle le kilogramme a été défini comme unité de masse ;
  - type: having / having regard
    date_effective: '1901-10-22'
    message: la décision contenue dans la formule de sanction des prototypes du Système
      métrique, acceptée à l'unanimité par la Conférence générale des poids et mesures
      dans sa réunion du 26 septembre 1889 ;
  - type: considering
    date_effective: '1901-10-22'
    message: la nécessité de faire cesser l'ambiguïté qui existe encore dans l'usage
      courant sur la signification du terme poids, employé tantôt dans le sens du
      terme masse, tantôt dans le sens du terme effort mécanique ;
  actions:
  - type: decides
    date_effective: '1901-10-22'
    message: 10.59161/CGPM1901DECL2F Cette valeur de gn est la valeur conventionnelle
      de référence pour le calcul de l'unité kilogramme-force maintenant abolie.
