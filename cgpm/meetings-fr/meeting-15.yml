  subject: CGPM
  type: resolution
  title: Temps universel coordonné (UTC)
  identifier: '5'
  url: https://www.bipm.org/fr/committees/cg/cgpm/15-1975/resolution-5
  reference:
  reference_name:
  reference_page:
  approvals: []
  considerations:
  - type: considering
    date_effective: '1975-06-03'
    message: que le système appelé « Temps universel coordonné » (UTC) est employé
      très largement, qu'il est diffusé par la plupart des émetteurs hertziens de
      signaux horaires, que sa diffusion fournit aux utilisateurs à la fois des fréquences
      étalons, le Temps atomique international et une approximation du Temps universel
      (ou si l'on préfère, du temps solaire moyen),
  actions:
  - type: decides
    date_effective: '1975-06-03'
    message: que ce Temps universel coordonné est à la base du temps civil dont l'usage
      est légal dans la plupart des pays,
  - type: decides
    date_effective: '1975-06-03'
    message: que cet emploi est parfaitement recommandable.
  - type: decides
    date_effective: '1975-06-03'
    message: 10.59161/CGPM1975RES5F
