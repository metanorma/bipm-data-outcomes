  title: Définition du mètre (maintien de la définition actuelle ; poursuite des recherches)
  identifier: '1'
  url: https://www.bipm.org/fr/committees/cg/cgpm/15-1975/resolution-1
  reference:
  reference_name:
  reference_page:
  approvals: []
  considerations:
  - type: considering
    date_effective: '1975-06-03'
    message: que ces radiations constituent des étalons de longueur d'onde dont la
      précision et la reproductibilité surpassent celles de la radiation du krypton
      86 de la définition du mètre,
  actions:
  - type: decides
    date_effective: '1975-06-03'
    message: des qualités métrologiques des radiations produites par des lasers à
      gaz asservis sur une raie d'absorption,
  - type: decides
    date_effective: '1975-06-03'
    message: cependant prématuré d'envisager un changement de la définition du mètre,
  - type: requests
    date_effective: '1975-06-03'
    message: au Bureau international des poids et mesures et aux laboratoires nationaux
      de poursuivre leurs recherches sur ces radiations,
  - type: requests
    date_effective: '1975-06-03'
    message: au Comité international des poids et mesures de coordonner ces recherches.
  - type: decides
    date_effective: '1975-06-03'
    message: 10.59161/CGPM1975RES1F
- dates:
  - '1975-06-03'
  subject: CGPM
  type: resolution
  title: Valeur recommandée pour la vitesse de la lumière
  identifier: '2'
  url: https://www.bipm.org/fr/committees/cg/cgpm/15-1975/resolution-2
  reference:
  reference_name:
  reference_page:
  approvals: []
  considerations:
  - type: considering
    date_effective: '1975-06-03'
    message: l'excellent accord entre les résultats des mesures de longueur d'onde
      portant sur des radiations de lasers asservis sur une raie d'absorption moléculaire
      dans la région visible ou infrarouge, avec une incertitude estimée à ± 4 x 10–9
      qui correspond à l'indétermination de la réalisation du mètre,
  - type: considering
    date_effective: '1975-06-03'
    message: aussi les mesures concordantes de la fréquence de plusieurs de ces radiations,
  actions:
  - type: recommends
    date_effective: '1975-06-03'
    message: l'emploi de la valeur qui en résulte pour la vitesse de propagation des
      ondes électromagnétiques dans le vide c = 299 792 458 mètres par seconde.
  - type: decides
    date_effective: '1975-06-03'
    message: 10.59161/CGPM1975RES2F L'incertitude relative doit être comprise comme
      étant trois fois l'incertitude-type estimée sur les résultats considérés.
- dates:
  - '1975-06-03'
  subject: CGPM
  type: resolution
  title: Étalons du kilogramme (poursuite des études pour améliorer la précision des
    comparaisons)
  identifier: '3'
  url: https://www.bipm.org/fr/committees/cg/cgpm/15-1975/resolution-3
  reference:
  reference_name:
  reference_page:
  approvals: []
  considerations:
  - type: considering
    date_effective: '1975-06-03'
    message: que l'unité de masse, et les unités de toutes les grandeurs qui dépendent
      de la masse, pour être réalisées exactement, nécessitent l'emploi du Prototype
      international du kilogramme en platine iridié conservé par le Bureau international
      des poids et mesures depuis 1889, que pour le moment aucun moyen n'est en vue
      qui permettrait de définir l'unité de masse en termes de constantes atomiques
      avec une précision équivalente,
  actions:
  - type: requests
    date_effective: '1975-06-03'
    message: au Bureau international des poids et mesures et aux laboratoires nationaux
      de poursuivre des études visant à améliorer la précision des comparaisons d'étalons
      de masse, et charge le Bureau international des poids et mesures d'organiser
      ensuite une vérification des étalons nationaux de masse.
  - type: decides
    date_effective: '1975-06-03'
    message: 10.59161/CGPM1975RES3F
- dates:
  - '1975-06-03'
  subject: CGPM
  type: resolution
