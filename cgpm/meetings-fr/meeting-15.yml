  type: resolution
  title: Dotations du BIPM pour la période 1977-1980
  identifier: '11'
  url: https://www.bipm.org/fr/committees/cg/cgpm/15-1975/resolution-11
  reference:
  reference_name:
  reference_page:
  approvals: []
  considerations:
  - type: considering
    date_effective: '1975-06-03'
    message: que dans le cas de difficultés financières imprévues une séance supplémentaire
      de la Quinzième Conférence générale des poids et mesures pourrait être convoquée,
  actions:
  - type: decides
    date_effective: '1975-06-03'
    message: 'que la partie fixe de la dotation annuelle du Bureau international des
      poids et mesures sera augmentée de façon que l''ensemble de la partie fixe et
      de la partie complémentaire (définies à l''Article 6 (1921) du Règlement annexé
      à la Convention du Mètre) soit, pour les États parties à la Convention à l''époque
      de la Quinzième Conférence générale :'
  - type: decides
    date_effective: '1975-06-03'
    message: 10.59161/CGPM1975RES11F
