- dates:
  - '1975-06-03'
  subject: CGPM
  type: resolution
  title: 'Unités SI pour les rayonnements ionisants : gray'
  identifier: '9'
  url: https://www.bipm.org/fr/committees/cg/cgpm/15-1975/resolution-9
  reference:
  reference_name:
  reference_page:
  approvals: []
  considerations: []
  actions:
  - type: adopts
    date_effective: '1975-06-03'
    message: 'le nom spécial suivant d''unité SI pour les rayonnements ionisants :'
  - type: decides
    date_effective: '1975-06-03'
    message: 'le , symbole Gy, égal au joule par kilogramme. Note : le gray est l''unité
      SI de dose absorbée. Dans le domaine des rayonnements ionisants, le gray peut
      encore être employé avec d''autres grandeurs physiques qui s''expriment aussi
      en joules par kilogramme ; le Comité consultatif des unités est chargé d''étudier
      cette question en collaboration avec les organisations internationales compétentes.'
  - type: decides
    date_effective: '1975-06-03'
    message: 10.59161/CGPM1975RES9F À sa session de 1976, le Comité international
      a approuvé le rapport de la 5e session du CCU (1976) précisant que, suivant
      l'avis de l'ICRU, le gray peut être employé aussi pour exprimer l'énergie communiquée
      massique, le kerma et l'indice de dose absorbée.
