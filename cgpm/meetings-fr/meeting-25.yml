  title: Sur l'élection du Comité international des poids et mesures
  identifier: '2'
  url: https://www.bipm.org/fr/committees/cg/cgpm/25-2014/resolution-2
  reference:
  reference_name:
  reference_page:
  approvals: []
  considerations:
  - type: considering
    date_effective: '2014-11-20'
    message: les dispositions des articles 7, 8 et 9 du Règlement annexé à la Convention
      du Mètre, relatives à l'élection et à la composition du Comité international
      des poids et mesures (CIPM), la décision de la CGPM, adoptée lors de sa 17e
      réunion (1983) sur recommandation du Groupe de travail ad hoc créé par la CGPM
      lors de sa 16e réunion (1979), selon laquelle le CIPM – en général – s'assure
      que chacun de ses membres est acceptable par son gouvernement au moment de l'élection
      provisoire, la Résolution 10 adoptée par la CGPM à sa 24e réunion (2011) sur
      le rôle, la mission, les objectifs, la stratégie à long terme et la gouvernance
      du Bureau international des poids et mesures (BIPM), par laquelle la CGPM a
      invité le CIPM à établir un Groupe de travail ad hoc chargé de conduire un examen
      du rôle, de la mission, des objectifs, de la stabilité financière à long terme,
      de la direction stratégique et de la gouvernance du BIPM, ainsi qu'à présenter
      à la CGPM, à sa 25e réunion, les recommandations qu'il aura formulées à la suite
      de l'examen par le Groupe de travail ad hoc, les actions qu'il aura menées en
      conséquence, ainsi que des propositions d'actions supplémentaires requérant
      l’approbation de la CGPM, les conclusions et recommandations dudit Groupe de
      travail ad hoc, en particulier celles relatives à l'élection et à la composition
      du CIPM,
  - type: noting
    date_effective: '2014-11-20'
    message: la décision 103/08 du CIPM, adoptée à l'unanimité lors de la première
      partie de sa 103e session (mars 2014), de démission de l'ensemble des membres
      du CIPM, avec effet à compter de l'ouverture de la première partie de la 104e
      session du CIPM prévue en mars 2015,
  actions:
  - type: decides
    date_effective: '2014-11-20'
    message: la révision par le CIPM, lors de la seconde partie de sa 102e session
      (octobre 2013), des principes suivis par le CIPM pour procéder à une élection,
      qui avaient été adoptés par ce dernier lors de sa 94e session (2005),
  - type: decides
    date_effective: '2014-11-20'
    message: qu'à compter de la 25e réunion de la CGPM (2014), les membres du CIPM
      seront élus pour un mandat fixe renouvelable, que le mandat des membres du CIPM
      débutera à la première session du CIPM organisée au plus tard six mois après
      la réunion de la CGPM lors de laquelle ils auront été élus, et se terminera
      au début de la session du CIPM ayant lieu après la réunion suivante de la CGPM,
      qu'est instituée une Commission pour l'élection du CIPM, dont les membres seront
      élus et assureront leur fonction selon une procédure qui sera adoptée par la
      Commission, afin d'assister le CIPM et la CGPM dans l'élection des membres du
      CIPM, que la Commission pour l'élection du CIPM sera composée de neuf représentants
      d'États Membres, chacun provenant d'un État Membre différent, à contributions
      maximales, intermédiaires et minimales, avec une représentation géographique
      appropriée, élus à la majorité par la CGPM, ainsi que du Président du CIPM et
      du Secrétaire du CIPM, et que sa présidence sera assurée par l'un des représentants
      d'États Membres, que la CGPM procèdera à chacune de ses réunions à l'élection
      des neuf représentants d'États Membres de la Commission pour l'élection du CIPM,
  - type: invites / further invites
    date_effective: '2014-11-20'
    message: les États Membres à participer activement au processus d'élection du
      CIPM.
  - type: decides
    date_effective: '2014-11-20'
    message: 10.59161/CGPM2014RES2F
- dates:
  - '2014-11-20'
  subject: CGPM
  type: resolution
  title: Sur la Caisse de retraite et de prévoyance du BIPM
  identifier: '3'
  url: https://www.bipm.org/fr/committees/cg/cgpm/25-2014/resolution-3
  reference:
  reference_name:
  reference_page:
  approvals: []
  considerations:
  - type: recalling / further recalling
    date_effective: '2014-11-20'
    message: l'institution par la CGPM à sa 3e réunion (1901) d'une Caisse de retraite
      en faveur des membres du personnel du Bureau international des poids et mesures
      (BIPM), l'article 15 paragraphe 2 du Règlement annexé à la Convention du Mètre,
      qui dispose en particulier qu' « [u]n prélèvement annuel pourra être effectué,
      en faveur de la Caisse des retraites, sur le total des taxes perçues par le
      Bureau », l'adoption par la CGPM à sa 24e réunion (2011) de la Résolution 10
      sur le rôle, la mission, les objectifs, la stratégie à long terme et la gouvernance
      du BIPM, qui invite le CIPM à établir un Groupe de travail ad hoc chargé de
      conduire, entre autres, un examen de la stabilité financière à long terme du
      BIPM,
  - type: recognizing
    date_effective: '2014-11-20'
    message: que le CIPM a établi en 2012 un Sous-comité permanent sur la Caisse de
      retraite et de prévoyance du BIPM et l'assurance-maladie, qu'un régime de retraite
      soutenable est un mécanisme important pour permettre au BIPM d'attirer, retenir
      et motiver du personnel compétent, qu'il est nécessaire que le CIPM et le BIPM
      gèrent le budget et les finances du BIPM afin de remplir ses obligations financières
      relatives à la Caisse de retraite et de prévoyance du BIPM, dans le cadre de
      la dotation approuvée par les États Membres, que le CIPM a apporté une plus
      grande transparence aux comptes et aux états financiers de la Caisse de retraite
      et de prévoyance du BIPM en adoptant les normes IPSAS (International Public
      Sector Accounting Standards, Normes comptables internationales du secteur public),
  actions:
  - type: decides
    date_effective: '2014-11-20'
    message: les mesures déjà prises par le CIPM dans le but d'assurer la stabilité
      financière à long terme de la Caisse de retraite et de prévoyance du BIPM et,
      en particulier, les amendements qui ont été adoptés par le CIPM en 2009 et qui
      sont entrés en vigueur à compter du 1er janvier 2010, parmi lesquels l'augmentation
      de l'âge de départ à la retraite et l'augmentation de la contribution des membres
      du personnel du BIPM, le travail effectué depuis la 24e réunion de la CGPM (2011)
      afin d'examiner et analyser les actifs et passifs actuels de la Caisse de retraite
      et de prévoyance du BIPM par le Sous-comité du CIPM sur la Caisse de retraite
      et de prévoyance du BIPM et l'assurance-maladie,
  - type: decides
    date_effective: '2014-11-20'
    message: la décision prise à sa 10e réunion (1954) de confier au CIPM l'administration
      de la Caisse de retraite et de prévoyance du BIPM,
  - type: decides
    date_effective: '2014-11-20'
    message: à mettre en oeuvre les plans qu'il a élaborés afin d'assurer la soutenabilité
      de la Caisse de retraite et de prévoyance du BIPM tout en continuant à examiner
      la question des passifs sur le long terme, à tenir informés les États Membres
      des conclusions des études actuarielles sur les actifs et les passifs de la
      Caisse de retraite et de prévoyance du BIPM, par le biais des publications financières
      habituelles du CIPM et lors de la prochaine réunion de la CGPM.
  - type: decides
    date_effective: '2014-11-20'
    message: 10.59161/CGPM2014RES3F
- dates:
