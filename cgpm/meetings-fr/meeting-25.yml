  subject: CGPM
  type: resolution
  title: Dotation du Bureau international des poids et mesures pourles années 2016
    à 2019
  identifier: '4'
  url: https://www.bipm.org/fr/committees/cg/cgpm/25-2014/resolution-4
  reference:
  reference_name:
  reference_page:
  approvals: []
  considerations:
  - type: considering
    date_effective: '2014-11-20'
    message: "    l'importance croissante du travail du Bureau international des poids
      et mesures (BIPM), dans tous les États Membres, pour le commerce international,
      l'innovation dans le secteur industriel, le changement climatique, la santé
      humaine et la médecine, l'alimentation et la médecine légale, le fait que le
      BIPM est reconnu comme l'organisation intergouvernementale scientifique experte
      dans le domaine de la métrologie, ainsi que la valeur ajoutée et l'optimisation
      des coûts que le travail du BIPM apporte aux États Membres sur le plan technique
      et économique, le processus engagé par le BIPM afin d'adopter les meilleures
      pratiques de gestion et améliorer son efficacité,"
  - type: noting
    date_effective: '2014-11-20'
    message: "    la Résolution 7 (1979), adoptée par la CGPM à sa 16e réunion, établissant
      le principe de détermination de la dotation de base, la Résolution 10 (2011)
      adoptée par la CGPM à sa 24e réunion sur le rôle, la mission, les objectifs,
      la stratégie à long terme et la gouvernance du BIPM, ainsi que les mesures prises
      en conséquence et mises en oeuvre avec succès par le BIPM, la situation financière
      mondiale actuelle et les contraintes financières auxquelles les États Membres
      sont soumis, la mise en oeuvre réussie, par le BIPM, de la recommandation formulée
      par la CGPM à sa 24e réunion afin de chercher à obtenir un soutien volontaire
      supplémentaire de sorte que le BIPM puisse mettre en oeuvre des activités supplémentaires
      liées à sa mission,"
  actions:
  - type: thanks / expresses-appreciation
    date_effective: '2014-11-20'
    message: les laboratoires nationaux de métrologie qui ont apporté au BIPM un soutien
      volontaire sous quelque forme que ce soit, en particulier par voie de détachement
      de membres de leur personnel auprès du BIPM,  
  - type: decides
    date_effective: '2014-11-20'
    message: 'la dotation annuelle du BIPM, telle que définie à l''article 6, 1921,
      du Règlement annexé à la Convention du Mètre, sera fixée de façon à ce qu''elle
      corresponde, pour les États Parties à la Convention du Mètre au moment de la
      25e réunion de la CGPM, à :    '
  - type: decides
    date_effective: '2014-11-20'
    message: "  les États Membres, ainsi que les organisations internationales, les
      organismes privés et les fondations de continuer à apporter un soutien volontaire
      supplémentaire de toute sorte afin de soutenir des activités spécifiques liées
      à la mission du BIPM, en particulier celles qui faciliteront la participation
      aux activitésdu BIPM par les pays qui ne disposent pas d'une infrastructure
      métrologique bien développée."
  - type: decides
    date_effective: '2014-11-20'
    message: 10.59161/CGPM2014RES4F
- dates:
  - '2014-11-20'
  subject: CGPM
  type: resolution
  title: Sur l'importance de l'Arrangement de reconnaissance mutuelle du CIPM
  identifier: '5'
  url: https://www.bipm.org/fr/committees/cg/cgpm/25-2014/resolution-5
  reference:
  reference_name:
  reference_page:
  approvals: []
  considerations:
  - type: considering
    date_effective: '2014-11-20'
    message: "    la pertinence et l'importance du CIPM MRA tel que formulé, en particulier,
      dans la Résolution 6 (2003) adoptée par la CGPM à sa 22e réunion et dans la
      Résolution 4 (2007) adoptée par la CGPM à sa 23e réunion, l'appréciation et
      le soutien que toutes les parties intéressées ont exprimés vis-à-vis du CIPM
      MRA depuis son entrée en vigueur il y a plus de quinze ans, l'impact économique
      et social positif qu'apporte le CIPM MRA en assurant la reconnaissance mutuelle
      des étalons nationaux de mesure et des certificats d'étalonnage et de mesurage,"
  - type: noting
    date_effective: '2014-11-20'
    message: "    qu'après quinze années d'existence et de succès du CIPM MRA, il
      est nécessaire de procéder à un examen de sa mise en oeuvre et de son fonctionnement,
      que les activités menées dans le cadre du CIPM MRA revêtent une importance directe
      pour le rôle, la mission et les objectifs du Bureau international des poids
      et mesures (BIPM), le rôle unique et particulier des organisations régionales
      de métrologie dans les activités du CIPM MRA, au sein du Comité mixte des organisations
      régionales de métrologie et du BIPM (JCRB) et pour les Associés à la CGPM, que
      des améliorations sont apportées au sein de la structure existante, parmi lesquelles
      la planification stratégique des comparaisons et la rationalisation continue
      des procédures, qu'un atelier sera organisé en 2015 avec pour objectif d'engager
      une discussion approfondie sur le CIPM MRA avec les directeurs des laboratoires
      nationaux de métrologie, les représentants des États Membres, les représentants
      des organisations régionales de métrologie ainsi que d'autres parties prenantes
      concernées, afin de souligner les bénéfices apportés par le CIPM MRA et de faire
      ressortir ce qui fonctionne correctement et ce qu'il est nécessaire d'améliorer
      concernant la mise en oeuvre du CIPM MRA,"
  actions:
  - type: invites / further invites
    date_effective: '2014-11-20'
    message: "    les Comités consultatifs et le JCRB à poursuivre leurs efforts continus
      afin de rationaliser le fonctionnement du CIPM MRA, dans le cadre de la structure
      existante, ainsi qu'à se préparer et à contribuer à l'examen plus large qui
      sera conduit en 2015, le Comité international des poids et mesures (CIPM) à
      établir un groupe de travail, dont la composition sera déterminée lors de l'atelier
      prévu en 2015 et qui sera placé sous la présidence du président du CIPM, afin
      de conduire un examen de la mise en oeuvre et du fonctionnement du CIPM MRA,"
  - type: decides
    date_effective: '2014-11-20'
    message: "    sa recommandation selon laquelle les principes du CIPM MRA doivent
      figurer dans les accords intergouvernementaux si nécessaire,"
  - type: encourages
    date_effective: '2014-11-20'
    message: "  tous les signataires du CIPM MRA à soutenir les activités et le travail
      du groupe de travail sur le CIPM MRA."
  - type: decides
    date_effective: '2014-11-20'
    message: 10.59161/CGPM2014RES5F
