  type: resolution
  title: Temps atomique international ; rôle du CIPM
  identifier: '1'
  url: https://www.bipm.org/fr/committees/cg/cgpm/14-1971/resolution-1
  reference:
  reference_name:
  reference_page:
  approvals: []
  considerations: []
  actions:
  - type: requests
    date_effective: '1971-10-07'
    message: au Comité international des poids et mesures que la seconde, unité de
      temps du Système international d'unités, est définie depuis 1967 d'après une
      fréquence atomique naturelle, et non plus d'après des échelles de temps fournies
      par des mouvements astronomiques, que le besoin d'une échelle de Temps atomique
      international (TAI) est une conséquence de la définition atomique de la seconde,
      que plusieurs organisations internationales ont assuré et assurent encore avec
      succès l'établissement des échelles de temps fondées sur des mouvements astronomiques,
      particulièrement grâce aux services permanents du Bureau international de l'heure
      (BIH), que le Bureau international de l'heure a commencé à établir une échelle
      de temps atomique dont les qualités sont reconnues et qui a prouvé son utilité,
      que les étalons atomiques de fréquence servant à la réalisation de la seconde
      ont été considérés et doivent continuer de l'être par le Comité international
      des poids et mesures assisté d'un comité consultatif, et que l'intervalle unitaire
      de l'échelle de Temps atomique international doit être la seconde réalisée conformément
      à sa définition atomique, que toutes les organisations scientifiques internationales
      compétentes et les laboratoires nationaux actifs dans ce domaine ont exprimé
      le désir que le Comité international et la Conférence générale des poids et
      mesures donnent une définition du Temps atomique international, et contribuent
      à l'établissement de l'échelle de Temps atomique international, que l'utilité
      du Temps atomique international nécessite une coordination étroite avec les
      échelles de temps fondées sur des mouvements astronomiques, de donner une définition
      du Temps atomique international ; de prendre les mesures nécessaires, en accord
      avec les organisations internationales intéressées, pour que les compétences
      scientifiques et les moyens d'action existants soient utilisés au mieux pour
      la réalisation de l'échelle de Temps atomique international, et pour que soient
      satisfaits les besoins des utilisateurs du Temps atomique international. de
      donner une définition du Temps atomique international ; de prendre les mesures
      nécessaires, en accord avec les organisations internationales intéressées, pour
      que les compétences scientifiques et les moyens d'action existants soient utilisés
      au mieux pour la réalisation de l'échelle de Temps atomique international, et
      pour que soient satisfaits les besoins des utilisateurs du Temps atomique international.
  - type: decides
    date_effective: '1971-10-07'
    message: 10.59161/CGPM1971RES1F La définition du TAI a été donnée par le CCDS
      en 1970 (maintenant renommé CCTF).
- dates:
  - '1971-10-07'
  subject: CGPM
  type: resolution
  title: Temps atomique international ; arrangements avec le Bureau international
    de l'heure
  identifier: '2'
  url: https://www.bipm.org/fr/committees/cg/cgpm/14-1971/resolution-2
  reference:
  reference_name:
  reference_page:
  approvals: []
  considerations:
  - type: considering
    date_effective: '1971-10-07'
    message: qu'une échelle de Temps atomique international doit être mise à la disposition
      des utilisateurs, que le Bureau international de l'heure a prouvé qu'il est
      capable d'assurer ce service ;
  actions:
  - type: decides
    date_effective: '1971-10-07'
    message: au Bureau international de l'heure pour l'œuvre qu'il a déjà accomplie
      ;
  - type: requests
    date_effective: '1971-10-07'
    message: aux institutions nationales et internationales de bien vouloir continuer,
      et si possible augmenter, l'aide qu'elles donnent au Bureau international de
      l'heure, pour le bien de la communauté scientifique et technique internationale
      ;
  - type: authorizes
    date_effective: '1971-10-07'
    message: le Comité international des poids et mesures à conclure avec le Bureau
      international de l'heure les arrangements nécessaires pour la réalisation de
      l'échelle de Temps atomique international à définir par le Comité international.
  - type: decides
    date_effective: '1971-10-07'
    message: 10.59161/CGPM1971RES2F
- dates:
  - '1971-10-07'
  subject: CGPM
  type: resolution
  title: Unité SI de quantité de matière (mole)
  identifier: '3'
  url: https://www.bipm.org/fr/committees/cg/cgpm/14-1971/resolution-3
  reference:
  reference_name:
  reference_page:
  approvals: []
  considerations:
  - type: considering
    date_effective: '1971-10-07'
    message: les avis de l'Union internationale de physique pure et appliquée, de
      l'Union internationale de chimie pure et appliquée et de l'Organisation internationale
      de normalisation concernant le besoin de définir une unité de quantité de matière,
  actions:
  - type: decides
    date_effective: '1971-10-07'
    message: 10.59161/CGPM1971RES3F À sa session de 1980, le CIPM a approuvé le rapport
      de la 7e session du CCU (1980) précisant que, dans cette définition, il est
      entendu que l'on se réfère à des atomes de carbone 12 non liés, au repos et
      dans leur état fondamental. Cette définition de la mole a été abrogée en 2018
      par la 26e CGPM (Résolution 1), la nouvelle définition entrant en vigueur en
      2019.
- dates:
  - '1971-10-07'
  subject: CGPM
  type: resolution
  title: Approbation du programme de travail du Bureau international des poids et
    mesures pour 1973-1976
  identifier: '4'
  url: https://www.bipm.org/fr/committees/cg/cgpm/14-1971/resolution-4
  reference:
  reference_name:
  reference_page:
  approvals: []
  considerations: []
  actions:
  - type: decides
    date_effective: '1971-10-07'
    message: le programme d'activité du Bureau international des poids et mesures
      étudié et proposé par le Comité international des poids et mesures pour les
      quatre années 1973-1976,
  - type: decides
    date_effective: '1971-10-07'
    message: 'que ce programme est conçu de façon que le Bureau international des
      poids et mesures accomplisse ses missions en liaison avec les Comités consultatifs
      et sous l''autorité du Comité international des poids et mesures, missions dont
      les plus importantes sont : la coordination des programmes de recherche métrologique
      ayant un intérêt international ; la certification d''étalons servant de points
      de départ aux laboratoires qui le demandent ; l''organisation de mesures comparatives
      en vue de l''uniformité mondiale des résultats de mesure et en vue de la détection
      des erreurs ; l''élévation du niveau scientifique du personnel à un degré suffisant
      pour que le Bureau international des poids et mesures participe aux recherches
      métrologiques, assimile et mette en œuvre les nouvelles techniques, et fournisse
      une aide compétente aux pays de plus en plus nombreux qui s''efforcent de développer
      leur industrie et leur métrologie ;'
  - type: decides
    date_effective: '1971-10-07'
    message: au programme d'activité du Bureau international des poids et mesures
      proposé par le Comité international des poids et mesures pour les quatre années
      1973-1976.
  - type: decides
    date_effective: '1971-10-07'
    message: 10.59161/CGPM1971RES4F
- dates:
  - '1971-10-07'
  subject: CGPM
  type: resolution
  title: Dotation du Bureau international pour la période 1973-1976
  identifier: '5'
  url: https://www.bipm.org/fr/committees/cg/cgpm/14-1971/resolution-5
  reference:
  reference_name:
  reference_page:
  approvals: []
  considerations:
  - type: considering
    date_effective: '1971-10-07'
    message: que le programme d'activité du Bureau international des poids et mesures
      proposé par le Comité international des poids et mesures a été approuvé, que
      ce programme comporte la mise au point et la mise en œuvre permanente de techniques
      métrologiques nouvelles, particulièrement pour les mesures de longueur et les
      mesures électriques, nécessitant des investissements en matériel et en personnel
      compétent, qu'un accroissement annuel de 9 pour cent de la dotation du Bureau
      international est déjà devenu insuffisant pour le maintien des activités à leur
      niveau actuel, compte tenu de l'évolution des prix et des salaires et du niveau
      scientifique croissant exigé du personnel,
  actions:
  - type: decides
    date_effective: '1971-10-07'
    message: 'que la partie fixe de la dotation annuelle sera augmentée de façon que
      l''ensemble de la partie fixe et de la partie complémentaire [définies à l''Art.
      6 (1921) du Règlement annexé à la Convention du Mètre] soit, pour les États
      parties à la Convention à l''époque de la Treizième Conférence générale :  
       '
  - type: authorizes
    date_effective: '1971-10-07'
    message: que, sous réserve de la condition ci-après, un pourcentage de 22 pour
      cent des contributions annuelles puisse être payé en monnaie nationale, la condition
      obligatoire étant que le Comité international soit averti au moins un an avant
      le début de l'année en cause, afin que le budget annuel puisse être préparé,
      puis décidé par le Comité international, en tenant compte de la nature des devises
      qui seront disponibles ;
  - type: invites / further invites
    date_effective: '1971-10-07'
    message: les États qui choisiraient d'effectuer ces paiements en monnaie nationale
      à se mettre d'accord avec le Comité international des poids et mesures pour
      qu'ils soient employés à la satisfaction des besoins du Bureau international
      des poids et mesures en tenant compte des lois du pays.
  - type: decides
    date_effective: '1971-10-07'
    message: 10.59161/CGPM1971RES5F
