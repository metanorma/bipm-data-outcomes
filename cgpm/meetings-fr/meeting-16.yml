  subject: CGPM
  type: resolution
  title: Nom spécial pour l'unité SI d'équivalent de dose (sievert)
  identifier: '5'
  url: https://www.bipm.org/fr/committees/cg/cgpm/16-1979/resolution-5
  reference:
  reference_name:
  reference_page:
  approvals: []
  considerations:
  - type: considering
    date_effective: '1979-10-12'
    message: l'effort fait pour introduire les unités SI dans le domaine des rayonnements
      ionisants, les risques que peuvent encourir des être humains soumis à des irradiations
      sous-estimées, risques qui pourraient résulter de la confusion entre dose absorbée
      et équivalent de dose, que la prolifération des noms spéciaux représente un
      danger pour le Système international d'unités et doit être évitée dans toute
      la mesure du possible, mais que cette règle peut être transgressée lorsqu'il
      s'agit de sauvegarder la santé humaine,
  actions:
  - type: adopts
    date_effective: '1979-10-12'
    message: le nom spécial sievert, symbol Sv, pour l'unité SI d'équivalent de dose
      dans le domaine de la radioprotection. Le sievert est égal au joule par kilogramme.
  - type: decides
    date_effective: '1979-10-12'
    message: 10.59161/CGPM1979RES5F Le Comité international a décidé en 1984 d'accompagner
      cette Résolution d'une explication (Recommandation 1).
- dates:
  - '1979-10-12'
  subject: CGPM
  type: resolution
  title: Symboles du litre
  identifier: '6'
  url: https://www.bipm.org/fr/committees/cg/cgpm/16-1979/resolution-6
  reference:
  reference_name:
  reference_page:
  approvals: []
  considerations:
  - type: recognizing
    date_effective: '1979-10-12'
    message: les principes généraux adoptés pour l'écriture des symboles des unités
      dans la Résolution 7 de la 9e Conférence générale des poids et mesures (1948),
  - type: considering
    date_effective: '1979-10-12'
    message: que le symbole l pour l'unité litre a été adopté par le Comité international
      des poids et mesures en 1879 et confirmé dans cette même Résolution de 1948,
  - type: considering
    date_effective: '1979-10-12'
    message: aussi que, afin d'éviter un risque de confusion entre la lettre l et
      le chiffre 1, plusieurs pays ont adopté le symbole L au lieu de l pour l'unité
      litre,
  - type: considering
    date_effective: '1979-10-12'
    message: que le nom litre, bien qu'il ne soit pas inclus dans le Système international
      d'unités, doit être admis pour l'usage général avec ce Système,
  - type: considering
    date_effective: '1979-10-12'
    message: en outre que dans l'avenir un seul des deux symboles devrait être retenu,
  actions:
  - type: decides
    date_effective: '1979-10-12'
    message: ", à titre exceptionnel, d'adopter les deux symboles l et L comme symboles
      utilisables pour l'unité litre,"
  - type: invites / further invites
    date_effective: '1979-10-12'
    message: le Comité international des poids et mesures à suivre le développement
      de l'usage des deux symboles et à donner à la 18e Conférence générale des poids
      et mesures son avis sur la possibilité de supprimer l'un d'eux.
  - type: decides
    date_effective: '1979-10-12'
    message: 10.59161/CGPM1979RES6F Le Comité international a estimé encore prématuré,
      en 1990, de choisir un symbole unique du litre.
- dates:
  - '1979-10-12'
  subject: CGPM
  type: resolution
  title: Dotation du BIPM pour la période 1981-1984
  identifier: '7'
  url: https://www.bipm.org/fr/committees/cg/cgpm/16-1979/resolution-7
  reference:
  reference_name:
  reference_page:
  approvals: []
  considerations:
  - type: considering
    date_effective: '1979-10-12'
    message: l'importance des recherches effectuées et des services rendus par le
      Bureau international des poids et mesures dans les dernières années, la nécessité
      d'étendre son activité, d'améliorer constamment ses méthodes de travail et ses
      équipements ainsi que la qualification et la compétence de son personnel, afin
      de lui permettre de remplir sa mission de centre mondial de la métrologie scientifique,
      les retards inévitables accumulés depuis plusieurs années en raison d'une conjoncture
      économique difficile,
  - type: considering
    date_effective: '1979-10-12'
    message: où x représente le pourcentage de répartition calculé pour la République
      populaire de Chine, à partir du coefficient de l'ONU valable au 1er janvier
      1980, en appliquant la procédure adoptée par la 11e Conférence générale des
      poids et mesures, que par suite de l'adhésion de la République populaire de
      Chine à la Convention du Mètre, la dotation annuelle qui sert de base pour calculer
      la dotation pour les années 1981 - 1984 est obtenue en multipliant la dotation
      annuelle du Bureau international des poids et mesures pour l'année 1980, votée
      par la 15e Conférence générale des poids et mesures, par un facteur (100 + x)/100,
  actions:
  - type: decides
    date_effective: '1979-10-12'
    message: que la partie fixe de la dotation annuelle du Bureau international sera
      augmentée de telle façon que l'ensemble de la partie fixe et de la partie complémentaire
      (définies à l'Article 6 (1921) du Règlement annexé à la Convention du Mètre),
      pour les États membres de la Convention du Mètre à l'époque de la 16e Conférence
      générale des poids et mesures, soit obtenu pour les années 1981, 1982, 1983
      et 1984 en multipliant la dotation de base par 1,12, (1,12)2, (1,12)3 et (1,12)4
      respectivement.
  - type: decides
    date_effective: '1979-10-12'
    message: sans avis contraire le principe d'une proposition du CIPM, dûment notifiée
      à l'avance aux Gouvernements conformément à l'Article 6 (1921), paragraphe 5,
      du Règlement annexé à la Convention du Mètre de 1875,
  - type: decides
    date_effective: '1979-10-12'
    message: où x représente le pourcentage de répartition calculé pour la République
      populaire de Chine, à partir du coefficient de l'ONU valable au 1er janvier
      1980, en appliquant la procédure adoptée par la 11e Conférence générale des
      poids et mesures. qu'à partir du 1er janvier 1981 les pourcentages de répartition
      maximal et minimal adoptés par la 11e CGPM seront multipliés par un facteur
      100/(100 + x),
  - type: decides
    date_effective: '1979-10-12'
    message: 10.59161/CGPM1979RES7F
