  title: Étalons du kilogramme (conservation ; correction de poussée de l'air)
  identifier: '1'
  url: https://www.bipm.org/fr/committees/cg/cgpm/16-1979/resolution-1
  reference:
  reference_name:
  reference_page:
  approvals: []
  considerations:
  - type: considering
    date_effective: '1979-10-12'
    message: que l'exactitude des mesures de masse suppose une parfaire conservation
      des étalons du kilogramme, en particulier des Kilogrammes prototypes en platine
      iridié, que la transmission de cette exactitude aux étalons du kilogramme constitués
      d'autres matériaux comme les aciers inoxydables est limitée par une connaissance
      insuffisante de la correction due à la poussée de l'air, que cette poussée de
      l'air est le plus souvent calculée à partir des conditions ambiantes, mais qu'il
      existe des divergences significatives entre les formules utilisées pour ce calcul
      dans différents laboratoires,
  actions:
  - type: recommends
    date_effective: '1979-10-12'
    message: que les laboratoires étudient l'influence des conditions ambiantes sur
      les étalons du kilogramme et les moyens d'améliorer leur conservation, que les
      laboratoires intensifient les travaux en vue d'une meilleure détermination de
      la correction due à la poussée de l'air.
  - type: decides
    date_effective: '1979-10-12'
    message: 10.59161/CGPM1979RES1F
- dates:
  - '1979-10-12'
  subject: CGPM
  type: resolution
  title: Étalons électriques (poursuite des recherches sur la réalisation des unités
    électriques)
  identifier: '2'
  url: https://www.bipm.org/fr/committees/cg/cgpm/16-1979/resolution-2
  reference:
  reference_name:
  reference_page:
  approvals: []
  considerations:
  - type: considering
    date_effective: '1979-10-12'
    message: l'importance pour toutes les applications des mesures électriques d'une
      réalisation plus exacte des unités SI, en particulier du volt et de l'ampère,
      les progrès récents accomplis dans ces réalisations, soit par des méthodes directes,
      soit indirectement par des déterminations de constantes physiques, les divergences
      qui subsistent entre les résultats donnés par ces différentes méthodes, la nécessité
      de pouvoir comparer des réalisations indépendantes entre elles pour élucider
      l'origine de ces divergences, l'amélioration de l'exactitude que l'on obtiendra
      dès qu'une meilleure cohérence permettra de fixer des valeurs plus exactes pour
      les différentes réalisations de ces unités,
  actions:
  - type: recommends
    date_effective: '1979-10-12'
    message: de poursuivre et d'intensifier les recherches sur la réalisation directe
      des unités électriques aussi bien que sur leur réalisation indirecte par des
      déterminations de constantes physiques.
  - type: decides
    date_effective: '1979-10-12'
    message: 10.59161/CGPM1979RES2F
- dates:
  - '1979-10-12'
  subject: CGPM
  type: resolution
  title: Unité SI d'intensité lumineuse (candela)
  identifier: '3'
  url: https://www.bipm.org/fr/committees/cg/cgpm/16-1979/resolution-3
  reference:
  reference_name:
  reference_page:
  approvals: []
  considerations:
  - type: considering
    date_effective: '1979-10-12'
    message: que malgré les efforts méritoires de quelques laboratoires, il subsiste
      des divergences excessives entre les résultats de la réalisation de la candela
      à l'aide du corps noir étalon primaire actuel, que les techniques radiométriques
      se développent rapidement, autorisant des précisions qui sont déjà analogues
      à celles de la photométrie et que ces techniques sont déjà en usage dans des
      laboratoires nationaux pour réaliser la candela sans avoir à construire un corps
      noir, que la relation entre les grandeurs lumineuses de la photométrie et les
      grandeurs énergétiques, à savoir la valeur 683 lumens par watt pour l'efficacité
      lumineuse spectrale de la radiation monochromatique de fréquence 540 ´ 1012
      hertz, a été adoptée par le Comité international des poids et mesures en 1977,
      que cette valeur a été reconnue suffisamment exacte pour le système des grandeurs
      lumineuses photopiques, qu'elle n'entraîne qu'un changement d'environ 3 % pour
      le système des grandeurs lumineuses scotopiques et que par conséquent elle assure
      une continuité satisfaisante, que le moment est venu de donner à la candela
      une définition susceptible d'améliorer la facilité d'établissement des étalons
      photométriques et leur précision, et qui s'applique aux grandeurs photopiques
      et scotopiques de la photométrie et aux grandeurs à définir dans le domaine
      mésopique,
  actions:
  - type: decides
    date_effective: '1979-10-12'
    message: "10.59161/CGPM1979RES3F La vision photopique est détectée sur la rétine
      de l'\x9Cil par les cônes, sensibles aux luminances élevées (L > environ 10
      cd m\x962), qui correspondent à la vision diurne. La vision scotopique est détectée
      sur la rétine de l'\x9Cil par les bâtonnets, sensibles aux faibles luminances
      (L < environ 10\x963 cd m\x962), qui correspondent à la vision nocturne. Dans
      le cas de luminances intermédiaires entre la vision photopique et la vision
      scotopique, les cônes et les bâtonnets fonctionnent simultanément, on est alors
      dans le domaine de la vision mésopique. Cette définition de la candela a été
      abrogée en 2018 par la 26e CGPM (Résolution 1), la nouvelle définition entrant
      en vigueur en 2019."
- dates:
  - '1979-10-12'
