  subject: CGPM
  type: resolution
  title: Étalons de temps et comparaisons de temps
  identifier: '1'
  url: https://www.bipm.org/fr/committees/cg/cgpm/19-1991/resolution-1
  reference:
  reference_name:
  reference_page:
  approvals: []
  considerations:
  - type: considering
    date_effective: '1991-10-04'
    message: que l'exactitude des comparaisons d'horloges distantes a été grandement
      améliorée par l'utilisation des techniques spatiales,
  actions:
  - type: decides
    date_effective: '1991-10-04'
    message: que cette exactitude peut encore être améliorée grâce à une meilleure
      utilisation des techniques courantes faisant appel aux satellites, fait apparaître
      les différences entre étalons atomiques de fréquence et leurs variations systématiques,
      permet une meilleure synchronisation des échelles nationales de temps,
  - type: recommends
    date_effective: '1991-10-04'
    message: que soient construits de nouveaux étalons primaires à césium, que soit
      améliorée l'exactitude de la fréquence des étalons primaires existants et que
      l'on étudie les différences systématiques de fréquence qui existent entre eux,
      que les laboratoires qui participent à l'établissement du Temps atomique international
      (TAI) assurent la constance des conditions d'installation et de fonctionnement
      de chacune des horloges qui contribuent au TAI, conservent soigneusement trace
      de ces conditions et les communiquent au Bureau international des poids et mesures,
      que les coordonnées adoptées pour les antennes utilisées pour les comparaisons
      d'horloges par satellite, à sens unique, correspondent à leur position réelle
      dans le système de référence terrestre du Service international de la rotation
      terrestre.
  - type: decides
    date_effective: '1991-10-04'
    message: 10.59161/CGPM1991RES1F
- dates:
  - '1991-10-04'
  subject: CGPM
  type: resolution
  title: L'effet Josephson et l'effet Hall quantique
  identifier: '2'
  url: https://www.bipm.org/fr/committees/cg/cgpm/19-1991/resolution-2
  reference:
  reference_name:
  reference_page:
  approvals: []
  considerations:
  - type: considering
    date_effective: '1991-10-04'
    message: que l'uniformité mondiale et la stabilité à long terme des représentations
      nationales des unités électriques sont particulièrement importantes pour la
      science, l'industrie et le commerce tant pour des raisons techniques que pour
      des raisons économiques, que de nombreux laboratoires nationaux utilisent maintenant
      l'effet Josephson ou l'effet Hall quantique pour conserver leurs représentations
      respectives du volt ou de l'ohm, ce qui leur donne une sécurité accrue en ce
      qui concerne la stabilité à long terme, que les valeurs attribuées à leurs représentations
      doivent être en accord aussi étroit que possible avec les unités du SI,
  - type: recalling / further recalling
    date_effective: '1991-10-04'
    message: la Résolution 6 de la 18e Conférence générale concernant les ajustements
      envisagés à l'époque pour les représentations du volt et de l'ohm,
  actions:
  - type: decides
    date_effective: '1991-10-04'
    message: des décisions prises par le Comité international des poids et mesures
      en 1988, lors de sa 77e session, au sujet de ces ajustements, et en particulier
      des valeurs KJ-90 (égale à 483 597,9 GHz/V) et RK-90 (égale à 25 812,807 Ω attribuées
      par convention, respectivement, à la constante de Josephson KJ lorsqu'elle est
      utilisée pour représenter le volt et à la constante de von Klitzing RK lorsqu'elle
      est utilisée pour représenter l'ohm,
  - type: recommends
    date_effective: '1991-10-04'
    message: que les laboratoires nationaux poursuivent leurs efforts pour réduire
      l'incertitude sur la connaissance que l'on a des rapports KJ-90/KJ et RK-90/RK,
      que soient poursuivies les recherches concernant la théorie fondamentale de
      l'effet Josephson et de l'effet Hall quantique.
  - type: decides
    date_effective: '1991-10-04'
    message: 10.59161/CGPM1991RES2F
- dates:
  - '1991-10-04'
  subject: CGPM
  type: resolution
  title: L'Échelle internationale de température de 1990 et les travaux futurs en
    thermométrie
  identifier: '3'
  url: https://www.bipm.org/fr/committees/cg/cgpm/19-1991/resolution-3
  reference:
  reference_name:
  reference_page:
  approvals: []
  considerations:
  - type: considering
    date_effective: '1991-10-04'
    message: que l'uniformité mondiale et la stabilité à long terme des mesures de
      température sont particulièrement importantes pour la science, l'industrie et
      le commerce, pour des raisons aussi bien techniques qu'économiques, que l'échelle
      internationale de température doit être aussi proche que possible de la température
      thermodynamique,
  - type: recalling / further recalling
    date_effective: '1991-10-04'
    message: que, dans sa Résolution 7, la 18e Conférence générale avait invité le
      Comité international des poids et mesures et les laboratoires nationaux à préparer
      et adopter une nouvelle échelle internationale pour remplacer l'Échelle internationale
      pratique de température de 1968, dont on savait alors qu'elle s'écartait de
      façon significative de la température thermodynamique, que l'Échelle internationale
      de température de 1990 (EIT-90) adoptée par le Comité international en 1989,
      lors de sa 78e session, est dans son ensemble plus précise, plus facile à réaliser
      et plus étroitement en accord avec la température thermodynamique et par conséquent
      satisfait aux exigences mentionnées dans la Résolution 7 de la 18e Conférence
      générale,
  actions:
  - type: recommends
    date_effective: '1991-10-04'
    message: aux laboratoires nationaux de poursuivre leurs efforts pour améliorer
      l'uniformité mondiale et la stabilité à long terme des mesures de température
      en mettant rapidement en œuvre l'EIT-90 et de maintenir le niveau de leurs programmes
      de recherche fondamentale en thermométrie.
  - type: decides
    date_effective: '1991-10-04'
    message: 10.59161/CGPM1991RES3F
- dates:
  - '1991-10-04'
  subject: CGPM
  type: resolution
  title: Préfixes SI zetta, zepto, yotta et yocto
  identifier: '4'
  url: https://www.bipm.org/fr/committees/cg/cgpm/19-1991/resolution-4
  reference:
  reference_name:
  reference_page:
  approvals: []
  considerations: []
  actions:
  - type: decides
    date_effective: '1991-10-04'
    message: 'd''ajouter à la liste des préfixes SI pour la formation des noms des
      multiples et sous-multiples des unités, adoptée par la 11e CGPM, Résolution
      12, paragraphe 3, la 12e CGPM, Résolution 8 et la 15e CGPM, Résolution 10, les
      préfixes suivants :'
  - type: decides
    date_effective: '1991-10-04'
    message: 10.59161/CGPM1991RES4F Les noms zepto et zetta évoquent le chiffre sept
      (septième puissance de 103) et la lettre « z » remplace la lettre « s » pour
      éviter le double emploi de la lettre « s » comme symbole. Les noms yocto et
      yotta sont dérivés de octo, qui évoque le chiffre huit (huitième puissance de
      103) ; la lettre « y » est ajoutée pour éviter l'emploi de la lettre « o » comme
      symbole à cause de la confusion possible avec le chiffre zéro.
