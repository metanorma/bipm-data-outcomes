  title: Vers une nouvelle définition du mètre
  identifier: '1'
  url: https://www.bipm.org/en/committees/cg/cgpm/9-1948/resolution-1
  reference: https://www.bipm.org/documents/20126/17314988/CGPM9.pdf/77fe0fa9-bda8-1620-831e-33646e446cd8?version=1.1&t=1587053483869&download=true#page=44
  reference_name: Proceedings of the 9th CGPM (1948), 1949, p44
  reference_page: 44
  approvals: []
  considerations:
  - type: recognizing
    date_effective: '1948-10-21'
    message: dans ces raies la possibilité de retrouver pour l'unité de longueur une
      base naturelle qui aurait une très haute précision ;
  actions:
  - type: decides
    date_effective: '1948-10-21'
    message: des possibilités nouvelles offertes par les raies spectrales des éléments
      à isotope unique, qui réunissent au plus haut point les qualités requises pour
      constituer les longueurs d'onde étalons ;
  - type: decides
    date_effective: '1948-10-21'
    message: aux savants dont les travaux ont abouti à la réalisation de quantités
      appréciables de ces éléments ;
  - type: invites / further invites
    date_effective: '1948-10-21'
    message: les grands Laboratoires et le Bureau international à poursuivre l'étude
      de ces raies, dans le but d'établir éventuellement une nouvelle définition du
      Mètre fondée sur la longueur d'onde d'une raie choisie, émise dans des conditions
      spécifiées.
  - type: decides
    date_effective: '1948-10-21'
    message: 10.59161/CGPM1948RES1E
- dates:
  - '1948-10-21'
  subject: CGPM
  type: resolution
  title: Concernant les mesures de gravité
  identifier: '2'
  url: https://www.bipm.org/en/committees/cg/cgpm/9-1948/resolution-2
  reference: https://www.bipm.org/documents/20126/17314988/CGPM9.pdf/77fe0fa9-bda8-1620-831e-33646e446cd8?version=1.1&t=1587053483869&download=true#page=52
  reference_name: Proceedings of the 9th CGPM (1948), 1949, p52
  reference_page: 52
  approvals: []
  considerations:
  - type: considering
    date_effective: '1948-10-21'
    message: le développement remarquable des mesures de gravité relative pour lesquelles
      la base actuellement admise date d'un demi-siècle et semble erronée d'une quantité
      appréciable, que les déterminations les plus récentes ne présentent pas encore
      une concordance suffisante et qu'il serait, par suite, désirable d'en contrôler
      les résultats par l'emploi de méthodes plus modernes,
  - type: recognizing
    date_effective: '1948-10-21'
    message: l'intérêt des déterminations absolues de l'intensité de la pesanteur
      en préparation au Bureau international des poids et mesures,
  actions:
  - type: recommends
    date_effective: '1948-10-21'
    message: aux laboratoires qui en ont la possibilité, d'effectuer des mesures analogues
      afin que, par la coordination des résultats obtenus, une base fondamentale plus
      précise puisse être proposée pour cette grandeur.
  - type: decides
    date_effective: '1948-10-21'
    message: 10.59161/CGPM1948RES2E
