  type: resolution
  title: Dotation du BIPM
  identifier: '5'
  url: https://www.bipm.org/en/committees/cg/cgpm/9-1948/resolution-5
  reference: https://www.bipm.org/documents/20126/17314988/CGPM9.pdf/77fe0fa9-bda8-1620-831e-33646e446cd8?version=1.1&t=1587053483869&download=true#page=59
  reference_name: Proceedings of the 9th CGPM (1948), 1949, p59
  reference_page: 59
  approvals: []
  considerations: []
  actions:
  - type: decides
    date_effective: '1948-10-21'
    message: que le chiffre de la dotation n'a pas été modifié depuis 20 ans, que,
      dans cette même période, les attributions du Bureau ont reçu une extension importante
      entraînant une augmentation corrélative des dépenses d'entretien, que, dans
      ces conditions, il paraît nécessaire de relever le montant de la dotation,
  - type: decides
    date_effective: '1948-10-21'
    message: 10.59161/CGPM1948RES5E
- dates:
  - '1948-10-21'
  subject: CGPM
  type: resolution
  title: Proposal for establishing a practical system of units of measurement
  identifier: '6'
  url: https://www.bipm.org/en/committees/cg/cgpm/9-1948/resolution-6
  reference: https://www.bipm.org/documents/20126/17314988/CGPM9.pdf/77fe0fa9-bda8-1620-831e-33646e446cd8?version=1.1&t=1587053483869&download=true#page=64
  reference_name: Proceedings of the 9th CGPM (1948), 1949, p64
  reference_page: 64
  approvals: []
  considerations:
  - type: considering
    date_effective: '1948-10-21'
    message: that the Comité International des Poids et Mesures (CIPM) has been requested
      by the International Union of Physics to adopt for international use a practical
      Système International d'Unités; that the International Union of Physics recommends
      the MKS system and one electric unit of the absolute practical system, but does
      not recommend that the CGS system be abandoned by physicists; that the CGPM
      has itself received from the French Government a similar request, accompanied
      by a draft to be used as basis of discussion for the establishment of a complete
      specification of units of measurement;
  actions:
  - type: instructs
    date_effective: '1948-10-21'
    message: 'the CIPM: to seek by an energetic, active, official enquiry the opinion
      of scientific, technical and educational circles of all countries (offering
      them, in fact, the French document as basis); to gather and study the answers;
      to make recommendations for a single practical system of units of measurement,
      suitable for adoption by all countries adhering to the Metre Convention.'
  - type: decides
    date_effective: '1948-10-21'
    message: 10.59161/CGPM1948RES6E
- dates:
  - '1948-10-21'
  subject: CGPM
  type: resolution
  title: Writing and printing of unit symbols and of numbers
  identifier: '7'
  url: https://www.bipm.org/en/committees/cg/cgpm/9-1948/resolution-7
  reference: https://www.bipm.org/documents/20126/17314988/CGPM9.pdf/77fe0fa9-bda8-1620-831e-33646e446cd8?version=1.1&t=1587053483869&download=true#page=70
  reference_name: Proceedings of the 9th CGPM (1948), 1949, p70
  reference_page: 70
  approvals: []
  considerations: []
  actions:
  - type: decides
    date_effective: '1948-10-21'
    message: Roman (upright) type, in general lower case, is used for symbols of units;
      if, however, the symbols are derived from proper names, capital roman type is
      used. These symbols are not followed by a full stop. In numbers, the comma (French
      practice) or the dot (British practice) is used only to separate the integral
      part of numbers from the decimal part. Numbers may be divided in groups of three
      in order to facilitate reading; neither dots nor commas are ever inserted in
      the spaces between groups.
  - type: decides
    date_effective: '1948-10-21'
    message: '10.59161/CGPM1948RES7E The CGPM abrogated certain decisions on units
      and terminology, in particular: micron, degree absolute, and the terms "degree",
      and "deg", 13th CGPM, 1967 (Resolutions 7 and 3), and the litre; 16th CGPM,
      1979 (Resolution 6).'
- dates:
