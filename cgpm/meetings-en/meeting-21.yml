  subject: CGPM
  type: resolution
  title: Long-term needs relating to metrology
  identifier: '1'
  url: https://www.bipm.org/en/committees/cg/cgpm/21-1999/resolution-1
  reference: https://www.bipm.org/documents/20126/17314988/CGPM21.pdf/c113ab98-4856-eeb9-6e8e-ed738a474108?version=1.1&t=1587051095683&download=true#page=325
  reference_name: Proceedings of the 21st CGPM (1999), 2001, p325
  reference_page: 325
  approvals: []
  considerations:
  - type: considering
    date_effective: '1999-10-15'
    message: 'Resolution 11 of the 20th General Conference, which requested the International
      Committee to study and report on the long-term needs relating to metrology,
      the study which was completed in 1997 after extensive international consultations,
      the resultant report, entitled National and international needs relating to
      metrology: International collaborations and the role of the BIPM, which was
      sent by the International Committee in 1998 to the governments of the Member
      States,'
  - type: notes
    date_effective: '1999-10-15'
    message: the discussion in the report of the International Committee of the long-term
      financial commitments required from the Member States,
  actions:
  - type: welcomes
    date_effective: '1999-10-15'
    message: the many decisions made by the International Committee as a consequence
      of the study and, in particular the progressive broadening of the terms of reference
      of the Consultative Committees to cover the principal fields of metrology where
      collaboration between the national metrology institutes is important, not only
      in physics and engineering but also in other disciplines such as chemistry and
      biotechnology, the strengthening of the role of the Consultative Committees
      and the admission of observers to their meetings to enable more Member States
      to participate, the emphasis on evaluating and publishing the degree of equivalence
      of national measurement standards of the Member States and on the establishment
      of an associated mutual recognition arrangement of national measurement standards
      and of calibration and measurement certificates issued by national metrology
      institutes, the introduction of periodic meetings with the directors of the
      national metrology institutes of the Member States, the statement by the International
      Committee of the role of the BIPM in the early decades of the 21st century,
      the increased collaboration of the BIPM with related international organizations,
      especially the regional metrology organizations, the International Laboratory
      Accreditation Cooperation and the Organisation Internationale de Métrologie
      Légale, the considerable progress already made by the International Committee
      in implementing its decisions,
  - type: thanks / expresses-appreciation
    date_effective: '1999-10-15'
    message: the many organizations and individuals who have contributed to the study
      and the report of the International Committee.
  - type: decides
    date_effective: '1999-10-15'
    message: 10.59161/CGPM1999RES1E
- dates:
  - '1999-10-15'
  subject: CGPM
  type: resolution
  title: Mutual recognition of national measurement standards and of calibration and
    measurement certificates issued by national metrology institutes
  identifier: '2'
  url: https://www.bipm.org/en/committees/cg/cgpm/21-1999/resolution-2
  reference: https://www.bipm.org/documents/20126/17314988/CGPM21.pdf/c113ab98-4856-eeb9-6e8e-ed738a474108?version=1.1&t=1587051095683&download=true#page=326
  reference_name: Proceedings of the 21st CGPM (1999), 2001, p326
  reference_page: 326
  approvals: []
  considerations:
  - type: considering
    date_effective: '1999-10-15'
    message: Resolution 2 of the 20th General Conference concerning worldwide traceability
      of measurements, the rapidly increasing emphasis on the need to demonstrate
      international equivalence of measurements and test results related to trade,
      the increasing number of mutual recognition arrangements and agreements being
      negotiated internationally concerning calibration and testing services, that
      the calibration and testing services in each nation depend on a national metrology
      institute both for their measurement standards and for traceability to the SI,
  actions:
  - type: decides
    date_effective: '1999-10-15'
    message: that mutual recognition of the national measurement standards and the
      calibration services of the national metrology institutes is necessary in order
      to provide the basis for mutual recognition of calibration and test services
      generally,
  - type: welcomes
    date_effective: '1999-10-15'
    message: the initiative taken by the International Committee in drawing up a mutual
      recognition arrangement related to national measurement standards and to calibration
      and measurement certificates issued by national metrology institutes, the decisions
      of those Member States that have already given authority to the director of
      the designated national metrology institute in their country to sign the arrangement,
  - type: invites / further invites
    date_effective: '1999-10-15'
    message: all other Member States of the Metre Convention to participate in the
      arrangement by giving authority to the director of the designated national metrology
      institute in their country to sign the arrangement, all Member States to make
      every effort to implement the arrangement and to encourage other authorities
      in their country to recognize the equivalence of national measurement standards
      and calibration and measurement certificates thereby demonstrated, all States
      to use this arrangement as the basis for recognizing the national measurement
      standards and calibration and measurement certificates of signatory national
      metrology institutes.
  - type: decides
    date_effective: '1999-10-15'
    message: 10.59161/CGPM1999RES2E
- dates:
  - '1999-10-15'
  subject: CGPM
  type: resolution
  title: Associates of the Conférence Générale des Poids et Mesures
  identifier: '3'
  url: https://www.bipm.org/en/committees/cg/cgpm/21-1999/resolution-3
  reference: https://www.bipm.org/documents/20126/17314988/CGPM21.pdf/c113ab98-4856-eeb9-6e8e-ed738a474108?version=1.1&t=1587051095683&download=true#page=327
  reference_name: Proceedings of the 21st CGPM (1999), 2001, p327
  reference_page: 327
  approvals: []
  considerations:
  - type: considering
    date_effective: '1999-10-15'
    message: that the worldwide measurement infrastructure, based on the International
      System of Units (SI) used in almost every aspect of modern society, rests on
      the universal application of the decisions of the General Conference, all States,
      not only those that are Member States of the Metre Convention, engage in measurements
      which are related to trade and need to be traceable to the SI, States which
      are not Member States of the Metre Convention are at present excluded from the
      activities of the Convention, Member States of the Metre Convention support
      the world's measurement system by devoting considerable financial resources
      to the BIPM and to their own national measurement systems, many smaller States
      would have difficulty in allocating funds sufficient to meet the cost of membership
      of the Metre Convention,
  actions:
  - type: decides
    date_effective: '1999-10-15'
    message: to assume a responsibility for providing those States and Economies not
      yet members of the Metre Convention with the means to establish links to the
      world's measurement system so as to provide recognition of the traceability
      of their measurements to the SI, that an important link can be through participation
      in the mutual recognition arrangement related to national measurement standards
      now operated by the International Committee, that participation in the arrangement
      for such a State or Economy should be by the association of their national metrology
      institutes with a regional metrology organization that is a member of the Joint
      Committee of the Regional Metrology Organizations and the BIPM,
  - type: decides
    date_effective: '1999-10-15'
    message: and consequently to invite such States and Economies to take part in
      the General Conference as Associates, thereby establishing the connection with
      the Member States of the Metre Convention necessary for them to participate
      in the mutual recognition arrangement, that Associate States and Economies of
      the General Conference participate in the Conference through the appointment
      of non-voting observers, that Associate States and Economies shall pay an annual
      subscription to the BIPM to meet the cost of providing the services that the
      International Committee may make available to them; the annual subscription
      of each Associate State or Economy will be determined from its UN contribution,
      as for Member States but with a minimum equal to 0.05 % of the annual dotation
      of the BIPM, that a State or Economy wishing to become an Associate may do so
      by application to the Director of the BIPM, either directly or through its Embassy
      in Paris, and by the payment of the first annual subscription, that an Associate
      State or Economy three years in arrears with its subscription cease to be an
      Associate; it may be reinstated on payment of these arrears.
  - type: decides
    date_effective: '1999-10-15'
    message: 10.59161/CGPM1999RES3E
- dates:
  - '1999-10-15'
  subject: CGPM
  type: resolution
  title: The need to use SI units in studies of Earth resources, the environment,
    human well-being and related issues
  identifier: '4'
  url: https://www.bipm.org/en/committees/cg/cgpm/21-1999/resolution-4
  reference: https://www.bipm.org/documents/20126/17314988/CGPM21.pdf/c113ab98-4856-eeb9-6e8e-ed738a474108?version=1.1&t=1587051095683&download=true#page=328
  reference_name: Proceedings of the 21st CGPM (1999), 2001, p328
  reference_page: 328
  approvals: []
  considerations:
  - type: considering
    date_effective: '1999-10-15'
    message: that the effects on the geosphere and biosphere of industrial and commercial
      activities and of many other human pursuits, as well as natural phenomena, and
      the consequences for human health and well-being are the subject of major studies
      worldwide, governments are increasingly faced with decisions of great economic
      and political significance concerning the regulation of these activities, the
      policies of governments are influenced by studies depending critically on accurate
      and mutually compatible measurements often requiring very large economic investments,
      much of the important scientific evidence required for decisions by governments
      comes from measurements of small changes in certain key parameters, measurements
      sometimes extending over several decades, certain critical measurements have
      traditionally been made in ad hoc units, based upon special instrumentation
      or procedures, and not in the well-characterized and internationally agreed
      SI units, experience over many years has shown that measurements not directly
      linked to the SI cannot be relied upon in the long term, cannot be compared
      with similar measurements made elsewhere and do not adequately bring out possible
      relationships with measurements made in other scientific disciplines, increasing
      demands for reliability in measurements made for medical and therapeutic purposes
      are leading to more demanding regulation in these areas,
  actions:
  - type: recommends
    date_effective: '1999-10-15'
    message: that those responsible for studies of Earth resources, the environment,
      human well-being and related issues ensure that measurements made within their
      programmes are in terms of wellcharacterized SI units so that they are reliable
      in the long term, are comparable worldwide and are linked to other areas of
      science and technology through the world's measurement system established and
      maintained under the Metre Convention.
  - type: decides
    date_effective: '1999-10-15'
    message: 10.59161/CGPM1999RES4E
- dates:
  - '1999-10-15'
  subject: CGPM
  type: resolution
  title: Revision of the <i>mise en pratique</i> of the definition of the metre
  identifier: '5'
  url: https://www.bipm.org/en/committees/cg/cgpm/21-1999/resolution-5
  reference: https://www.bipm.org/documents/20126/17314988/CGPM21.pdf/c113ab98-4856-eeb9-6e8e-ed738a474108?version=1.1&t=1587051095683&download=true#page=329
  reference_name: Proceedings of the 21st CGPM (1999), 2001, p329
  reference_page: 329
  approvals: []
  considerations:
  - type: recalling / further recalling
    date_effective: '1999-10-15'
    message: that in 1983 the 17th General Conference adopted a new definition of
      the metre, in the same year the General Conference invited the International
      Committee in response to this invitation the International Committee made recommendations
      in 1983 and again in 1992 concerning the practical realization of the metre,
  - type: considering
    date_effective: '1999-10-15'
    message: that science and technology continue to demand improved accuracy in the
      realization of the metre, since 1992 work in national laboratories, the Bureau
      International des Poids et Mesures and elsewhere has substantially improved
      the reproducibility of radiations which are suitable for the practical realization
      of the metre, such work has also substantially reduced the uncertainty in the
      determined values of the frequencies and vacuum wavelengths of some of these
      radiations, a revision of the list of recommended radiations is desirable for
      many applications, which include not only the direct realization of the metre
      by means of optical interferometry for practical length measurement, but also
      spectroscopy, atomic and molecular physics and the determination of fundamental
      constants, the accuracy already achieved and advances now foreseeable in certain
      space-time measurements require the practical realization of the definition
      of the metre to be considered in the context of the theory of general relativity,
  actions:
  - type: welcomes
    date_effective: '1999-10-15'
    message: the adoption by the International Committee in 1997 of a revised mise
      en pratique of the definition of the metre,
  - type: recommends
    date_effective: '1999-10-15'
    message: and that national laboratories pursue experimental and theoretical research
      on optical wavelength and frequency standards, including the development of
      new techniques for the comparison of different standards over a wide range of
      wavelength and frequency to improve yet further the experimental basis of the
      International System of Units.
  - type: decides
    date_effective: '1999-10-15'
    message: 10.59161/CGPM1999RES5E
- dates:
  - '1999-10-15'
  subject: CGPM
  type: resolution
  title: Requirements for dimensional metrology
  identifier: '6'
  url: https://www.bipm.org/en/committees/cg/cgpm/21-1999/resolution-6
  reference: https://www.bipm.org/documents/20126/17314988/CGPM21.pdf/c113ab98-4856-eeb9-6e8e-ed738a474108?version=1.1&t=1587051095683&download=true#page=330
  reference_name: Proceedings of the 21st CGPM (1999), 2001, p330
  reference_page: 330
  approvals: []
  considerations:
  - type: considering
    date_effective: '1999-10-15'
    message: that requirements for advanced dimensional metrology continue to increase,
      tolerances in high-technology manufacturing continue to fall and that in some
      areas they are already at the limit of what is possible today, the range over
      which such requirements exist extends inclusively from the domain of nanotechnology
      to the domain of geophysics, many different areas of metrology call upon realizations
      of SI derived units that themselves include the metre, the most demanding requirements
      in dimensional metrology often call for the realization of the metre by the
      simplest and the most direct way possible using stabilized lasers, to provide
      for the future and to ensure that the world's metrological system is capable
      of meeting future demand, continued basic research is essential,
  actions:
  - type: recommends
    date_effective: '1999-10-15'
    message: that national laboratories maintain a wide research base in length metrology
      that includes the maintenance and development of techniques to meet the diverse
      and growing demands in the field of dimensional metrology.
  - type: decides
    date_effective: '1999-10-15'
    message: 10.59161/CGPM1999RES6E
- dates:
  - '1999-10-15'
  subject: CGPM
  type: resolution
  title: The definition of the kilogram
  identifier: '7'
  url: https://www.bipm.org/en/committees/cg/cgpm/21-1999/resolution-7
  reference: https://www.bipm.org/documents/20126/17314988/CGPM21.pdf/c113ab98-4856-eeb9-6e8e-ed738a474108?version=1.1&t=1587051095683&download=true#page=331
  reference_name: Proceedings of the 21st CGPM (1999), 2001, p331
  reference_page: 331
  approvals: []
  considerations:
  - type: considering
    date_effective: '1999-10-15'
    message: the need to assure the long-term stability of the SI, the intrinsic uncertainty
      in the long-term stability of the artefact defining the unit of mass, one of
      the base units of the SI, the consequent uncertainty in the long-term stability
      of the other three base units of the SI that depend on the kilogram, namely,
      the ampere, the mole and the candela, the progress already made in a number
      of different experiments designed to link the unit of mass to fundamental or
      atomic constants, the desirability of having more than one method of making
      such a link,
  actions:
  - type: recommends
    date_effective: '1999-10-15'
    message: that national laboratories continue their efforts to refine experiments
      that link the unit of mass to fundamental or atomic constants with a view to
      a future redefinition of the kilogram.
  - type: decides
    date_effective: '1999-10-15'
    message: 10.59161/CGPM1999RES7E
- dates:
  - '1999-10-15'
  subject: CGPM
  type: resolution
  title: Operational primary frequency standards
  identifier: '8'
  url: https://www.bipm.org/en/committees/cg/cgpm/21-1999/resolution-8
  reference: https://www.bipm.org/documents/20126/17314988/CGPM21.pdf/c113ab98-4856-eeb9-6e8e-ed738a474108?version=1.1&t=1587051095683&download=true#page=332
  reference_name: Proceedings of the 21st CGPM (1999), 2001, p332
  reference_page: 332
  approvals: []
  considerations:
  - type: considering
    date_effective: '1999-10-15'
    message: the importance of maintaining an adequate number of primary frequency
      standards to assure the accuracy and long-term stability of TAI, that new primary
      standards are being developed using new technology, that these new standards
      are significantly more accurate than the traditional primary standards upon
      which TAI and UTC have been based in the past, that in consequence, the accuracy
      of TAI and UTC will rapidly become dependent on these new standards, that considerable
      resources are required to maintain primary frequency standards as operational
      facilities to assure the accuracy of TAI,
  actions:
  - type: requests
    date_effective: '1999-10-15'
    message: national metrology institutes and other laboratories developing new primary
      standards, to make every effort to provide the human and other resources necessary
      to maintain as operational facilities these new standards upon which the accuracy
      of TAI and UTC will be based.
  - type: decides
    date_effective: '1999-10-15'
    message: 10.59161/CGPM1999RES8E
- dates:
  - '1999-10-15'
  subject: CGPM
  type: resolution
  title: Extension of the International Temperature Scale below 0.65 K
  identifier: '9'
  url: https://www.bipm.org/en/committees/cg/cgpm/21-1999/resolution-9
  reference: https://www.bipm.org/documents/20126/17314988/CGPM21.pdf/c113ab98-4856-eeb9-6e8e-ed738a474108?version=1.1&t=1587051095683&download=true#page=332
  reference_name: Proceedings of the 21st CGPM (1999), 2001, p332
  reference_page: 332
  approvals: []
  considerations:
  - type: considering
    date_effective: '1999-10-15'
    message: that many important research activities are in progress at temperatures
      below 0.65 K, these researches require an accepted temperature scale which closely
      represents thermodynamic temperatures, the direct measurement of thermodynamic
      temperature is often difficult and time-consuming at temperatures below 0.65
      K down to a few millikelvin, but at temperatures much lower than this direct
      measurements once again become feasible, considerable work has already been
      accomplished towards the development of a temperature scale for the range from
      0.65 K down to 1 mK based on the melting pressure of 3He,
  actions:
  - type: invites / further invites
    date_effective: '1999-10-15'
    message: the International Committee to prepare a 3He melting pressure equation
      as a function of thermodynamic temperature to serve as the basis for an extension
      of the ITS-90 below its present lower limit of 0.65 K.
  - type: decides
    date_effective: '1999-10-15'
    message: 10.59161/CGPM1999RES9E
- dates:
  - '1999-10-15'
  subject: CGPM
  type: resolution
  title: Metrology in chemistry
  identifier: '10'
  url: https://www.bipm.org/en/committees/cg/cgpm/21-1999/resolution-10
  reference: https://www.bipm.org/documents/20126/17314988/CGPM21.pdf/c113ab98-4856-eeb9-6e8e-ed738a474108?version=1.1&t=1587051095683&download=true#page=333
  reference_name: Proceedings of the 21st CGPM (1999), 2001, p333
  reference_page: 333
  approvals: []
  considerations:
  - type: recalling / further recalling
    date_effective: '1999-10-15'
    message: Resolution 7 of the 20th ConférenceGénérale des Poids et Mesures on metrology
      in chemistry,
  - type: considering
    date_effective: '1999-10-15'
    message: the worldwide development of trade agreements under the World Trade Organization,
      the need to eliminate metrology-related technical barriers to trade particularly
      in the areas of food science and pharmaceuticals, that many environmental and
      public health decisions are based on measurements in chemistry, that the development
      of worldwide traceability is still far from complete for measurements in chemistry,
  actions:
  - type: recommends
    date_effective: '1999-10-15'
    message: that national metrology institutes   continue to initiate and coordinate
      national activities in the field of metrology in chemistry, in close cooperation
      with other relevant bodies, in collaboration with the International Committee,
      work to define the areas of priority and essential international comparisons
      which are key to the traceability of measurements in chemistry, both worldwide
      and within regions.
  - type: decides
    date_effective: '1999-10-15'
    message: 10.59161/CGPM1999RES10E
- dates:
  - '1999-10-15'
  subject: CGPM
  type: resolution
  title: Metrology in biotechnology
  identifier: '11'
  url: https://www.bipm.org/en/committees/cg/cgpm/21-1999/resolution-11
  reference: https://www.bipm.org/documents/20126/17314988/CGPM21.pdf/c113ab98-4856-eeb9-6e8e-ed738a474108?version=1.1&t=1587051095683&download=true#page=334
  reference_name: Proceedings of the 21st CGPM (1999), 2001, p334
  reference_page: 334
  approvals: []
  considerations:
  - type: considering
    date_effective: '1999-10-15'
    message: the growing importance of biotechnology in human health, food production,
      forensic medicine and the protection of the environment, the need to make accurate
      measurements traceable to the SI in these fields, the lack of an adequate metrological
      infrastructure to ensure such traceability,
  actions:
  - type: recommends
    date_effective: '1999-10-15'
    message: national laboratories   to consider developing programmes related to
      the measurement of quantities important in biotechnology, to collaborate with
      the international scientific unions and the international organizations concerned
      in the establishment of an adequate international measurement infrastructure
      to ensure traceability to the SI in measurements in biotechnology.
  - type: decides
    date_effective: '1999-10-15'
    message: 10.59161/CGPM1999RES11E
- dates:
  - '1999-10-15'
  subject: CGPM
  type: resolution
  title: Special name for the SI derived unit mole per second, the katal, for the
    expression of catalytic activity
  identifier: '12'
  url: https://www.bipm.org/en/committees/cg/cgpm/21-1999/resolution-12
  reference: https://www.bipm.org/documents/20126/17314988/CGPM21.pdf/c113ab98-4856-eeb9-6e8e-ed738a474108?version=1.1&t=1587051095683&download=true#page=334
  reference_name: Proceedings of the 21st CGPM (1999), 2001, p334
  reference_page: 334
  approvals: []
  considerations:
  - type: considering
    date_effective: '1999-10-15'
    message: the importance for human health and safety of facilitating the use of
      SI units in the fields of medicine and biochemistry, that a non-SI unit called
      "unit", symbol U, equal to 1 µmol · min-1, which is not coherent with the SI,
      has been in widespread use in medicine and biochemistry since 1964 for expressing
      catalytic activity, that the absence of a special name for the SI coherent derived
      unit mole per second has led to results of clinical measurements being given
      in various local units, that the use of SI units in medicine and clinical chemistry
      is strongly recommended by the international unions in these fields, that the
      International Federation of Clinical Chemistry and Laboratory Medicine has asked
      the Consultative Committee for Units to recommend the special name katal, symbol
      kat, for the SI unit mole per second, that while the proliferation of special
      names represents a danger for the SI, exceptions are made in matters related
      to human health and safety (15th General Conference, 1975, Resolutions 8 and
      9, 16th General Conference, 1979, Resolution 5),
  - type: noting
    date_effective: '1999-10-15'
    message: that the name katal, symbol kat, has been used for the SI unit mole per
      second for over thirty years to express catalytic activity,
  actions:
  - type: decides
    date_effective: '1999-10-15'
    message: to adopt the special name katal, symbol kat, for the SI unit mole per
      second to express catalytic activity, especially in the fields of medicine and
      biochemistry,
  - type: recommends
    date_effective: '1999-10-15'
    message: and that when the katal is used, the measurand be specified by reference
      to the measurement procedure; the measurement procedure must identify the indicator
      reaction.
  - type: decides
    date_effective: '1999-10-15'
    message: 10.59161/CGPM1999RES12E
- dates:
  - '1999-10-15'
  subject: CGPM
  type: resolution
  title: Dotation of the BIPM
  identifier: '13'
  url: https://www.bipm.org/en/committees/cg/cgpm/21-1999/resolution-13
  reference: https://www.bipm.org/documents/20126/17314988/CGPM21.pdf/c113ab98-4856-eeb9-6e8e-ed738a474108?version=1.1&t=1587051095683&download=true#page=335
  reference_name: Proceedings of the 21st CGPM (1999), 2001, p335
  reference_page: 335
  approvals: []
  considerations:
  - type: considering
    date_effective: '1999-10-15'
    message: 'the importance of the work carried out by the Bureau International des
      Poids et Mesures (BIPM) and the services it renders to Member States of the
      Metre Convention, the considerable efforts made by the BIPM to enhance the efficiency
      of its operation, and its commitment to continue these efforts, the conclusions
      of the report National and international needs relating to metrology: International
      collaborations and the role of the BIPM, the decision of the International Committee,
      based on this report, to broaden the responsibilities of the BIPM, the recommendation
      in the report that, in recognition of the difficult economic situation now existing
      in many Member States of the Metre Convention, the BIPM annual dotation be held
      constant in real terms during the quadrennium 2001-2004 at the level determined
      by the 20th General Conference for the year 2000,'
  - type: noting
    date_effective: '1999-10-15'
    message: that on 1 January 1999, the new currency, the euro, came into operation
      in most States of the European Union and the rates of exchange between the euro
      and their currencies were definitively fixed, on 1 January 2002, most of today's
      European currencies, including the French franc, and thus the gold franc, will
      disappear,
  actions:
  - type: decides
    date_effective: '1999-10-15'
    message: that     henceforth the currency to be used in voting the annual dotation
      for the BIPM will be the euro, the fixed part of the annual dotation of the
      Bureau International des Poids et Mesures will be increased in a way such that
      the sum of the fixed part and the complementary part (defined by Article 6,
      1921) of the Rules annexed to the Metre Convention (1875) shall, for those States
