  type: resolution
  title: SI unit of time (second)
  identifier: '1'
  url: https://www.bipm.org/en/committees/cg/cgpm/13-1967/resolution-1
  reference: https://www.bipm.org/documents/20126/17314988/CGPM13.pdf/ff522dd4-7c97-9b8d-127b-4fe77f3fe2bc?version=1.2&t=1587104721230&download=true#page=103
  reference_name: Proceedings of the 13th CGPM (1967), 1969, p103
  reference_page: 103
  approvals: []
  considerations:
  - type: considering
    date_effective: '1967-10-16'
    message: that the definition of the second adopted by the Comité International
      des Poids et Mesures (CIPM) in 1956 (Resolution 1) and ratified by Resolution
      9 of the 11th CGPM (1960), later upheld by Resolution 5 of the 12th CGPM (1964),
      is inadequate for the present needs of metrology, that at its meeting of 1964
      the Comité International des Poids et Mesures (CIPM), empowered by Resolution
      5 of the 12th CGPM (1964), recommended, in order to fulfil these requirements,
      a caesium atomic frequency standard for temporary use, that this frequency standard
      has now been sufficiently tested and found sufficiently accurate to provide
      a definition of the second fulfilling present requirements, that the time has
      now come to replace the definition now in force of the unit of time of the Système
      International d'Unités by an atomic definition based on that standard,
  actions:
  - type: decides
    date_effective: '1967-10-16'
    message: 10.59161/CGPM1967RES1E At its 1997 meeting, the CIPM affirmed that this
      definition refers to a caesium atom at rest at a thermodynamic temperature of
      0 K. This definition of the second was abrogated in 2018 by the 26th CGPM (Resolution
      1), which became effective in 2019.
- dates:
  - '1967-10-16'
  subject: CGPM
  type: resolution
  title: Unité SI de temps (seconde)
  identifier: '2'
  url: https://www.bipm.org/en/committees/cg/cgpm/13-1967/resolution-2
  reference: https://www.bipm.org/documents/20126/17314988/CGPM13.pdf/ff522dd4-7c97-9b8d-127b-4fe77f3fe2bc?version=1.2&t=1587104721230&download=true#page=103
  reference_name: Proceedings of the 13th CGPM (1967), 1969, p103
  reference_page: 103
  approvals: []
  considerations:
  - type: considering
    date_effective: '1967-10-16'
    message: que l'étalon de fréquence à césium est encore perfectible et que des
      expériences en cours autorisent l'espoir de réaliser d'autres étalons ayant
      des qualités encore meilleures pour servir à définir la seconde,
  actions:
  - type: invites / further invites
    date_effective: '1967-10-16'
    message: les organisations et laboratoires experts dans le domaine des étalons
      atomiques de fréquence à poursuivre activement leurs études.
  - type: decides
    date_effective: '1967-10-16'
    message: 10.59161/CGPM1967RES2E
- dates:
  - '1967-10-16'
  subject: CGPM
  type: resolution
  title: SI unit of thermodynamic temperature (kelvin)
  identifier: '3'
  url: https://www.bipm.org/en/committees/cg/cgpm/13-1967/resolution-3
  reference: https://www.bipm.org/documents/20126/17314988/CGPM13.pdf/ff522dd4-7c97-9b8d-127b-4fe77f3fe2bc?version=1.2&t=1587104721230&download=true#page=104
  reference_name: Proceedings of the 13th CGPM (1967), 1969, p104
  reference_page: 104
  approvals: []
  considerations:
  - type: considering
    date_effective: '1967-10-16'
    message: the names "degree Kelvin" and "degree", the symbols "°K" and "deg" and
      the rules for their use given in Resolution 7 of the 9th CGPM (1948), in Resolution
      12 of the 11th CGPM (1960), and the decision taken by the Comité International
      des Poids et Mesures in 1962 (PV, 30, 27), that the unit of thermodynamic temperature
      and the unit of temperature interval are one and the same unit, which ought
      to be denoted by a single name and a single symbol,
  actions:
  - type: decides
    date_effective: '1967-10-16'
    message: 10.59161/CGPM1967RES3E
- dates:
  - '1967-10-16'
  subject: CGPM
  type: resolution
  title: Definition of the SI unit of thermodynamic temperature (kelvin)
  identifier: '4'
  url: https://www.bipm.org/en/committees/cg/cgpm/13-1967/resolution-4
  reference: https://www.bipm.org/documents/20126/17314988/CGPM13.pdf/ff522dd4-7c97-9b8d-127b-4fe77f3fe2bc?version=1.2&t=1587104721230&download=true#page=104
  reference_name: Proceedings of the 13th CGPM (1967), 1969, p104
  reference_page: 104
  approvals: []
  considerations:
  - type: considering
    date_effective: '1967-10-16'
    message: that it is useful to formulate more explicitly the definition of the
      unit of thermodynamic temperature contained in Resolution 3 of the 10th CGPM
      (1954),
  actions:
  - type: decides
    date_effective: '1967-10-16'
    message: 'to express this definition as follows: "The kelvin, unit of thermodynamic
      temperature, is the fraction 1/273.16 of the thermodynamic temperature of the
      triple point of water."'
  - type: decides
    date_effective: '1967-10-16'
    message: 10.59161/CGPM1967RES4E See Recommendation 5 (CI-1989) of the CIPM on
      the International Temperature Scale of 1990. This definition of the kelvin was
      abrogated in 2018 by the 26th CGPM (Resolution 1), which became effective in
      2019.
- dates:
  - '1967-10-16'
  subject: CGPM
  type: resolution
  title: SI unit of luminous intensity (candela)
  identifier: '5'
  url: https://www.bipm.org/en/committees/cg/cgpm/13-1967/resolution-5
  reference: https://www.bipm.org/documents/20126/17314988/CGPM13.pdf/ff522dd4-7c97-9b8d-127b-4fe77f3fe2bc?version=1.2&t=1587104721230&download=true#page=104
  reference_name: Proceedings of the 13th CGPM (1967), 1969, p104
  reference_page: 104
  approvals: []
  considerations:
  - type: considering
    date_effective: '1967-10-16'
    message: the definition of the unit of luminous intensity ratified by the 9th
      CGPM (1948) and contained in the "Resolution concerning the change of photometric
      units" adopted by the Comité International des Poids et Mesures in 1946 (PV,
      20, 119) in virtue of the powers conferred by the 8th CGPM (1933), that this
      definition fixes satisfactorily the unit of luminous intensity, but that its
      wording may be open to criticism,
  actions:
  - type: decides
    date_effective: '1967-10-16'
    message: 'to express the definition of the candela as follows: "The candela is
      the luminous intensity, in the perpendicular direction, of a surface of 1/600
      000 square metre of a black body at the temperature of freezing platinum under
      a pressure of 101 325 newtons per square metre."'
  - type: decides
    date_effective: '1967-10-16'
    message: 10.59161/CGPM1967RES5E This definition was abrogated by the 16th CGPM
      in 1979 (Resolution 3).
