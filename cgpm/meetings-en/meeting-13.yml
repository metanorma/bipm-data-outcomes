  subject: CGPM
  type: resolution
  title: Échelle internationale pratique de température (révision prochaine)
  identifier: '8'
  url: https://www.bipm.org/en/committees/cg/cgpm/13-1967/resolution-8
  reference: https://www.bipm.org/documents/20126/17314988/CGPM13.pdf/ff522dd4-7c97-9b8d-127b-4fe77f3fe2bc?version=1.2&t=1587104721230&download=true#page=105
  reference_name: Proceedings of the 13th CGPM (1967), 1969, p105
  reference_page: 105
  approvals: []
  considerations:
  - type: considering
    date_effective: '1967-10-16'
    message: qu'il est urgent de réviser l'Échelle internationale pratique de température
      de 1948 comme l'a déjà constaté la Douzième Conférence générale (1964) dans
      sa Résolution 10, que les laboratoires compétents se sont maintenant mis d'accord
      sur les grandes lignes de la révision de cette Échelle,
  actions:
  - type: decides
    date_effective: '1967-10-16'
    message: au Comité international des poids et mesures de prendre les décisions
      nécessaires pour que soit mise en vigueur dès que possible une nouvelle Échelle
      internationale pratique de température (Voir p.A 1, le texte de l' « Échelle
      internationale pratique de température de 1968 » adopté par le Comité international
      à sa 57e session (octobre 1968).
  - type: decides
    date_effective: '1967-10-16'
    message: 10.59161/CGPM1967RES8E
- dates:
  - '1967-10-16'
  subject: CGPM
  type: resolution
  title: Colorimétrie et radiométrie
  identifier: '9'
  url: https://www.bipm.org/en/committees/cg/cgpm/13-1967/resolution-9
  reference: https://www.bipm.org/documents/20126/17314988/CGPM13.pdf/ff522dd4-7c97-9b8d-127b-4fe77f3fe2bc?version=1.2&t=1587104721230&download=true#page=105
  reference_name: Proceedings of the 13th CGPM (1967), 1969, p105
  reference_page: 105
  approvals: []
  considerations:
  - type: considering
    date_effective: '1967-10-16'
    message: que la photométrie doit tenir compte des principes et des techniques
      de la colorimétrie et de la radiométrie,
  actions:
  - type: approves
    date_effective: '1967-10-16'
    message: l'intention exprimée par le Comité international des poids et mesures
      en 1965 (Procès-Verbaux, 33, p. 21) d'inclure dans ses activités et dans celles
      du Bureau international des poids et mesures les aspects métrologiques fondamentaux
      de la colorimétrie et de la radiométrie.
  - type: decides
    date_effective: '1967-10-16'
    message: 10.59161/CGPM1967RES9E
- dates:
  - '1967-10-16'
  subject: CGPM
  type: resolution
  title: Dotation du Bureau international pour la période 1969-1972
  identifier: '10'
  url: https://www.bipm.org/en/committees/cg/cgpm/13-1967/resolution-10
  reference: https://www.bipm.org/documents/20126/17314988/CGPM13.pdf/ff522dd4-7c97-9b8d-127b-4fe77f3fe2bc?version=1.2&t=1587104721230&download=true#page=106
  reference_name: Proceedings of the 13th CGPM (1967), 1969, p106
  reference_page: 106
  approvals: []
  considerations:
  - type: considering
    date_effective: '1967-10-16'
    message: que pendant les séances tenues en octobre 1967 elle n'a pas décidé le
      montant exact des dotations du Bureau international des poids et mesures pour
      les quatre années 1969-1972, qu'elle a reconnu la nécessité d'une augmentation
      annuelle d'environ 9 pour cent pendant ces quatre années pour que le Bureau
      international se maintienne à son niveau actuel, mais qu'elle veut que le niveau
      du Bureau international s'élève avec le progrès de la métrologie en utilisant
      des ressources supplémentaires qui restent à définir,
  actions:
  - type: decides
    date_effective: '1967-10-16'
    message: que la partie fixe de la dotation annuelle à partir du 1er janvier 1969
      sera augmentée par rapport à ce qu'elle était au 1er octobre 1967, de façon
      que l'ensemble de la partie fixe et de la partie complémentaire calculée à cette
      dernière date ne soit pas inférieur à  
  - type: requests
    date_effective: '1967-10-16'
    message: au Comité international des poids et mesures de fournir aux États de
      la Convention du Mètre, dans un délai inférieur à six mois, une étude documentée
      qui permette aux États de décider la nature et le montant des ressources supplémentaires
      à consacrer au Bureau international et d'apprécier les conséquences de leur
      décision sur l'avenir du Bureau international.  
  - type: decides
    date_effective: '1967-10-16'
    message: 10.59161/CGPM1967RES10E
- dates:
  - '1967-10-16'
  subject: CGPM
  type: resolution
  title: Dates des séances
  identifier: '11'
  url: https://www.bipm.org/en/committees/cg/cgpm/13-1967/resolution-11
  reference: https://www.bipm.org/documents/20126/17314988/CGPM13.pdf/ff522dd4-7c97-9b8d-127b-4fe77f3fe2bc?version=1.2&t=1587104721230&download=true#page=106
  reference_name: Proceedings of the 13th CGPM (1967), 1969, p106
  reference_page: 106
  approvals: []
  considerations:
  - type: considering
    date_effective: '1967-10-16'
    message: que les séances aux dates prévues n'ont pas suffi pour épuiser l'ordre
      du jour, que les questions en suspens nécessitent un délai d'étude,
  actions:
  - type: decides
    date_effective: '1967-10-16'
    message: de reprendre sa session le mercredi 5 juin 1968.
  - type: decides
    date_effective: '1967-10-16'
    message: 10.59161/CGPM1967RES11E
- dates:
  - '1967-10-16'
  subject: CGPM
  type: resolution
  title: Dotation du Bureau international pour la période 1969-1972
  identifier: '12'
  url: https://www.bipm.org/en/committees/cg/cgpm/13-1967/resolution-12
  reference: https://www.bipm.org/documents/20126/17314988/CGPM13.pdf/ff522dd4-7c97-9b8d-127b-4fe77f3fe2bc?version=1.2&t=1587104721230&download=true#page=106
  reference_name: Proceedings of the 13th CGPM (1967), 1969, p106
  reference_page: 106
  approvals: []
  considerations:
  - type: considering
    date_effective: '1967-10-16'
    message: que les dotations minimales décidées par sa Résolution 10, à savoir  
      doivent être complétées par des ressources supplémentaires destinées à assurer
      le développement du Bureau international des poids et mesures,
  actions:
  - type: decides
    date_effective: '1967-10-16'
    message: 'd''allouer au Bureau international, dans les quatre années 1969-1972,
      les sommes supplémentaires suivantes :  '
  - type: authorizes
    date_effective: '1967-10-16'
    message: que ces sommes supplémentaires puissent être payées en monnaie nationale
      ;
  - type: invites / further invites
    date_effective: '1967-10-16'
    message: les États qui choisiraient d'effectuer ces paiements en monnaie nationale
      à se mettre d'accord avec le Comité international des poids et mesures pour
      qu'ils soient employés à la satisfaction des besoins du Bureau international
      des poids et mesures en tenant compte des lois du pays.
  - type: decides
    date_effective: '1967-10-16'
    message: 10.59161/CGPM1967RES12E
