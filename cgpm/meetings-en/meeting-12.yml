  type: resolution
  title: Coefficient gyromagnétique du proton (poursuite des études)
  identifier: '9'
  url: https://www.bipm.org/en/committees/cg/cgpm/12-1964/resolution-9
  reference: https://www.bipm.org/documents/20126/17314988/CGPM12.pdf/ff886c51-c6a2-589d-a416-58f97d26016c?version=1.1&t=1587052687243&download=true#page=94
  reference_name: Proceedings of the 12th CGPM (1964), 1965, p94
  reference_page: 94
  approvals: []
  considerations:
  - type: considering
    date_effective: '1964-10-13'
    message: le rôle important pour la métrologie dans le domaine de l'électricité
      du coefficient gyromagnétique du proton, à partir duquel il sera possible à
      l'avenir d'établir de nouveaux étalons électriques fondés sur les constantes
      atomiques,
  actions:
  - type: approves
    date_effective: '1964-10-13'
    message: les activités du Comité international des poids et mesures et de son
      Comité consultatif d'électricité entreprises pour le développement des travaux
      scientifiques nationaux sur cette question,
  - type: invites / further invites
    date_effective: '1964-10-13'
    message: les laboratoires nationaux et internationaux experts dans ce domaine
      à poursuivre leurs études sur le coefficient gyromagnétique du proton, afin
      d'établir la valeur précise de cette constante en vue de son application à l'amélioration
      de la reproductibilité de l'ampère, unité de base du Système international d'unités.
  - type: decides
    date_effective: '1964-10-13'
    message: 10.59161/CGPM1964RES9E
- dates:
  - '1964-10-13'
  subject: CGPM
  type: resolution
  title: Échelle internationale pratique de température (recherches à effectuer)
  identifier: '10'
  url: https://www.bipm.org/en/committees/cg/cgpm/12-1964/resolution-10
  reference: https://www.bipm.org/documents/20126/17314988/CGPM12.pdf/ff886c51-c6a2-589d-a416-58f97d26016c?version=1.1&t=1587052687243&download=true#page=94
  reference_name: Proceedings of the 12th CGPM (1964), 1965, p94
  reference_page: 94
  approvals: []
  considerations:
  - type: considering
    date_effective: '1964-10-13'
    message: l'urgence de réviser l'Échelle internationale pratique de température
      de 1948 et de l'étendre dans le domaine des basses températures, jusqu'aux points
      d'ébullition de l'hydrogène et de l'hélium,
  - type: recognizing
    date_effective: '1964-10-13'
    message: que des recherches importantes doivent encore être faites afin de permettre
      au Comité international des poids et mesures de préparer pendant les années
      suivantes une proposition pour une nouvelle définition de l'Échelle internationale
      pratique de température qui pourrait être adoptée par la Treizième Conférence
      générale des poids et mesures,
  actions:
  - type: decides
    date_effective: '1964-10-13'
    message: les résultats expérimentaux obtenus par des laboratoires compétents pour
      connaître les différences existant entre la température thermodynamique et celle
      définie par l'Échelle internationale pratique de température, les progrès déjà
      faits pour l'extension de l'Échelle internationale pratique de température au-dessous
      de 90°K jusqu'à 12°K et l'introduction des échelles de température au-dessous
      de 5°K,
  - type: invites / further invites
    date_effective: '1964-10-13'
    message: 'les grands laboratoires nationaux et internationaux experts dans ce
      domaine à poursuivre aussi activement que possible les recherches importantes
      pour la révision de l''Échelle internationale pratique de température, en particulier
      :'
  - type: decides
    date_effective: '1964-10-13'
    message: 10.59161/CGPM1964RES10E
