  type: resolution
  title: Definition of the metre
  identifier: '1'
  url: https://www.bipm.org/en/committees/cg/cgpm/17-1983/resolution-1
  reference: https://www.bipm.org/documents/20126/17314988/CGPM17.pdf/7a00a9b7-7106-65f2-4cf9-95a733ceb473?version=1.1&t=1587051482283&download=true#page=97
  reference_name: Proceedings of the 17th CGPM (1983), 1984, p97
  reference_page: 97
  approvals: []
  considerations:
  - type: considering
    date_effective: '1983-10-21'
    message: that the present definition does not allow a sufficiently precise realization
      of the metre for all requirements, that progress made in the stabilization of
      lasers allows radiations to be obtained that are more reproducible and easier
      to use than the standard radiation emitted by a krypton 86 lamp, that progress
      made in the measurement of the frequency and wavelength of these radiations
      has resulted in concordant determinations of the speed of light whose accuracy
      is limited principally by the realization of the present definition of the metre,
      that wavelengths determined from frequency measurements and a given value for
      the speed of light have a reproducibility superior to that which can be obtained
      by comparison with the wavelength of the standard radiation of krypton 86, that
      there is an advantage, notably for astronomy and geodesy, in maintaining unchanged
      the value of the speed of light recommended in 1975 by the 15th CGPM in its
      Resolution 2 (c = 299 792 458 m/s), that a new definition of the metre has been
      envisaged in various forms all of which have the effect of giving the speed
      of light an exact value, equal to the recommended value, and that this introduces
      no appreciable discontinuity into the unit of length, taking into account the
      relative uncertainty of ± 4 ´ 10–9 of the best realizations of the present definition
      of the metre, that these various forms, making reference either to the path
      travelled by light in a specified time interval or to the wavelength of a radiation
      of measured or specified frequency, have been the object of consultations and
      deep discussions, have been recognized as being equivalent and that a consensus
      has emerged in favour of the first form, that the Comité Consultatif pour la
      Définition du Mètre (CCDM) is now in a position to give instructions for the
      practical realization of such a definition, instructions which could include
      the use of the orange radiation of krypton 86 used as standard up to now, and
      which may in due course be extended or revised,
  actions:
  - type: decides
    date_effective: '1983-10-21'
    message: 10.59161/CGPM1983RES1E The relative uncertainty given here corresponds
      to three standard deviations in the data considered. This definition of the
      metre was abrogated in 2018 by the 26th CGPM (Resolution 1), which became effective
      in 2019.
- dates:
  - '1983-10-21'
  subject: CGPM
  type: resolution
  title: On the realization of the definition of the metre
  identifier: '2'
  url: https://www.bipm.org/en/committees/cg/cgpm/17-1983/resolution-2
  reference: https://www.bipm.org/documents/20126/17314988/CGPM17.pdf/7a00a9b7-7106-65f2-4cf9-95a733ceb473?version=1.1&t=1587051482283&download=true#page=98
  reference_name: Proceedings of the 17th CGPM (1983), 1984, p98
  reference_page: 98
  approvals: []
  considerations: []
  actions:
  - type: invites / further invites
    date_effective: '1983-10-21'
    message: the Comité International des Poids et Mesures to draw up instructions
      for the practical realization of the new definition of the metre, to choose
      radiations which can be recommended as standards of wavelength for the interferometric
      measurement of length and to draw up instructions for their use, to pursue studies
      undertaken to improve these standards.
  - type: decides
    date_effective: '1983-10-21'
    message: 10.59161/CGPM1983RES2E See Recommendation 1 (CI-2002) of the CIPM on
      the revision of the practical realization of the definition of the metre.
