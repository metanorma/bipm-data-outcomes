  type: resolution
  title: Density of air
  identifier: '3'
  url: https://www.bipm.org/en/committees/cg/cgpm/17-1983/resolution-3
  reference: https://www.bipm.org/documents/20126/17314988/CGPM17.pdf/7a00a9b7-7106-65f2-4cf9-95a733ceb473?version=1.1&t=1587051482283&download=true#page=99
  reference_name: Proceedings of the 17th CGPM (1983), 1984, p99
  reference_page: 99
  approvals:
  - message: recalling Resolution 1 of the 16th General Conference on Weights and
      Measures (1979) dealing with the measurement of mass
    date_effective: '1983-10-21'
  considerations:
  - type: recalling / further recalling
    date_effective: '1983-10-21'
    message: Resolution 1 of the 16th General Conference on Weights and Measures (1979)
      dealing with the measurement of mass
  - type: considering
    date_effective: '1983-10-21'
    message: and that the air-buoyancy correction is based upon the density of the
      ambient air, that one can improve the uniformity and the accuracy of mass measurements
      by encouraging laboratories, when they have to calculate the density of air
      starting from the ambient conditions, to use for this calculation a unique equation
      known to all and recognized as sufficiently accurate,
  actions:
  - type: invites / further invites
    date_effective: '1983-10-21'
    message: the Comité International des Poids et Mesures to draw up and recommend
      such an equation, to pursue and coordinate the studies undertaken or to undertake
      to improve the experimental determination of the density of air and of the correction
      due to air-buoyancy, to bring up to date the recommended equation when better
      experimental determinations permit.
  - type: decides
    date_effective: '1983-10-21'
    message: 10.59161/CGPM1983RES3E
- dates:
  - '1983-10-21'
  subject: CGPM
  type: resolution
  title: Appropriation for the BIPM
  identifier: '4'
  url: https://www.bipm.org/en/committees/cg/cgpm/17-1983/resolution-4
  reference: https://www.bipm.org/documents/20126/17314988/CGPM17.pdf/7a00a9b7-7106-65f2-4cf9-95a733ceb473?version=1.1&t=1587051482283&download=true#page=99
  reference_name: Proceedings of the 17th CGPM (1983), 1984, p99
  reference_page: 99
  approvals: []
  considerations:
  - type: considering
    date_effective: '1983-10-21'
    message: the importance of the work carried out by the Bureau International des
      Poids et Mesures (BIPM) and of the services that it renders to all countries,
      the necessity of providing the BIPM with a minimum of resources which will not
      endanger the pursuit of these activities and the difficulty of foreseeing, in
      the present economic circumstances, the minimum financial resources needed to
      permit the BIPM to fulfil its mission as the world centre for scientific metrology,
  actions:
  - type: decides
    date_effective: '1983-10-21'
    message: "    that the fixed portion of the BIPM's annual appropriation shall
      be increased in such a way that the sum of the fixed and complementary (defined
      by Article 6 (1921) of the Rules Appended to the Convention du Mètre of 1875)
      portions shall be, for the Member States of the Convention at the time of the
      17th Conférence Générale des Poids et Mesures, for"
  - type: decides
    date_effective: '1983-10-21'
    message: 10.59161/CGPM1983RES4E
