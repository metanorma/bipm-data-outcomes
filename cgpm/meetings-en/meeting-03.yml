- dates:
  - '1901-10-22'
  subject: CGPM
  type: resolution
  title: Declaration on the unit of mass and on the definition of weight; conventional
    value of <i>g</i><sub>n</sub>
  identifier: '2'
  url: https://www.bipm.org/en/committees/cg/cgpm/3-1901/resolution-2
  reference: https://www.bipm.org/documents/20126/17314988/CGPM3.pdf/2459a1a9-f63a-c916-9783-4a390631e28b?version=1.1&t=1587054331426&download=true#page=70
  reference_name: Proceedings of the 3rd CGPM (1901), 1901, p70
  reference_page: 70
  approvals: []
  considerations:
  - type: considering
    date_effective: '1901-10-22'
    message: the necessity to put an end to the ambiguity which in current practice
      still exists on the meaning of the word weight, used sometimes for mass, sometimes
      for mechanical force;
  actions:
  - type: decides
    date_effective: '1901-10-22'
    message: the decision of the Comité International des Poids et Mesures of 15 October
      1887, according to which the kilogram has been defined as unit of mass;
  - type: decides
    date_effective: '1901-10-22'
    message: the decision contained in the sanction of the prototypes of the Metric
      System, unanimously accepted by the Conférence Générale des Poids et Mesures
      on 26 September 1889;
  - type: decides
    date_effective: '1901-10-22'
    message: 10.59161/CGPM1901DECL2E This value of gn was the conventional reference
      for calculating the now obsolete unit kilogram force.
