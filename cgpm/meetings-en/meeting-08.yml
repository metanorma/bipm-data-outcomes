  subject: CGPM
  type: resolution
  title: Mesures à prendre pour favoriser l'extension du Système métrique
  identifier: '13'
  url: https://www.bipm.org/en/committees/cg/cgpm/8-1933/resolution-13
  reference: https://www.bipm.org/documents/20126/17314988/CGPM8.pdf/1e14fc66-05e1-1dac-305e-c6447ba37234?version=1.1&t=1587053729342&download=true#page=60
  reference_name: Proceedings of the 8th CGPM (1933), 1934, p60
  reference_page: 60
  approvals: []
  considerations: []
  actions:
  - type: decides
    date_effective: '1933-10-10'
    message: qu'il serait désirable que les questions concernant les modalités d'introduction
      du Système métrique et les facteurs qui entravent son extension soient soumises
      à une large discussion et à l'étude tant des métrologistes que des économistes
      et des producteurs,
  - type: decides
    date_effective: '1933-10-10'
    message: que la Neuvième Conférence générale des poids et mesures, ou la Première
      Conférence de métrologie appliquée si celle-ci a lieu auparavant, indiquera
      les conditions nécessaires à la propagation ultérieure du Système métrique.
  - type: decides
    date_effective: '1933-10-10'
    message: 10.59161/CGPM1933RES13E
