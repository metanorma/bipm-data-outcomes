  type: resolution
  title: L'équation du Mètre prototype n° 7, alliage de 1874
  identifier: '3'
  url: https://www.bipm.org/en/committees/cg/cgpm/8-1933/resolution-3
  reference: https://www.bipm.org/documents/20126/17314988/CGPM8.pdf/1e14fc66-05e1-1dac-305e-c6447ba37234?version=1.1&t=1587053729342&download=true#page=37
  reference_name: Proceedings of the 8th CGPM (1933), 1934, p37
  reference_page: 37
  approvals: []
  considerations:
  - type: considering
    date_effective: '1933-10-10'
    message: que le Mètre n° 7 n'avait pas participé aux premières comparaisons, faites
      en 1889, sur certains des autres prototypes de l'alliage de 1874, que ce Mètre,
      devenu seulement en 1929 la propriété du Gouvernement Tchécoslovaque, n'a été
      vérifié au Bureau international qu'en 1929,
  actions:
  - type: decides
    date_effective: '1933-10-10'
    message: le Rapport du Directeur du Bureau international des poids et mesures
      relatif à ladite vérification, la déclaration du Président du Comité international
      des poids et mesures approuvant ce Rapport, au nom du Comité,
  - type: declares
    date_effective: '1933-10-10'
    message: homologuer le certificat délivré à la date du 30 octobre 1929 relatif
      au Mètre n° 7, alliage de 1874.
  - type: decides
    date_effective: '1933-10-10'
    message: 10.59161/CGPM1933RES3E
