  title: Dilatabilité des mètres prototypes provenant des alliages Johnson-Matthey
    et de 1874
  identifier: '1'
  url: https://www.bipm.org/en/committees/cg/cgpm/8-1933/resolution-1
  reference: https://www.bipm.org/documents/20126/17314988/CGPM8.pdf/1e14fc66-05e1-1dac-305e-c6447ba37234?version=1.1&t=1587053729342&download=true#page=36
  reference_name: Proceedings of the 8th CGPM (1933), 1934, p36
  reference_page: 36
  approvals: []
  considerations:
  - type: considering
    date_effective: '1933-10-10'
    message: le sanctionnement des nouveaux prototypes métriques par la Première Conférence
      générale des poids et mesures, la décision prise par la Quatrième Conférence
      générale des poids et mesures de faire procéder à la vérification périodique
      des mètres prototypes nationaux, les nouvelles déterminations de la dilatabilité
      exécutées à l'occasion de cette première vérification périodique, qui ont conduit
      à adopter un coefficient identique pour toutes les règles des alliages Johnson-Matthey
      d'une part, et de 1874 d'autre part, le Rapport du Directeur du Bureau international
      des poids et mesures relatif à ladite vérification, la déclaration du Président
      du Comité international des poids et mesures approuvant ce Rapport,
  actions:
  - type: authorizes
    date_effective: '1933-10-10'
    message: le Comité international à faire, à tous les certificats des mètres prototypes
      des coulées Johnson-Matthey et de 1874, une addition donnant les nouvelles formules
      trouvées pour la dilatation de ces alliages, telles qu'elles résultent des déterminations
      faites au Bureau international, et les nouvelles valeurs des règles à 0° qui
      en sont la conséquence.
  - type: decides
    date_effective: '1933-10-10'
    message: 10.59161/CGPM1933RES1E
- dates:
  - '1933-10-10'
  subject: CGPM
  type: resolution
  title: Équations des mètres prototypes nos 1, 8, 14, 15, 17, 18, 21, 22, 23 et 26
  identifier: '2'
  url: https://www.bipm.org/en/committees/cg/cgpm/8-1933/resolution-2
  reference: https://www.bipm.org/documents/20126/17314988/CGPM8.pdf/1e14fc66-05e1-1dac-305e-c6447ba37234?version=1.1&t=1587053729342&download=true#page=37
  reference_name: Proceedings of the 8th CGPM (1933), 1934, p37
  reference_page: 37
  approvals: []
  considerations:
  - type: considering
    date_effective: '1933-10-10'
    message: le sanctionnement des nouveaux prototypes métriques par la Première Conférence
      générale des poids et mesures, la décision prise par la Quatrième Conférence
      générale des poids et mesures de faire procéder à la vérification périodique
      des mètres prototypes nationaux, le Rapport du Directeur du Bureau international
      des poids et mesures relatif à ladite vérification, la déclaration du Président
      du Comité international des poids et mesures approuvant, au nom du Comité, les
      termes de ce Rapport,
  actions:
  - type: declares
    date_effective: '1933-10-10'
    message: n'être plus parfaitement conformes à la réalité les équations sanctionnées
      par la Première Conférence générale ; elle annule en conséquence les certificats
      y relatifs en ce qui concerne les équations et en prolonge la validité pour
      le reste,
  - type: authorizes
    date_effective: '1933-10-10'
    message: le Comité international à faire auxdits certificats une addition portant
      la valeur de la longueur à 0° des Mètres nos 1, 8, 14, 15, 17, 18, 21, 22, 23
      et 26, ainsi que la nouvelle formule de dilatation, telles que l'une et l'autre
      résultent des nouvelles déterminations faites au Bureau international.
  - type: decides
    date_effective: '1933-10-10'
    message: 10.59161/CGPM1933RES2E
