  type: resolution
  title: Institution d'un Comité consultatif de photométrie
  identifier: '9'
  url: https://www.bipm.org/en/committees/cg/cgpm/8-1933/resolution-9
  reference: https://www.bipm.org/documents/20126/17314988/CGPM8.pdf/1e14fc66-05e1-1dac-305e-c6447ba37234?version=1.1&t=1587053729342&download=true#page=52
  reference_name: Proceedings of the 8th CGPM (1933), 1934, p52
  reference_page: 52
  approvals: []
  considerations:
  - type: considering
    date_effective: '1933-10-10'
    message: le vœu exprimé dans la première séance plénière du Comité consultatif
      en 1933, transmis par le Comité international des poids et mesures, tendant
      à la formation d'un Comité consultatif de photométrie distinct du Comité consultatif
      d'électricité,
  actions:
  - type: approves
    date_effective: '1933-10-10'
    message: 'l''organisation d''un Comité consultatif de photométrie, distinct du
      Comité consultatif d''électricité, et ayant pour objet de conseiller le Comité
      international des poids et mesures sur les questions relatives aux systèmes
      de mesure et aux étalons photométriques. Ce Comité consultatif sera limité à
      dix membres et composé : Le Président du Comité consultatif de photométrie sera
      pris parmi les membres du Comité international et désigné par celui-ci. Dans
      le but de s''assurer la collaboration des éminentes personnalités de la Commission
      internationale de l''éclairage, les spécialistes à désigner nominativement pour
      faire partie de ce nouveau Comité consultatif seront choisis en tenant compte
      de la composition du Comité spécial (Select Committee) de ladite Commission.
      Les réunions de ce Comité auront lieu autant que possible à la même époque que
      celles du Comité consultatif d''électricité.'
  - type: decides
    date_effective: '1933-10-10'
    message: 10.59161/CGPM1933RES9E
- dates:
  - '1933-10-10'
  subject: CGPM
  type: resolution
  title: Substitution des unités électriques absolues aux unités dites &#171;&#032;internationales&#032;&#187;
  identifier: '10'
  url: https://www.bipm.org/en/committees/cg/cgpm/8-1933/resolution-10
  reference: https://www.bipm.org/documents/20126/17314988/CGPM8.pdf/1e14fc66-05e1-1dac-305e-c6447ba37234?version=1.1&t=1587053729342&download=true#page=53
  reference_name: Proceedings of the 8th CGPM (1933), 1934, p53
  reference_page: 53
  approvals: []
  considerations:
  - type: considering
    date_effective: '1933-10-10'
    message: d'autre part qu'un certain nombre de laboratoires nationaux n'ont pas
      encore terminé les mesures nécessaires pour relier les unités internationales
      aux unités absolues,
  actions:
  - type: sanctions
    date_effective: '1933-10-10'
    message: le principe de la substitution du Système absolu des unités électriques
      au Système international ;
  - type: decides
    date_effective: '1933-10-10'
    message: de reculer jusqu'à l'année 1935 la fixation provisoire du rapport entre
      chaque unité internationale et l'unité absolue correspondante,
  - type: decides
    date_effective: '1933-10-10'
    message: ", dans ce but, au Comité international les pouvoirs nécessaires pour
      fixer, alors et sans attendre une autre Conférence, ces rapports, ainsi que
      la date d'adoption des nouvelles unités."
  - type: decides
    date_effective: '1933-10-10'
    message: 10.59161/CGPM1933RES10E
