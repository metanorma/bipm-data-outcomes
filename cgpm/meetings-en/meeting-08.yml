  - '1933-10-10'
  subject: CGPM
  type: resolution
  title: Pouvoirs au Comité en vue de l'établissement d'un étalon de lumière
  identifier: '11'
  url: https://www.bipm.org/en/committees/cg/cgpm/8-1933/resolution-11
  reference: https://www.bipm.org/documents/20126/17314988/CGPM8.pdf/1e14fc66-05e1-1dac-305e-c6447ba37234?version=1.1&t=1587053729342&download=true#page=55
  reference_name: Proceedings of the 8th CGPM (1933), 1934, p55
  reference_page: 55
  approvals: []
  considerations: []
  actions:
  - type: decides
    date_effective: '1933-10-10'
    message: ", tout en maintenant l'opinion émise en 1930 que l'unité primaire d'intensité
      lumineuse doit être basée sur le rayonnement du corps noir, qu'il serait prématuré
      de donner à l'heure actuelle des spécifications pour cet étalon,"
  - type: decides
    date_effective: '1933-10-10'
    message: dans ce but au Comité international les pouvoirs pour, au moment convenable
      et après avis du Comité consultatif, fixer les spécifications ayant trait à
      l'étalon de lumière et prendre les mesures d'exécution nécessaires.
  - type: decides
    date_effective: '1933-10-10'
    message: 10.59161/CGPM1933RES11E
