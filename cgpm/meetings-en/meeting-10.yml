  title: Définition du mètre
  identifier: '1'
  url: https://www.bipm.org/en/committees/cg/cgpm/10-1954/resolution-1
  reference: https://www.bipm.org/documents/20126/17314988/CGPM10.pdf/cee1e26a-3a4c-221b-ce37-57428adf5ac7?version=1.1&t=1587053365611&download=true#page=78
  reference_name: Proceedings of the 10th CGPM (1954), 1956, p78
  reference_page: 78
  approvals: []
  considerations:
  - type: recognizing
    date_effective: '1954-10-14'
    message: que, malgré les importants progrès réalisés, les recherches sur les radiations
      monochromatiques doivent être complétées,
  actions:
  - type: decides
    date_effective: '1954-10-14'
    message: de l'état d'avancement des travaux que la Neuvième Conférence générale
      avait recommandés dans sa Résolution 1 dans le but d'établir éventuellement
      une nouvelle définition du mètre fondée sur la longueur d'onde d'une radiation
      lumineuse,
  - type: decides
    date_effective: '1954-10-14'
    message: l'importance des résultats acquis grâce aux recherches des grands Laboratoires,
      des savants spectroscopistes et du Bureau international,
  - type: decides
    date_effective: '1954-10-14'
    message: en conséquence aux grands Laboratoires et au Bureau international son
      invitation à poursuivre aussi activement que possible leurs études sur les radiations
      monochromatiques, en vue de permettre à la Onzième Conférence générale de prendre
      une résolution définitive,
  - type: decides
    date_effective: '1954-10-14'
    message: de ne pas encore changer la définition du mètre.
  - type: decides
    date_effective: '1954-10-14'
    message: 10.59161/CGPM1954RES1E
- dates:
  - '1954-10-14'
  subject: CGPM
  type: resolution
  title: Retraçage des mètres
  identifier: '2'
  url: https://www.bipm.org/en/committees/cg/cgpm/10-1954/resolution-2
  reference: https://www.bipm.org/documents/20126/17314988/CGPM10.pdf/cee1e26a-3a4c-221b-ce37-57428adf5ac7?version=1.1&t=1587053365611&download=true#page=79
  reference_name: Proceedings of the 10th CGPM (1954), 1956, p79
  reference_page: 79
  approvals: []
  considerations:
  - type: considering
    date_effective: '1954-10-14'
    message: les récents progrès réalisés dans la connaissance de la structure des
      traits gravés sur les Prototypes délivrés par la Première Conférence générale
      des poids et mesures, et dans l'exécution de traits d'une haute qualité,
  actions:
  - type: decides
    date_effective: '1954-10-14'
    message: des Pays adhérents à la Convention du Mètre sur la possibilité qu'ils
      ont actuellement d'améliorer leurs étalons nationaux en les faisant munir d'un
      nouveau tracé.
  - type: decides
    date_effective: '1954-10-14'
    message: 10.59161/CGPM1954RES2E
