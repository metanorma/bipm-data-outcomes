  title: Définition de l'unité de temps
  identifier: '5'
  url: https://www.bipm.org/en/committees/cg/cgpm/10-1954/resolution-5
  reference: https://www.bipm.org/documents/20126/17314988/CGPM10.pdf/cee1e26a-3a4c-221b-ce37-57428adf5ac7?version=1.1&t=1587053365611&download=true#page=80
  reference_name: Proceedings of the 10th CGPM (1954), 1956, p80
  reference_page: 80
  approvals: []
  considerations:
  - type: recognizing
    date_effective: '1954-10-14'
    message: la nécessité et l'urgence de donner plus de précision à la définition
      de l'unité fondamentale de temps,
  - type: considering
    date_effective: '1954-10-14'
    message: que l'aboutissement de l'étude de cette question est imminent,
  actions:
  - type: decides
    date_effective: '1954-10-14'
    message: au Comité international des poids et mesures le pouvoir de décider sur
      ce point.
  - type: decides
    date_effective: '1954-10-14'
    message: 10.59161/CGPM1954RES5E
