  reference: https://www.bipm.org/documents/20126/17314988/CGPM11.pdf/c626e1d6-4320-56d3-db37-c6f2a343483b?version=1.2&t=1587105011609&download=true#page=85
  reference_name: Proceedings of the 11th CGPM (1960), 1961, p85
  reference_page: 85
  approvals: []
  considerations:
  - type: considering
    date_effective: '1960-10-20'
    message: that the international Prototype does not define the metre with an accuracy
      adequate for the present needs of metrology, that it is moreover desirable to
      adopt a natural and indestructible standard,
  actions:
  - type: decides
    date_effective: '1960-10-20'
    message: 10.59161/CGPM1960RES6E This definition was abrogated in 1983 by the 17th
      CGPM (Resolution 1).
- dates:
