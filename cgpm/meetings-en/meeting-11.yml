  type: resolution
  title: Definition of the unit of time (second)
  identifier: '9'
  url: https://www.bipm.org/en/committees/cg/cgpm/11-1960/resolution-9
  reference: https://www.bipm.org/documents/20126/17314988/CGPM11.pdf/c626e1d6-4320-56d3-db37-c6f2a343483b?version=1.2&t=1587105011609&download=true#page=86
  reference_name: Proceedings of the 11th CGPM (1960), 1961, p86
  reference_page: 86
  approvals: []
  considerations:
  - type: considering
    date_effective: '1960-10-20'
    message: the powers given to the Comité International des Poids et Mesures (CIPM)
      by the 10th CGPM to define the fundamental unit of time, the decision taken
      by the CIPM in 1956,
  actions:
  - type: decides
    date_effective: '1960-10-20'
    message: 'the following definition: "The second is the fraction 1/31 556 925.9747
      of the tropical year for 1900 January 0 at 12 hours ephemeris time."'
  - type: decides
    date_effective: '1960-10-20'
    message: 10.59161/CGPM1960RES9E This definition was abrogated in 1967 by the 13th
      CGPM (Resolution 1).
- dates:
  - '1960-10-20'
  subject: CGPM
  type: resolution
  title: Définition de l'unité de temps
  identifier: '10'
  url: https://www.bipm.org/en/committees/cg/cgpm/11-1960/resolution-10
  reference: https://www.bipm.org/documents/20126/17314988/CGPM11.pdf/c626e1d6-4320-56d3-db37-c6f2a343483b?version=1.2&t=1587105011609&download=true#page=86
  reference_name: Proceedings of the 11th CGPM (1960), 1961, p86
  reference_page: 86
  approvals: []
  considerations:
  - type: considering
    date_effective: '1960-10-20'
    message: qu'un tel étalon atomique d'intervalle de temps est indispensable pour
      les exigences de la haute métrologie,
  actions:
  - type: decides
    date_effective: '1960-10-20'
    message: les résultats expérimentaux obtenus par des laboratoires compétents pendant
      les dernières années, qui prouvent qu'un étalon d'intervalle de temps basé sur
      une transition entre deux niveaux d'énergie d'un atome ou d'une molécule peut
      être réalisé et reproduit avec une précision très élevée,
  - type: invites / further invites
    date_effective: '1960-10-20'
    message: les laboratoires nationaux et internationaux experts dans ce domaine
      à poursuivre aussi activement que possible leurs études, le Comité international
      des poids et mesures à coopérer sans retard avec les organismes internationaux
      intéressés et à coordonner les travaux en vue de permettre à la Douzième Conférence
      générale de prendre une résolution sur ce point.
  - type: decides
    date_effective: '1960-10-20'
    message: 10.59161/CGPM1960RES10E
- dates:
  - '1960-10-20'
  subject: CGPM
  type: resolution
  title: Système gravimétrique
  identifier: '11'
  url: https://www.bipm.org/en/committees/cg/cgpm/11-1960/resolution-11
  reference: https://www.bipm.org/documents/20126/17314988/CGPM11.pdf/c626e1d6-4320-56d3-db37-c6f2a343483b?version=1.2&t=1587105011609&download=true#page=86
  reference_name: Proceedings of the 11th CGPM (1960), 1961, p86
  reference_page: 86
  approvals: []
  considerations: []
  actions:
  - type: decides
    date_effective: '1960-10-20'
    message: de conserver provisoirement le système gravimétrique dit de Potsdam ;
  - type: invites / further invites
    date_effective: '1960-10-20'
    message: le Bureau international et les Laboratoires nationaux à poursuivre leurs
      mesures ;
  - type: decides
    date_effective: '1960-10-20'
    message: au Comité international des poids et mesures de décider du changement
      du système de Potsdam lorsqu'il aura estimé que la valeur de cette accélération
      est connue avec une exactitude suffisante.
  - type: decides
    date_effective: '1960-10-20'
    message: 10.59161/CGPM1960RES11E
- dates:
  - '1960-10-20'
  subject: CGPM
  type: resolution
  title: Système International d'Unités
  identifier: '12'
  url: https://www.bipm.org/en/committees/cg/cgpm/11-1960/resolution-12
  reference: https://www.bipm.org/documents/20126/17314988/CGPM11.pdf/c626e1d6-4320-56d3-db37-c6f2a343483b?version=1.2&t=1587105011609&download=true#page=87
  reference_name: Proceedings of the 11th CGPM (1960), 1961, p87
  reference_page: 87
  approvals: []
  considerations:
  - type: considering
    date_effective: '1960-10-20'
    message: 'Resolution 6 of the 10th CGPM, by which it adopted six base units on
      which to establish a practical system of measurement for international use:
        length metre m mass kilogram kg time second s electric current ampere A thermodynamic
      temperature degree Kelvin °K luminous intensity candela cd Resolution 3 adopted
      by the Comité International des Poids et Mesures (CIPM) in 1956, the recommendation
      adopted by the CIPM in 1958 concerning an abbreviation for the name of the system,
      and prefixes to form multiples and submultiples of the units,'
  actions:
  - type: decides
    date_effective: '1960-10-20'
    message: " "
  - type: decides
    date_effective: '1960-10-20'
    message: '10.59161/CGPM1960RES12E The CGPM later abrogated certain of its decisions
      and extended the list of prefixes: The name and symbol for the unit of thermodynamic
      temperature were modified by the 13th CGPM in 1967 (Resolution 3). A seventh
      base unit, the mole, was adopted by the 14th CGPM in 1971 (Resolution 3). Further
      prefixes were adopted by the 12th CGPM in 1964 (Resolution 8), the 15th CGPM
      in 1975 (Resolution 10), the 19th CGPM in 1991 (Resolution 4) and the 27th CGPM
      in 2022 (Resolution 3). The 20th CGPM in 1995 abrogated the class of supplementary
      units in the SI (Resolution 8). These are now considered as derived units. The
      13th CGPM in 1967 (Resolution 6) specified other units which should be added
      to this list of derived units. In principle, the list is without limit. Modern
      practice is to use the phrase "amount of heat" rather than "quantity of heat",
      because the word quantity has a different meaning in metrology. Modern practice
      is to use the phrase "amount of electricity" rather than "quantity of electrcity"
      (see above).'
- dates:
  - '1960-10-20'
  subject: CGPM
  type: resolution
  title: Cubic decimetre and litre
  identifier: '13'
  url: https://www.bipm.org/en/committees/cg/cgpm/11-1960/resolution-13
  reference: https://www.bipm.org/documents/20126/17314988/CGPM11.pdf/c626e1d6-4320-56d3-db37-c6f2a343483b?version=1.2&t=1587105011609&download=true#page=88
  reference_name: Proceedings of the 11th CGPM (1960), 1961, p88
  reference_page: 88
  approvals: []
  considerations:
  - type: considering
    date_effective: '1960-10-20'
    message: that the cubic decimetre and the litre are unequal and differ by about
      28 parts in 106, that determinations of physical quantities which involve measurements
      of volume are being made more and more accurately, thus increasing the risk
      of confusion between the cubic decimetre and the litre,
  actions:
  - type: requests
    date_effective: '1960-10-20'
    message: the Comité International des Poids et Mesures to study the problem and
      submit its conclusions to the 12th CGPM.
  - type: decides
    date_effective: '1960-10-20'
    message: 10.59161/CGPM1960RES13E
- dates:
  - '1960-10-20'
  subject: CGPM
  type: resolution
  title: Adhésion des Pays à la Convention du Mètre
  identifier: '14'
  url: https://www.bipm.org/en/committees/cg/cgpm/11-1960/resolution-14
  reference: https://www.bipm.org/documents/20126/17314988/CGPM11.pdf/c626e1d6-4320-56d3-db37-c6f2a343483b?version=1.2&t=1587105011609&download=true#page=88
  reference_name: Proceedings of the 11th CGPM (1960), 1961, p88
  reference_page: 88
  approvals: []
  considerations:
  - type: considering
    date_effective: '1960-10-20'
    message: que tous les pays bénéficient des heureux résultats des travaux du Comité
      international et du Bureau international des poids et mesures, particulièrement
      illustrés par le rapport de son Président sur l'activité de ce Comité pendant
      la période 1954-1960, que le développement de la science et de la technique
      contemporaines serait favorisé par une extension de plus en plus grande du Système
      Métrique dans le monde entier,
  actions:
  - type: asks
    date_effective: '1960-10-20'
    message: que les Pays qui n'adhèrent pas encore à la Convention du Mètre, et notamment
      les Pays qui ont tout dernièrement acquis leur indépendance, ne tardent pas
      à accéder à cette Convention, et
  - type: recommends
    date_effective: '1960-10-20'
    message: à tous les Pays membres de la Convention d'exercer leur influence dans
      ce sens, en utilisant leurs liens scientifiques et techniques.
  - type: decides
    date_effective: '1960-10-20'
    message: 10.59161/CGPM1960RES14E
- dates:
  - '1960-10-20'
  subject: CGPM
  type: resolution
  title: Négociation d'un accord de siège avec le Gouvernment français
  identifier: '15'
  url: https://www.bipm.org/en/committees/cg/cgpm/11-1960/resolution-15
  reference: https://www.bipm.org/documents/20126/17314988/CGPM11.pdf/c626e1d6-4320-56d3-db37-c6f2a343483b?version=1.2&t=1587105011609&download=true#page=89
  reference_name: Proceedings of the 11th CGPM (1960), 1961, p89
  reference_page: 89
  approvals: []
  considerations:
  - type: considering
    date_effective: '1960-10-20'
    message: que le Bureau international des poids et mesures bénéficie de la généreuse
      hospitalité de la France, mais que, dans l'accomplissement de sa mission, il
      peut rencontrer certaines difficultés dues à l'application de règlements établis
      pour les ressortissants et établissements nationaux français ou étrangers se
      trouvant en France,
  actions:
  - type: decides
    date_effective: '1960-10-20'
    message: le Comité international des poids et mesures de négocier avec le Gouvernement
      français un accord de siège sur une base non discriminatoire par rapport aux
      accords de ce genre déjà conclus par ce Gouvernement avec d'autres institutions
      internationales, et
  - type: asks
    date_effective: '1960-10-20'
    message: que cet accord soit immédiatement mis en vigueur à titre provisoire en
      attendant son approbation par la Douzième Conférence générale.
  - type: decides
    date_effective: '1960-10-20'
    message: 10.59161/CGPM1960RES15E
